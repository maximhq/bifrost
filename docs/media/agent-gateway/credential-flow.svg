<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">Keep the caller's identity across agent, model, and tool calls</title>
<desc id="desc">The application sends its Bifrost virtual key. Agent Gateway validates and forwards it. The agent reuses it for Bifrost LLM and MCP gateway calls, which retain caller attribution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0C3B43"/></marker></defs>
<rect width="1000" height="530" rx="22" fill="#F5FAF8"/>
<g font-family="Inter, system-ui, sans-serif" fill="#0C3B43">
<text x="36" y="45" font-size="24" font-weight="700">Keep the caller's identity</text>
<text x="36" y="75" font-size="16" fill="#53696C">Enable Forward Bifrost authentication, then reuse the credential in your agent.</text>
<rect x="36" y="112" width="280" height="124" rx="14" fill="white" stroke="#C4D8D3"/>
<text x="56" y="147" font-size="21" font-weight="700">1. Your application</text>
<text x="56" y="178" font-size="16">Calls the registered agent</text>
<text x="56" y="208" font-size="15" font-family="monospace">x-bf-vk: caller-key</text>
<rect x="36" y="324" width="280" height="150" rx="14" fill="#0C3B43"/>
<g fill="white"><text x="56" y="361" font-size="21" font-weight="700">2. Agent Gateway</text>
<text x="56" y="393" font-size="16">Validates the caller's key</text>
<text x="56" y="421" font-size="16">Forwards it to the agent</text>
<text x="56" y="450" font-size="15" font-family="monospace">x-bf-vk: caller-key</text></g>
<rect x="650" y="324" width="314" height="150" rx="14" fill="white" stroke="#C4D8D3"/>
<text x="670" y="361" font-size="21" font-weight="700">3. Your agent</text>
<text x="670" y="393" font-size="16">Reuses the caller's key on</text>
<text x="670" y="421" font-size="16">Bifrost model and tool calls</text>
<text x="670" y="450" font-size="15" font-family="monospace">x-bf-vk: caller-key</text>
<rect x="650" y="112" width="314" height="124" rx="14" fill="#0C3B43"/>
<g fill="white"><text x="670" y="146" font-size="20" font-weight="700">4. Bifrost LLM / MCP gateway</text>
<text x="670" y="178" font-size="16">Applies the caller's access rules</text>
<text x="670" y="208" font-size="16">Attributes usage to the caller</text></g>
<g fill="none" stroke="#0C3B43" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M176 236V312"/><path d="M316 399H638"/><path d="M807 324V248"/>
</g>
<text x="194" y="284" font-size="15" fill="#53696C">Agent request</text>
<text x="483" y="380" font-size="15" text-anchor="middle" fill="#53696C">Forwarded credential</text>
<text x="630" y="287" font-size="15" fill="#53696C">Model / tool request</text>
</g></svg>
