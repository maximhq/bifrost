<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">One task, more than one message</title><desc id="desc">Reuse the task ID to continue work. Reuse the context ID for the conversation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C3B43"/></marker></defs>
<rect width="1120" height="320" rx="20" fill="#F5FAF8"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif">
<text x="36" y="45" font-size="23" font-weight="700" fill="#0C3B43">One task, more than one message</text>
<text x="36" y="73" font-size="15" fill="#53696C">Reuse the task ID to continue work. Reuse the context ID for the conversation.</text>
<rect x="35" y="135" width="195" height="120" rx="12" fill="#FFFFFF" stroke="#C4D8D3"/>
<text x="55" y="169" font-size="19" font-weight="650" fill="#0C3B43">Submitted</text>
<text x="55" y="197" font-size="14" fill="#0C3B43" opacity="0.85">“Plan a trip to Lisbon.”</text>
<text x="55" y="221" font-size="14" fill="#0C3B43" opacity="0.85">Agent creates a task</text>
<rect x="320" y="135" width="195" height="120" rx="12" fill="#0C3B43" stroke="#0C3B43"/>
<text x="340" y="169" font-size="19" font-weight="650" fill="#FFFFFF">Input required</text>
<text x="340" y="197" font-size="14" fill="#FFFFFF" opacity="0.85">“How many days?”</text>
<text x="340" y="221" font-size="14" fill="#FFFFFF" opacity="0.85">Same task waits for you</text>
<rect x="605" y="135" width="195" height="120" rx="12" fill="#FFFFFF" stroke="#C4D8D3"/>
<text x="625" y="169" font-size="19" font-weight="650" fill="#0C3B43">Working</text>
<text x="625" y="197" font-size="14" fill="#0C3B43" opacity="0.85">“Make it three days.”</text>
<text x="625" y="221" font-size="14" fill="#0C3B43" opacity="0.85">Continue the same task</text>
<rect x="890" y="135" width="195" height="120" rx="12" fill="#FFFFFF" stroke="#C4D8D3"/>
<text x="910" y="169" font-size="19" font-weight="650" fill="#0C3B43">Completed</text>
<text x="910" y="197" font-size="14" fill="#0C3B43" opacity="0.85">Itinerary and files</text>
<text x="910" y="221" font-size="14" fill="#0C3B43" opacity="0.85">Read the artifacts</text>
<path d="M 230 190 H 315" fill="none" stroke="#0C3B43" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="170" font-size="13" text-anchor="middle" fill="#53696C">accepted</text>
<path d="M 515 190 H 600" fill="none" stroke="#0C3B43" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="170" font-size="13" text-anchor="middle" fill="#53696C">reply</text>
<path d="M 800 190 H 885" fill="none" stroke="#0C3B43" stroke-width="2" marker-end="url(#arrow)"/>
<text x="845" y="170" font-size="13" text-anchor="middle" fill="#53696C">result</text>
</g></svg>