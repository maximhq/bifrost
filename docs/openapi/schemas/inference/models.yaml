# Models API schemas

ListModelsResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/Model'
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'
    next_page_token:
      type: string

Model:
  type: object
  properties:
    id:
      type: string
      description: Model ID in provider/model format
    canonical_slug:
      type: string
    name:
      type: string
    normalized_name:
      type: string
      description: Human-readable name derived from the Bifrost datasheet base model (e.g. "Claude Sonnet 4.5"). Only present when the model has a matching entry in the Bifrost pricing catalog.
    deployment:
      type: string
    created:
      type: integer
      format: int64
    context_length:
      type: integer
    max_input_tokens:
      type: integer
    max_output_tokens:
      type: integer
    architecture:
      $ref: '#/Architecture'
    pricing:
      $ref: '#/Pricing'
    top_provider:
      $ref: '#/TopProvider'
    per_request_limits:
      $ref: '#/PerRequestLimits'
    supported_parameters:
      type: array
      items:
        type: string
    default_parameters:
      $ref: '#/DefaultParameters'
    reasoning:
      $ref: '#/ModelReasoning'
    hugging_face_id:
      type: string
    description:
      type: string
    owned_by:
      type: string
    mode:
      type: string
      description: >-
        Preferred/default Bifrost API surface backfilled from catalog capability metadata when available and when the preferred catalog mode maps to a known endpoint. When a model has multiple catalog entries, one preferred mode is exposed (chat, then responses, then text completion, else deterministic fallback).
    supported_endpoints:
      type: array
      description: >-
        Canonical Bifrost endpoints derived from catalog capability metadata when available. This currently contains at most one preferred endpoint and is not an exhaustive list for multi-capable models.
      items:
        type: string
    supported_methods:
      type: array
      description: >-
        Supported methods reported by the provider when available. If the provider omits them, Bifrost backfills request-type identifiers derived from supported_endpoints (for example: chat_completion, responses, speech, image_generation).
      items:
        type: string

Architecture:
  type: object
  properties:
    modality:
      type: string
    tokenizer:
      type: string
    instruct_type:
      type: string
    input_modalities:
      type: array
      items:
        type: string
    output_modalities:
      type: array
      items:
        type: string

Pricing:
  type: object
  properties:
    prompt:
      type: string
    completion:
      type: string
    request:
      type: string
    image:
      type: string
    web_search:
      type: string
    internal_reasoning:
      type: string
    input_cache_read:
      type: string
    input_cache_write:
      type: string

TopProvider:
  type: object
  properties:
    is_moderated:
      type: boolean
    context_length:
      type: integer
    max_completion_tokens:
      type: integer

PerRequestLimits:
  type: object
  properties:
    prompt_tokens:
      type: integer
    completion_tokens:
      type: integer

DefaultParameters:
  type: object
  properties:
    temperature:
      type: number
    top_p:
      type: number
    frequency_penalty:
      type: number

ModelReasoning:
  type: object
  description: >-
    Reasoning capabilities advertised by the provider's list-models API
    (e.g. OpenRouter's per-model reasoning object). Fields are omitted when
    the provider does not report them; supported_efforts and default_effort
    are absent for models whose reasoning has no selectable effort level.
  properties:
    mandatory:
      type: boolean
    default_enabled:
      type: boolean
    supported_efforts:
      type: array
      items:
        type: string
    default_effort:
      type: string
