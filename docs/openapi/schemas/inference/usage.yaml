# Usage and cost related schemas

BifrostLLMUsage:
  type: object
  description: Token usage information
  properties:
    prompt_tokens:
      type: integer
      description: >
        Total input tokens including any prompt-cache tokens (read + write).
        Subtract prompt_tokens_details.cached_read_tokens and
        prompt_tokens_details.cached_write_tokens to get the non-cached portion.
    prompt_tokens_details:
      $ref: "#/ChatPromptTokensDetails"
    completion_tokens:
      type: integer
      description: Number of output/completion tokens generated.
    completion_tokens_details:
      $ref: "#/ChatCompletionTokensDetails"
    total_tokens:
      type: integer
    tool_usage:
      $ref: "#/ToolUsage"
    cost:
      $ref: "#/BifrostCost"

ToolUsage:
  type: object
  description: >
    Counts of provider-hosted (server-side) tool calls billed per call.
  properties:
    web_search:
      type: object
      properties:
        num_requests:
          type: integer
          description: Number of billable web search calls.

ChatPromptTokensDetails:
  type: object
  properties:
    text_tokens:
      type: integer
    audio_tokens:
      type: integer
    image_tokens:
      type: integer
    cached_read_tokens:
      type: integer
      description: >
        Tokens served from the prompt cache (cache hit). These tokens are already
        included in prompt_tokens and are billed at the reduced cache-read rate.
        Populated for all providers that support prompt caching (Anthropic, Bedrock,
        OpenAI, Gemini, xAI, etc.).
    cached_write_tokens:
      type: integer
      description: >
        Tokens written to the prompt cache on this request (cache creation / write).
        These tokens are already included in prompt_tokens and are billed at the
        cache-creation rate. Populated for providers that separately report cache
        write tokens (Anthropic, Bedrock).

ChatCompletionTokensDetails:
  type: object
  properties:
    text_tokens:
      type: integer
    accepted_prediction_tokens:
      type: integer
    audio_tokens:
      type: integer
    citation_tokens:
      type: integer
    num_search_queries:
      type: integer
      deprecated: true
      description: Deprecated, use tool_usage.web_search.num_requests. Will be removed in 3.0.0.
    reasoning_tokens:
      type: integer
    image_tokens:
      type: integer
    rejected_prediction_tokens:
      type: integer

BifrostCost:
  type: object
  description: |
    Cost breakdown in USD. total_cost is the cost; when the categories are filled in,
    input_cost + output_cost + additional_cost add up to it, and a provider that reports only
    a total (OpenRouter, Runware) gives total_cost alone. Zero fields are omitted. On usage.cost it is the provider's own figure (OpenRouter, Perplexity,
    xAI); on extra_fields.cost it is the cost Bifrost computed (send back cost).
  properties:
    input_cost:
      type: number
    input_cost_details:
      type: object
      properties:
        text_cost:
          type: number
        audio_cost:
          type: number
        image_cost:
          type: number
        cached_read_cost:
          type: number
        cached_write_cost:
          type: number
        request_cost:
          type: number
          description: Flat per-request surcharge (also OCR per page, container per session)
    output_cost:
      type: number
    output_cost_details:
      type: object
      properties:
        text_cost:
          type: number
        audio_cost:
          type: number
        image_cost:
          type: number
        reasoning_cost:
          type: number
          description: Cost for reasoning/thinking tokens (reasoning models)
        citation_cost:
          type: number
        search_queries_cost:
          type: number
          description: Cost for web search queries
    additional_cost:
      type: number
      description: Side calls with no token category
    additional_cost_details:
      type: object
      properties:
        guardrail_cost:
          type: number
          description: Guardrail judge calls
        mcp_cost:
          type: number
          description: MCP tool executions priced by the client's tool_pricing
        semantic_cache_cost:
          type: number
          description: The semantic cache's embedding lookup
        routing_cost:
          type: number
          description: Routing classification calls that count toward budgets
    total_cost:
      type: number