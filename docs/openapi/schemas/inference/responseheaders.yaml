  x-bifrost-request-id:
    $ref: '#/BifrostRequestId'
  x-bifrost-trace-id:
    $ref: '#/BifrostTraceId'
  x-request-id:
    $ref: '#/RequestIdLegacy'
  x-bifrost-routing-info-provider:
    $ref: '#/BifrostRoutingInfoProvider'
  x-bifrost-routing-info-model:
    $ref: '#/BifrostRoutingInfoModel'
  x-bifrost-routing-info-key:
    $ref: '#/BifrostRoutingInfoKey'
  x-bifrost-routing-info-requested-provider:
    $ref: '#/BifrostRoutingInfoRequestedProvider'
  x-bifrost-routing-info-requested-model:
    $ref: '#/BifrostRoutingInfoRequestedModel'
  x-bifrost-routing-info-is-fallback:
    $ref: '#/BifrostRoutingInfoIsFallback'
  x-bifrost-routing-info-primary-provider:
    $ref: '#/BifrostRoutingInfoPrimaryProvider'
  x-bifrost-routing-info-primary-model:
    $ref: '#/BifrostRoutingInfoPrimaryModel'
  x-bifrost-routing-info-alias-model-id:
    $ref: '#/BifrostRoutingInfoAliasModelId'
  x-bifrost-routing-info-alias-model-name:
    $ref: '#/BifrostRoutingInfoAliasModelName'
  x-bifrost-routing-info-alias-model-family:
    $ref: '#/BifrostRoutingInfoAliasModelFamily'
  x-bifrost-routing-info-server-side-fallback-model:
    $ref: '#/BifrostRoutingInfoServerSideFallbackModel'
  x-bifrost-request-type:
    $ref: '#/BifrostRequestType'
  x-bifrost-provider:
    $ref: '#/BifrostProvider'
  x-bifrost-original-model:
    $ref: '#/BifrostOriginalModel'
  x-bifrost-resolved-model:
    $ref: '#/BifrostResolvedModel'
  x-bifrost-fallback-index:
    $ref: '#/BifrostFallbackIndex'
  x-bifrost-upstream-latency-ms:
    $ref: '#/BifrostUpstreamLatencyMs'
  x-bifrost-cache-hit:
    $ref: '#/BifrostCacheHit'
  x-bifrost-cache-id:
    $ref: '#/BifrostCacheId'
  x-bifrost-cache-hit-type:
    $ref: '#/BifrostCacheHitType'
  x-bifrost-cache-hit-latency-ms:
    $ref: '#/BifrostCacheHitLatencyMs'
  x-bifrost-cache-requested-provider:
