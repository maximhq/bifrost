InferenceBadRequest:
  description: Bad request
  headers:
    $ref: '#/InferenceErrorHeaders'
  content:
    application/json:
      schema:
        $ref: './common.yaml#/BifrostError'

InferenceInternalError:
  description: Internal server error
  headers:
    $ref: '#/InferenceErrorHeaders'
  content:
    application/json:
      schema:
        $ref: './common.yaml#/BifrostError'
