# Image Generation Schemas

ImageGenerationRequest:
  allOf:
    - type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: Model identifier in format `provider/model`
        prompt:
          type: string
          description: Text prompt to generate image
        n:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of images to generate
        size:
          type: string
          enum:
            - "256x256"
            - "512x512"
            - "1024x1024"
            - "1792x1024"
            - "1024x1792"
            - "1536x1024"
            - "1024x1536"
            - "auto"
          description: Size of the generated image
        quality:
          type: string
          enum:
            - "auto"
            - "high"
            - "medium"
            - "low"
            - "hd"
            - "standard"
          description: Quality of the generated image
        style:
          type: string
          enum:
            - "natural"
            - "vivid"
          description: Style of the generated image
        response_format:
          type: string
          enum:
            - "url"
            - "b64_json"
            - "data_uri"
          default: "url"
          description: |
            Format of the response. `data_uri` is supported by providers that return an inline
            data URI (e.g. Runware).
        input_images:
          type: array
          items:
            type: string
          description: |
            Input images for image-to-image generation, as public URLs, provider-side asset IDs,
            or base64 data URIs. Providers that accept only a single input use the first entry.
        aspect_ratio:
          type: string
          description: Aspect ratio of the generated image (e.g. `16:9`), for providers that accept one in place of `size`
        type:
          type: string
          description: |
            Operation selector for providers that expose more than one generation task
            (e.g. `vectorize` for text-to-SVG on Runware). Omit for standard generation.
        background:
          type: string
          enum:
            - "transparent"
            - "opaque"
            - "auto"
          description: Background type for the image
        moderation:
          type: string
          enum:
            - "low"
            - "auto"
          description: Content moderation level
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
          description: Number of partial images to generate
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
          description: Compression level (0-100%)
        output_format:
          type: string
          enum:
            - "png"
            - "webp"
            - "jpeg"
            - "tiff"
            - "svg"
          description: Output image format. `svg` applies to vectorize operations
        user:
          type: string
          description: User identifier for tracking
        seed:
          type: integer
          description: Seed for reproducible image generation
        negative_prompt:
          type: string
          description: Negative prompt to guide what to avoid in generation
        num_inference_steps:
          type: integer
          description: Number of inference steps for generation
        stream:
          type: boolean
          default: false
          description: |
            Whether to stream the response. When true, images are sent as SSE.
            When streaming, providers may return base64 chunks (`b64_json`) and/or URLs (`url`) depending on provider and configuration.
        fallbacks:
          type: array
          items:
            $ref: "./common.yaml#/Fallback"
          description: Fallback models to try if primary model fails

ImageGenerationResponse:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the generation request
    created:
      type: integer
      format: int64
      description: Unix timestamp when the image was created
    model:
      type: string
      description: Model used for generation
    data:
      type: array
      items:
        $ref: "#/ImageData"
      description: Array of generated images
    background:
      type: string
      description: Background type for the image
    output_format:
      type: string
      enum:
        - "png"
        - "webp"
        - "jpeg"
      description: Output image format
    quality:
      type: string
      description: Quality of the generated image
    size:
      type: string
      enum:
        - "256x256"
        - "512x512"
        - "1024x1024"
        - "1792x1024"
        - "1024x1792"
        - "1536x1024"
        - "1024x1536"
        - "auto"
      description: Size of the generated image
    usage:
      $ref: "#/ImageUsage"
    extra_fields:
      $ref: "./common.yaml#/BifrostResponseExtraFields"

ImageData:
  type: object
  properties:
    id:
      type: string
      description: |
        Provider-side asset identifier, when one is assigned. Providers that accept their own
        asset IDs as inputs (e.g. Runware) allow this to be fed straight into a follow-up task.
    url:
      type: string
      format: uri
      description: URL of the generated image
    b64_json:
      type: string
      description: Base64-encoded image data
    revised_prompt:
      type: string
      description: Revised prompt used for generation
    index:
      type: integer
      description: Index of this image
    detections:
      type: array
      items:
        $ref: "#/ImageDetection"
      description: Regions located by a masking or segmentation operation

ImageDetection:
  type: object
  description: A region located by a masking model, in absolute input-image pixels
  properties:
    x_min:
      type: integer
    y_min:
      type: integer
    x_max:
      type: integer
    y_max:
      type: integer

ImageGenerationResponseParameters:
  type: object
  properties:
    background:
      type: string
    output_format:
      type: string
    quality:
      type: string
    size:
      type: string

ImageUsage:
  type: object
  properties:
    input_tokens:
      type: integer
      description: Number of input tokens
    input_tokens_details:
      $ref: "#/ImageTokenDetails"
    total_tokens:
      type: integer
      description: Total tokens used
    output_tokens:
      type: integer
      description: Number of output tokens
    output_tokens_details:
      $ref: "#/ImageTokenDetails"

ImageTokenDetails:
  type: object
  properties:
    image_tokens:
      type: integer
      description: Tokens used for images
    text_tokens:
      type: integer
      description: Tokens used for text

ImageGenerationStreamResponse:
  type: object
  description: |
    Streaming response chunk for image generation.
    Sent via Server-Sent Events (SSE).
    Providers may return either b64_json (base64-encoded image data) or url (public URL to the image).
  properties:
    id:
      type: string
      description: Request identifier
    type:
      type: string
      enum:
        - "image_generation.partial_image"
        - "image_generation.completed"
        - "error"
      description: Type of stream event
    partial_image_index:
      type: integer
      description: Index of the partial image chunk
    sequence_number:
      type: integer
      description: Sequence number for event ordering within the stream
    b64_json:
      type: string
      description: |
        Base64-encoded chunk of image data.
        Optional; either b64_json or url may be present.
    url:
      type: string
      format: uri
      description: |
        Optional public URL to the generated image chunk.
        Used by HuggingFace and other providers that return image URLs instead of base64 data.
    created_at:
      type: integer
      format: int64
      description: Timestamp when chunk was created
    size:
      type: string
      enum:
        - "256x256"
        - "512x512"
        - "1024x1024"
        - "1792x1024"
        - "1024x1792"
        - "1536x1024"
        - "1024x1536"
        - "auto"
      description: Size of the generated image
    quality:
      type: string
      description: Quality setting used
    background:
      type: string
      description: Background type used
    output_format:
      type: string
      enum:
        - "png"
        - "webp"
        - "jpeg"
      description: Output format used
    revised_prompt:
      type: string
      description: Revised prompt
    usage:
      $ref: "#/ImageUsage"
      description: Token usage
    error:
      $ref: "./common.yaml#/BifrostError"
      description: Error information if generation failed
    extra_fields:
      $ref: "./common.yaml#/BifrostResponseExtraFields"

# Image Edit Schemas (application/json and multipart/form-data)

ImageInput:
  description: |
    One source image, either as a bare string - the form `input_images` takes on
    /v1/images/generations - or as an object naming which arm it fills. Providers that cannot accept
    a given form reject it.
  oneOf:
    - type: string
      description: |
        Public URL, data URI, base64 payload, or provider-side asset ID. Equivalent to the object
        form's `url`.
    - type: object
      description: Exactly one of the two properties is expected.
      properties:
        url:
          type: string
          description: |
            Public URL, data URI, or provider-side asset ID, for providers whose upstream fetches
            the asset itself (e.g. Runware). Avoids round-tripping the asset through the gateway as
            base64.
        image:
          type: string
          format: byte
          description: Base64-encoded image bytes

ImageEditRequest:
  type: object
  description: |
    JSON encoding of an image edit. Sources are supplied as an `images` array, the same nested form
    /v1/videos/edits uses for its source video. Unrecognised top-level fields are forwarded to the
    provider as extra params with their JSON types intact, which is what a model's nested tuning
    object needs (e.g. Runware's `settings` and `providerSettings`). To upload the image as a file,
    post `multipart/form-data` instead - see `ImageEditMultipartRequest`.
  required:
    - model
    - images
  properties:
    model:
      type: string
      description: Model identifier in format `provider/model`
    images:
      type: array
      items:
        $ref: "#/ImageInput"
      description: |
        Source images. Entries carrying neither a URL nor bytes are dropped; a request left with no
        usable image is rejected. Providers treat the first image as the primary one (Runware's seed
        image, Bedrock's style-transfer base), so the order is part of the contract. Only the
        reference-image models accept more than one; elsewhere images after the first are dropped.
    prompt:
      type: string
      description: |
        Text prompt describing the edit. Required except for the operation types that are driven
        purely by the input image: `background_removal`, `erase_object`, `upscale`, `upscale_fast`,
        `mask`, `segmentation`, `vectorize` and `controlnet_preprocess`.
    mask:
      type: string
      format: byte
      description: |
        Optional base64-encoded mask image for inpainting (transparent areas indicate regions to
        edit). Dropped for models that declare no mask input.
    type:
      type: string
      enum:
        - "inpainting"
        - "outpainting"
        - "background_removal"
        - "remove_background"
        - "remove_bg"
        - "erase_object"
        - "recolor"
        - "search_replace"
        - "control_sketch"
        - "control_structure"
        - "style_guide"
        - "style_transfer"
        - "upscale"
        - "upscale_fast"
        - "upscale_creative"
        - "upscale_conservative"
        - "mask"
        - "segmentation"
        - "vectorize"
        - "controlnet_preprocess"
        - "controlnet"
        - "preprocess"
      description: |
        Type of edit operation. Support varies by provider; unsupported values are dropped and the
        request runs as a standard edit.
    upscale_factor:
      type: integer
      description: |
        Multiply each dimension by this factor. `type: "upscale"` only; mutually exclusive with
        `target_megapixels`.
    target_megapixels:
      type: integer
      description: |
        Target output size in megapixels. `type: "upscale"` only; mutually exclusive with
        `upscale_factor`.
    n:
      type: integer
      minimum: 1
      maximum: 10
      description: Number of images to generate
    size:
      type: string
      enum:
        - "256x256"
        - "512x512"
        - "1024x1024"
        - "1536x1024"
        - "1024x1536"
        - "auto"
      description: Size of the output image
    response_format:
      type: string
      enum:
        - "url"
        - "b64_json"
        - "data_uri"
      default: "url"
      description: |
        Format of the response. `data_uri` is supported by providers that return an inline
        data URI (e.g. Runware).
    stream:
      type: boolean
      default: false
      description: When true, stream the response via Server-Sent Events
    background:
      type: string
      enum:
        - "transparent"
        - "opaque"
        - "auto"
      description: Background type for the image
    input_fidelity:
      type: string
      enum:
        - "low"
        - "high"
      description: How closely to follow the original image
    partial_images:
      type: integer
      minimum: 0
      maximum: 3
      description: Number of partial images to generate when streaming
    quality:
      type: string
      enum:
        - "auto"
        - "high"
        - "medium"
        - "low"
        - "standard"
      description: Quality of the output image
    output_format:
      type: string
      enum:
        - "png"
        - "webp"
        - "jpeg"
        - "tiff"
        - "svg"
      description: Output image format. `svg` applies to vectorize operations
    num_inference_steps:
      type: integer
      description: Number of inference steps
    seed:
      type: integer
      description: Seed for reproducible editing
    output_compression:
      type: integer
      minimum: 0
      maximum: 100
      description: Compression level (0-100%)
    negative_prompt:
      type: string
      description: What to avoid in the edit
    user:
      type: string
      description: User identifier for tracking
    fallbacks:
      type: array
      items:
        $ref: "./common.yaml#/Fallback"
      description: Fallback models to try if primary model fails

ImageEditMultipartRequest:
  type: object
  description: |
    Multipart encoding of an image edit, and the only encoding that can upload the image as a file.
    This is what the official OpenAI SDKs send unconditionally. Every value crosses the wire as a
    string, so provider-native extra params arrive as strings; post `application/json` instead when
    a provider expects them as numbers, booleans or nested objects - see `ImageEditRequest`.
  required:
    - model
  properties:
    model:
      type: string
      description: Model identifier in format `provider/model`
    prompt:
      type: string
      description: |
        Text prompt describing the edit. Required except for the operation types that are driven
        purely by the input image: `background_removal`, `erase_object`, `upscale`, `upscale_fast`,
        `mask`, `segmentation`, `vectorize` and `controlnet_preprocess`.
    image:
      type: string
      format: binary
      description: |
        Image file to edit. Use field name `image` for a single file or `image[]` for multiple files.
        Either `image` or `image_url` is required.
    image_url:
      type: string
      description: |
        Input image as a public URL or provider-side asset ID, for providers whose upstream fetches
        the asset itself (e.g. Runware). Use `image_url` for one or `image_url[]` for several; this
        avoids round-tripping the asset through the gateway as base64. Uploads keep their leading
        position, and providers treat the first image as the primary one.
    mask:
      type: string
      format: binary
      description: |
        Optional mask image for inpainting (transparent areas indicate regions to edit). Dropped for
        models that declare no mask input.
    type:
      type: string
      enum:
        - "inpainting"
        - "outpainting"
        - "background_removal"
        - "remove_background"
        - "remove_bg"
        - "erase_object"
        - "recolor"
        - "search_replace"
        - "control_sketch"
        - "control_structure"
        - "style_guide"
        - "style_transfer"
        - "upscale"
        - "upscale_fast"
        - "upscale_creative"
        - "upscale_conservative"
        - "mask"
        - "segmentation"
        - "vectorize"
        - "controlnet_preprocess"
        - "controlnet"
        - "preprocess"
      description: |
        Type of edit operation. Support varies by provider; unsupported values are dropped and the
        request runs as a standard edit.
    upscale_factor:
      type: integer
      description: |
        Multiply each dimension by this factor. `type: "upscale"` only; mutually exclusive with
        `target_megapixels`.
    target_megapixels:
      type: integer
      description: |
        Target output size in megapixels. `type: "upscale"` only; mutually exclusive with
        `upscale_factor`.
    n:
      type: integer
      minimum: 1
      maximum: 10
      description: Number of images to generate
    size:
      type: string
      enum:
        - "256x256"
        - "512x512"
        - "1024x1024"
        - "1536x1024"
        - "1024x1536"
        - "auto"
      description: Size of the output image
    response_format:
      type: string
      enum:
        - "url"
        - "b64_json"
        - "data_uri"
      default: "url"
      description: |
        Format of the response. `data_uri` is supported by providers that return an inline
        data URI (e.g. Runware).
    stream:
      type: boolean
      default: false
      description: When true, stream the response via Server-Sent Events
    background:
      type: string
      enum:
        - "transparent"
        - "opaque"
        - "auto"
      description: Background type for the image
    input_fidelity:
      type: string
      enum:
        - "low"
        - "high"
      description: How closely to follow the original image
    partial_images:
      type: integer
      minimum: 0
      maximum: 3
      description: Number of partial images to generate when streaming
    quality:
      type: string
      enum:
        - "auto"
        - "high"
        - "medium"
        - "low"
        - "standard"
      description: Quality of the output image
    output_format:
      type: string
      enum:
        - "png"
        - "webp"
        - "jpeg"
        - "tiff"
        - "svg"
      description: Output image format. `svg` applies to vectorize operations
    num_inference_steps:
      type: integer
      description: Number of inference steps
    seed:
      type: integer
      description: Seed for reproducible editing
    output_compression:
      type: integer
      minimum: 0
      maximum: 100
      description: Compression level (0-100%)
    negative_prompt:
      type: string
      description: What to avoid in the edit
    user:
      type: string
      description: User identifier for tracking
    fallbacks:
      type: array
      items:
        $ref: "./common.yaml#/Fallback"
      description: Fallback models to try if primary model fails

# Image Variation Schemas (multipart/form-data)

ImageVariationRequest:
  type: object
  required:
    - model
    - image
  properties:
    model:
      type: string
      description: Model identifier in format `provider/model`
    image:
      type: string
      format: binary
      description: |
        Image file to create variations of. Use field name `image` for a single file or `image[]` for multiple (first image is used).
    n:
      type: integer
      minimum: 1
      maximum: 10
      description: Number of variations to generate
    size:
      type: string
      enum:
        - "256x256"
        - "512x512"
        - "1024x1024"
        - "1792x1024"
        - "1024x1792"
        - "1536x1024"
        - "1024x1536"
        - "auto"
      description: Size of the output images
    response_format:
      type: string
      enum:
        - "url"
        - "b64_json"
      default: "url"
      description: Format of the response
    user:
      type: string
      description: User identifier for tracking
    fallbacks:
      type: array
      items:
        $ref: "./common.yaml#/Fallback"
      description: Fallback models to try if primary model fails

# Image Edit Streaming (SSE)

ImageEditStreamResponse:
  type: object
  description: |
    Streaming response chunk for image edit.
    Sent via Server-Sent Events (SSE) when `stream=true`.
  properties:
    id:
      type: string
      description: Request identifier
    type:
      type: string
      enum:
        - "image_edit.partial_image"
        - "image_edit.completed"
        - "error"
      description: Type of stream event
    partial_image_index:
      type: integer
      description: Index of the partial image chunk
    sequence_number:
      type: integer
      description: Sequence number for event ordering within the stream
    b64_json:
      type: string
      description: Base64-encoded chunk of image data; optional
    url:
      type: string
      format: uri
      description: Optional public URL to the image chunk
    created_at:
      type: integer
      format: int64
      description: Timestamp when chunk was created
    size:
      type: string
      description: Size of the image
    quality:
      type: string
      description: Quality setting used
    background:
      type: string
      description: Background type used
    output_format:
      type: string
      enum:
        - "png"
        - "webp"
        - "jpeg"
      description: Output format used
    revised_prompt:
      type: string
      description: Revised prompt
    usage:
      $ref: "#/ImageUsage"
      description: Token usage
    error:
      $ref: "./common.yaml#/BifrostError"
      description: Error information if edit failed
    extra_fields:
      $ref: "./common.yaml#/BifrostResponseExtraFields"