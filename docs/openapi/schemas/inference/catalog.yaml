CodexCatalogResponse:
  type: object
  required:
  - models
  properties:
    models:
      type: array
      items:
        type: object
        required:
        - slug
        - display_name
        - description
        - base_instructions
        - supported_reasoning_levels
        - shell_type
        - visibility
        - supported_in_api
        - priority
        - support_verbosity
        - supports_reasoning_summary_parameter
        - input_modalities
        - experimental_supported_tools
        - truncation_policy
        properties:
          slug:
            type: string
            examples:
            - openai/gpt-5
            description: Exact provider/model identifier.
          display_name:
            type: string
            description: Same provider/model identifier as slug.
          description:
            type: string
            description: Model description from catalog metadata, or an empty string.
          base_instructions:
            type: string
            enum:
            - You are a coding assistant.
          default_reasoning_level:
            type: string
            description: Omitted unless model capabilities advertise a default present in supported_reasoning_levels.
          supported_reasoning_levels:
            type: array
            description: Advertised reasoning effort levels; empty when unavailable.
            items:
              type: object
              required:
              - effort
              - description
              properties:
                effort:
                  type: string
                description:
                  type: string
                  description: Same value as effort.
          shell_type:
            type: string
            enum:
            - shell_command
            description: Backward-compatible Codex shell type alias.
          visibility:
            type: string
            enum:
            - list
          supported_in_api:
            type: boolean
            enum:
            - true
          priority:
            type: integer
            minimum: 0
            description: Zero-based position in the deterministically ordered exported list.
          support_verbosity:
            type: boolean
            enum:
            - false
          supports_reasoning_summary_parameter:
            type: boolean
            enum:
            - false
          context_window:
            type: integer
            description: Context length from metadata, falling back to maximum input tokens; omitted when
              unknown.
          input_modalities:
            type: array
            description: Text plus supported image/audio modalities from model architecture; defaults
              to text.
            items:
              type: string
              enum:
              - text
              - image
              - audio
          experimental_supported_tools:
            type: array
            description: Empty; no experimental tools are advertised.
            items:
              type: string
            maxItems: 0
          truncation_policy:
            type: object
            required:
            - mode
            - limit
            properties:
              mode:
                type: string
                enum:
                - tokens
              limit:
                type: integer
                enum:
                - 10000
ClaudeCatalogResponse:
  type: object
  required:
  - data
  - has_more
  - first_id
  - last_id
  properties:
    data:
      type: array
      items:
        type: object
        required:
        - id
        - type
        - display_name
        - created_at
        properties:
          id:
            type: string
            examples:
            - anthropic/claude-sonnet-4-6
            description: Exact provider/model identifier; not an alias.
          type:
            type: string
            enum:
            - model
          display_name:
            type: string
            description: Same provider/model identifier as id.
          description:
            type: string
            description: Description from model metadata; omitted when empty.
          created_at:
            type: string
            format: date-time
            enum:
            - '1970-01-01T00:00:00Z'
            description: Stable placeholder because the catalog has no creation timestamps.
    has_more:
      type: boolean
      enum:
      - false
    first_id:
      type:
      - string
      - 'null'
      description: First exported model ID, or null for an empty list.
    last_id:
      type:
      - string
      - 'null'
      description: Last exported model ID, or null for an empty list.
PiCatalogResponse:
  type: object
  required:
  - providers
  properties:
    providers:
      type: object
      required:
      - bifrost
      properties:
        bifrost:
          type: object
          required:
          - baseUrl
          - api
          - apiKey
          - authHeader
          - models
          properties:
            baseUrl:
              type: string
            api:
              type: string
              enum:
              - openai-completions
            apiKey:
              type: string
              enum:
              - $BIFROST_VIRTUAL_KEY
            authHeader:
              type: boolean
              enum:
              - true
            models:
              type: array
              items:
                type: object
                required:
                - id
                - name
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  reasoning:
                    type: boolean
                  input:
                    type: array
                    items:
                      type: string
                      enum:
                      - text
                      - image
                  contextWindow:
                    type: integer
                  maxTokens:
                    type: integer
                  cost:
                    type: object
                    properties:
                      input:
                        type: number
                      output:
                        type: number
                      cacheRead:
                        type: number
                      cacheWrite:
                        type: number
                    required:
                    - input
                    - output
                    - cacheRead
                    - cacheWrite
                  compat:
                    type: object
                    properties:
                      supportsReasoningEffort:
                        type: boolean
                  thinkingLevelMap:
                    type: object
                    additionalProperties:
                      type:
                      - string
                      - 'null'
OpenCodeCatalogResponse:
  type: object
  required:
  - providers
  properties:
    $schema:
      type: string
    providers:
      type: object
      required:
      - bifrost
      properties:
        bifrost:
          type: object
          required:
          - name
          - package
          - env
          - settings
          - models
          properties:
            name:
              type: string
              enum:
              - Bifrost
            package:
              type: string
              enum:
              - '@opencode/ai/providers/openai-compatible'
            env:
              type: array
              items:
                type: string
                enum:
                - BIFROST_VIRTUAL_KEY
            settings:
              type: object
              required:
              - baseURL
              properties:
                baseURL:
                  type: string
            models:
              type: object
              additionalProperties:
                type: object
                required:
                - modelID
                - name
                properties:
                  modelID:
                    type: string
                  name:
                    type: string
                  limit:
                    type: object
                    properties:
                      context:
                        type: integer
                      input:
                        type: integer
                      output:
                        type: integer
                  cost:
                    type: object
                    required:
                    - input
                    - output
                    properties:
                      input:
                        type: number
                      output:
                        type: number
                      cache:
                        type: object
                        properties:
                          read:
                            type: number
                          write:
                            type: number
                  capabilities:
                    type: object
                    properties:
                      reasoning:
                        type: object
                        properties:
                          supported:
                            type: boolean
                          effort:
                            type: array
                            items:
                              type: string
                          toggle:
                            type: boolean
                      input:
                        type: array
                        items:
                          type: string
                      output:
                        type: array
                        items:
                          type: string
                      tools:
                        type: boolean
