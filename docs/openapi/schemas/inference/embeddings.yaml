# Embedding schemas

EmbeddingRequest:
  type: object
  required:
    - model
    - input
  properties:
    model:
      type: string
      description: Model in provider/model format
    input:
      $ref: '#/EmbeddingInput'
    fallbacks:
      type: array
      items:
        type: string
    encoding_format:
      type: string
      enum: [float, base64]
    dimensions:
      type: integer
    task_type:
      type: string
      description: Intended downstream task (Gemini/Vertex text embeddings, e.g. RETRIEVAL_QUERY)
    title:
      type: string
      description: Optional document title used alongside task_type=RETRIEVAL_DOCUMENT
    auto_truncate:
      type: boolean
      description: Truncate inputs longer than the model's limit instead of erroring (Vertex text embeddings)

EmbeddingInputItem:
  description: |
    One entry of an embedding request's input - one item in, one embedding out.
    Accepts either shape:

      [{"type": "text", "text": "hi"}]
      {"content": [{"type": "text", "text": "hi"}], "params": {"task_type": "RETRIEVAL_QUERY"}}

    `params` overrides the request-level parameters for this item alone. Only providers with
    a per-item wire format honour it (currently Gemini's `:batchEmbedContents`); others reject
    the request rather than silently ignoring the override.
  oneOf:
    - $ref: '#/EmbeddingContent'
    - type: object
      required:
        - content
      properties:
        content:
          $ref: '#/EmbeddingContent'
        params:
          $ref: '#/EmbeddingParameters'

EmbeddingParameters:
  type: object
  properties:
    encoding_format:
      type: string
      enum: [float, base64]
    dimensions:
      type: integer
    task_type:
      type: string
    title:
      type: string
    auto_truncate:
      type: boolean

EmbeddingInput:
  oneOf:
    - type: string
      description: A single text to embed
    - type: array
      items:
        type: string
      description: Several texts, one embedding each
    - type: array
      items:
        type: integer
      description: A single pre-tokenized input (OpenAI-compatible providers only)
    - type: array
      items:
        type: array
        items:
          type: integer
      description: Several pre-tokenized inputs (OpenAI-compatible providers only)
    - type: array
      items:
        $ref: '#/EmbeddingInputItem'
      description: |
        Multimodal form. Each element is one input item and produces one embedding; the
        parts inside an item are aggregated into that single vector. An element may be a
        bare array of parts, or an object carrying that item's own `params`.
  description: Text, pre-tokenized input, or multimodal content

EmbeddingContent:
  type: array
  minItems: 1
  items:
    $ref: '#/EmbeddingContentPart'
  description: One content entry - a list of typed parts aggregated into a single embedding

EmbeddingContentPart:
  type: object
  description: |
    Exactly one modality field must be set, and it must match `type`.
    Provider support varies - see the provider pages for which part types each model accepts.
  required:
    - type
  properties:
    type:
      type: string
      enum: [text, image, audio, file, video, tokens]
    text:
      type: string
    image:
      $ref: '#/EmbeddingMediaPart'
    audio:
      $ref: '#/EmbeddingMediaPart'
    file:
      $ref: '#/EmbeddingMediaPart'
    video:
      $ref: '#/EmbeddingMediaPart'
    video_config:
      $ref: '#/EmbeddingVideoConfig'
    tokens:
      type: array
      items:
        type: integer

EmbeddingMediaPart:
  type: object
  description: Exactly one of `data` or `url` must be set.
  properties:
    data:
      type: string
      description: Inline payload - a data URI (`data:<mime>;base64,<...>`) or a bare base64 string
    url:
      type: string
      description: |
        Remote reference. Vertex `multimodalembedding@001` requires a GCS URI (`gs://...`).
    mime_type:
      type: string
    filename:
      type: string

EmbeddingVideoConfig:
  type: object
  description: Optional video segment selection, honoured by providers that return per-segment embeddings.
  properties:
    start_offset_sec:
      type: integer
    end_offset_sec:
      type: integer
    interval_sec:
      type: integer
      description: Gap between embeddings in seconds (minimum 4)

EmbeddingResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/EmbeddingData'
    model:
      type: string
    object:
      type: string
    usage:
      $ref: './usage.yaml#/BifrostLLMUsage'
    extra_fields:
      $ref: './common.yaml#/BifrostResponseExtraFields'

EmbeddingData:
  type: object
  properties:
    index:
      type: integer
      description: Index of the input this vector belongs to
    object:
      type: string
    modality:
      type: string
      enum: [text, image, video, audio]
      description: |
        Set only when the provider returns one vector per modality for a single input
        (Vertex `multimodalembedding@001`). Absent when a single unified vector is returned.
    video_segment:
      $ref: '#/EmbeddingVideoSegment'
    encoding_format:
      type: string
      enum: [float, int8, uint8, binary, ubinary, base64]
      description: |
        Set when the provider returns several representations of the same input
        (Cohere `embedding_types`), since int8/binary and uint8/ubinary are otherwise
        indistinguishable once decoded.
    embedding:
      $ref: '#/EmbeddingStruct'

EmbeddingVideoSegment:
  type: object
  description: Time range this video embedding covers. Present only when `modality` is `video`.
  properties:
    start_offset_sec:
      type: integer
    end_offset_sec:
      type: integer

EmbeddingStruct:
  oneOf:
    - type: string
    - type: array
      items:
        type: number
    - type: array
      items:
        type: array
        items:
          type: number
    - type: array
      items:
        type: integer
