# Web tools schemas (Search and Fetch)
#
# Neither operation takes a model upstream. "model" is accepted only as a gateway routing
# handle so a virtual key's allowlist has something to gate on.

SearchRequest:
  type: object
  required:
    - query
  description: |
    A provider-neutral web search. Each provider refuses a bound or filter it cannot honour
    with a 400 rather than dropping it. Options only one provider has (DeepSeek's
    `ori_question` and `localization`) are sent as additional top-level fields.
  additionalProperties: true
  properties:
    model:
      type: string
      description: |
        Optional routing handle, either a provider name alone (`exa`) or provider/model
        (`deepseek/deepseek-chat`). Search carries no model upstream; omit this and the
        gateway routes to DeepSeek.
      example: deepseek/deepseek-chat
    query:
      type: string
      minLength: 1
      description: |
        Search query. Providers bound its length differently (DeepSeek: 128 characters) and
        some pass operators through unchanged.
      example: go generics
    max_results:
      type: integer
      minimum: 1
      description: 'Number of results to return. Providers cap it differently (DeepSeek: 50).'
    include_content:
      type: boolean
      default: false
      description: When true, each result carries page text in content. Increases response size.
    include_domains:
      type: array
      items:
        type: string
      description: Only return results from these domains.
    exclude_domains:
      type: array
      items:
        type: string
      description: Never return results from these domains.
    published_after:
      type: string
      description: Only return pages published after this RFC 3339 date or date-time.
      example: '2026-01-01'
    published_before:
      type: string
      description: Only return pages published before this RFC 3339 date or date-time.
    fallbacks:
      type: array
      items:
        type: string
      description: Fallback providers, each a provider name alone or provider/model. An unknown provider is refused.

SearchResult:
  type: object
  required:
    - url
  properties:
    url:
      type: string
    title:
      type: string
    snippet:
      type: string
      description: Display-length excerpt, when the provider returns one.
    content:
      type: string
      description: Page text, present only when include_content was true.
    published_at:
      type: string
      nullable: true
      description: RFC 3339 publication date, or null when unknown.
    score:
      type: number
      nullable: true
      description: The provider's own relevance score. Not comparable across providers.
    provider_fields:
      type: object
      additionalProperties: true
      description: |
        What only this provider returns, under its own names. DeepSeek: summary, site_name,
        site_icon and authority (0-4, -1 when unknown).

SearchResponse:
  type: object
  required: [results]
  properties:
    results:
      type: array
      description: An empty array is a normal no-match answer, not an error.
      items:
        $ref: '#/SearchResult'
    usage:
      type: object
      description: Carries the flat per-request cost of this call.
      properties:
        cost:
          type: object
          properties:
            total_cost:
              type: number
              example: 0.00075
    extra_fields:
      type: object
      description: Bifrost metadata (latency, provider, request type, headers).

FetchRequest:
  type: object
  required:
    - url
  properties:
    model:
      type: string
      description: Optional routing handle; fetch carries no model upstream.
    url:
      type: string
      maxLength: 8192
      description: Absolute HTTP(S) URL with a host and no embedded credentials.
      example: https://example.com/page
    fallbacks:
      type: array
      items:
        type: string
      description: Fallback providers, each a provider name alone or provider/model. An unknown provider is refused.

FetchResponse:
  type: object
  required: [content]
  properties:
    title:
      type: string
      description: Empty when the upstream could not determine one.
    content:
      type: string
      description: The page as Markdown.
    usage:
      type: object
      description: Carries the flat per-request cost of this call.
      properties:
        cost:
          type: object
          properties:
            total_cost:
              type: number
              example: 0.00075
    extra_fields:
      type: object
      description: Bifrost metadata (latency, provider, request type, headers).
