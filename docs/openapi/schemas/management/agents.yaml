AgentCreateRequest:
  type: object
  properties:
    name:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 255
    agent_card_url:
      type: string
      description: Absolute HTTP(S) Agent Card URL without URL user information.
    enabled:
      type: boolean
      default: true
    allow_by_default:
      type: boolean
      description: Allow any valid virtual key to access this agent without an explicit grant.
    forward_accepted_credential:
      type: boolean
      description: Forward the credential accepted by Bifrost to the upstream agent.
    forward_accepted_credential_overrides_auth:
      type: boolean
      description: Allow the forwarded credential to override configured upstream authentication.
    discovery_auth:
      $ref: '#/AgentUpstreamAuth'
    runtime_auth:
      $ref: '#/AgentUpstreamAuth'
    credential_origins:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        pattern: '^https?://[^@/?#\s]+$'
      description: >
        Additional HTTP(S) origins permitted for runtime requests, including
        configured credentials, caller-provided upstream headers, forwarded
        Bifrost credentials, and TLS client certificates. Every runtime endpoint
        must pass this policy. The card origin is permitted automatically. Include scheme
        and optional port; paths, userinfo, queries, and fragments are forbidden.
        Private destinations also need permission in a2a_private_allowlist.
        Nonempty values require dashboard authentication.
    virtual_key_ids:
      type: array
      items:
        type: string
      description: Virtual key IDs granted access to the agent. Empty and duplicate IDs are rejected.
  required:
  - name
  - agent_card_url
AgentUpstreamAuth:
  type: object
  properties:
    type:
      type: string
      enum:
      - none
      - headers
      - oauth
    headers:
      type: object
      additionalProperties:
        $ref: ./common.yaml#/EnvVar
    oauth:
      $ref: '#/AgentUpstreamOAuthConfig'
    security_schemes:
      type: array
      items:
        type: string
    advanced:
      type: boolean
    tls:
      $ref: '#/AgentUpstreamTLSConfig'
  required:
  - type
  description: Shared upstream authentication. Header auth requires nonempty headers. OAuth uses client
    credentials and requires client_id, client_secret, and a token, discovery, or provider URL. Interactive
    OAuth is not supported. Using environment or vault secret references requires
    dashboard authentication for card inspection, creation, and updates. Operator
    declarations in config.json may use these references. Preserving stored secrets
    through masked placeholders on an update also requires dashboard authentication.
AgentUpstreamOAuthConfig:
  type: object
  properties:
    provider_url:
      type: string
    discovery_url:
      type: string
    token_url:
      type: string
    client_id:
      $ref: ./common.yaml#/EnvVar
    client_secret:
      $ref: ./common.yaml#/EnvVar
    scopes:
      type: array
      items:
        type: string
    resource:
      type: string
  required:
  - client_id
  - client_secret
AgentUpstreamTLSConfig:
  type: object
  properties:
    insecure_skip_verify:
      type: boolean
    ca_cert_pem:
      $ref: ./common.yaml#/EnvVar
    client_cert_pem:
      $ref: ./common.yaml#/EnvVar
    client_key_pem:
      $ref: ./common.yaml#/EnvVar
AgentUpdateRequest:
  type: object
  properties:
    agent_card_url:
      type: string
      description: Absolute HTTP(S) Agent Card URL without URL user information.
    enabled:
      type: boolean
    allow_by_default:
      type: boolean
      description: Allow any valid virtual key to access this agent without an explicit grant.
    forward_accepted_credential:
      type: boolean
      description: Forward the credential accepted by Bifrost to the upstream agent.
    forward_accepted_credential_overrides_auth:
      type: boolean
      description: Allow the forwarded credential to override configured upstream authentication.
    discovery_auth:
      $ref: '#/AgentUpstreamAuth'
    runtime_auth:
      $ref: '#/AgentUpstreamAuth'
    credential_origins:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        pattern: '^https?://[^@/?#\s]+$'
      description: >
        Additional HTTP(S) origins permitted for runtime requests, including
        configured credentials, caller-provided upstream headers, forwarded
        Bifrost credentials, and TLS client certificates. Every runtime endpoint
        must pass this policy. The card origin is permitted automatically. Include scheme
        and optional port; paths, userinfo, queries, and fragments are forbidden.
        Private destinations also need permission in a2a_private_allowlist.
        Nonempty values require dashboard authentication. Omit or send [] to clear.
    virtual_key_ids:
      type: array
      items:
        type: string
      description: Virtual key IDs granted access to the agent. Empty and duplicate IDs are rejected.
  required:
  - agent_card_url
  - enabled
  description: Full replacement. Omitted optional fields are cleared. Masked credential placeholders preserve
    stored secrets.
