    supportedInterfaces:
      type: array
      items:
        $ref: '#/A2AAgentInterface'
    capabilities:
      $ref: '#/A2AAgentCapabilities'
    defaultInputModes:
      type: array
      items:
        type: string
    defaultOutputModes:
      type: array
      items:
        type: string
    description:
      type: string
    documentationUrl:
      type: string
    iconUrl:
      type: string
    name:
      type: string
    provider:
      $ref: '#/A2AAgentProvider'
    securityRequirements:
      type: array
      items:
        type: object
        required:
        - schemes
        properties:
          schemes:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    securitySchemes:
      type: object
      additionalProperties:
        type: object
        description: A2A v1 security scheme with one of apiKeySecurityScheme, httpAuthSecurityScheme,
          mtlsSecurityScheme, oauth2SecurityScheme, or openIdConnectSecurityScheme.
        additionalProperties: true
    signatures:
      type: array
      items:
        $ref: '#/A2AAgentCardSignature'
    skills:
      type: array
      items:
        $ref: '#/A2AAgentSkill'
    version:
      type: string
  required:
  - supportedInterfaces
  - capabilities
  - defaultInputModes
  - defaultOutputModes
  - description
  - name
  - skills
  - version
