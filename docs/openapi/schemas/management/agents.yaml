    capabilities:
      type: object
      additionalProperties:
        type: boolean
    default_input_modes:
      type: array
      items:
        type: string
    default_output_modes:
      type: array
      items:
        type: string
    skills:
      type: array
      items:
        $ref: '#/AgentInspectedAgentSkill'
    extensions:
      type: array
      items:
        $ref: '#/AgentInspectedAgentExtension'
    signature_count:
      type: integer
    security_schemes:
      type: array
      items:
        $ref: '#/AgentInspectedSecurityScheme'
    security_requirements:
      type: array
      items:
        type: array
        items:
          type: string
    warnings:
      type: array
      items:
        type: string
  required:
  - capabilities
  - signature_count
  - security_schemes
  - security_requirements
