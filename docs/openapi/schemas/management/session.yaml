# Session API schemas

LoginRequest:
  type: object
  description: Login request
  required:
    - username
    - password
  properties:
    username:
      type: string
    password:
      type: string

LoginResponse:
  type: object
  description: Login response
  properties:
    message:
      type: string
      example: Login successful
    token:
      type: string
      description: Session token

IsAuthEnabledResponse:
  type: object
  description: Auth enabled status response
  properties:
    is_auth_enabled:
      type: boolean
      description: Whether dashboard/admin session authentication is enabled.
    has_valid_token:
      type: boolean
    auth_type:
      type: string
      enum: [none, password]
      description: Dashboard session auth mode.
    inference_auth_enforced:
      type: boolean
      description: >-
        Whether enforce_auth_on_inference is on. This is a separate control from
        is_auth_enabled. It requires a valid inference credential (virtual key, API key,
        or user token) on every inference route, including the /v1/* routes and the
        provider SDK integration routes. A locked dashboard (is_auth_enabled: true) does
        not by itself protect inference. Check this field too.

LogoutResponse:
  type: object
  description: Logout response
  properties:
    message:
      type: string
      example: Logout successful
