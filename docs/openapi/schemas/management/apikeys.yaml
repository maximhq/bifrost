# API Keys management schemas

APIKey:
  type: object
  description: |
    A management API key. The key value itself is never returned after creation —
    only the truncated `key_prefix` is, so keys can be told apart in a list.
  properties:
    id:
      type: integer
      format: uint
      description: Server-assigned identifier, used in the path of the by-id routes.
    name:
      type: string
      description: Unique, human-readable name.
    key_prefix:
      type: string
      description: |
        Truncated, non-secret form of the key for display, such as
        `bfst-A1b2C3d4...`. Not accepted for authentication.
      example: bfst-A1b2C3d4...
    description:
      type: string
      nullable: true
      description: Optional free-text note about what the key is for.
    scopes:
      type: array
      items:
        type: integer
        format: uint
      description: |
        Permission ids granted to this key. Each id is an RBAC (resource, operation)
        pair from `GET /api/governance/rbac/permissions`.
    created_by_user_id:
      type: string
      nullable: true
      description: |
        User who created the key. Null when the deployment has no user identity on
        the request (no-auth, password-only, or local-admin modes).
    expires_at:
      type: string
      format: date-time
      nullable: true
      description: Expiry timestamp, or null if the key never expires.
    last_used_at:
      type: string
      format: date-time
      nullable: true
      description: Last time the key authenticated a request, or null if never used.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

APIKeyRequest:
  type: object
  required:
    - name
  description: |
    Create or update body for a management API key. The key value is generated by
    the server and can never be supplied or changed here.
  properties:
    name:
      type: string
      description: |
        Unique name for the key. Required on create; on update, an empty or omitted
        value leaves the existing name unchanged.
    description:
      type: string
      nullable: true
      description: Optional note about what the key is for.
    scopes:
      type: array
      items:
        type: integer
        format: uint
      description: |
        Permission ids to grant, from `GET /api/governance/rbac/permissions`. A key
        carries only the permissions listed here — the creator's own role is not
        inherited. You cannot grant a permission you do not hold yourself; doing so
        returns 403. Omit on update to leave the current scopes unchanged.
    expires_at:
      type: string
      format: date-time
      nullable: true
      description: |
        Expiry timestamp in RFC3339 format. Omit or send null for a key that never
        expires; on update, send an empty string to clear an existing expiry.

APIKeyResponse:
  type: object
  properties:
    api_key:
      $ref: '#/APIKey'

APIKeyCreatedResponse:
  type: object
  description: |
    Creation response. This is the only time the full key value is returned —
    store it immediately, as it cannot be retrieved again.
  properties:
    api_key:
      $ref: '#/APIKey'
    key:
      type: string
      description: |
        The full key value, shown only once. Send it in the `Authorization` header
        as `Bearer <key>`.
      example: bfst-A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8S9t0U1v2

APIKeyList:
  type: object
  properties:
    api_keys:
      type: array
      items:
        $ref: '#/APIKey'
    count:
      type: integer
      description: Number of keys in this response.
    total_count:
      type: integer
      description: |
        Total keys matching the query. Equal to `count` unless a paginated request
        (`limit`, `offset`, or `search`) was made.
    limit:
      type: integer
    offset:
      type: integer
