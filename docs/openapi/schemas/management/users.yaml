UserObject:
  type: object
  properties:
    id:
      type: string
      description: Unique user identifier
    name:
      type: string
      description: User's display name
    email:
      type: string
      format: email
      description: User's email address
    role_id:
      type: integer
      nullable: true
      description: ID of the assigned RBAC role
    role:
      type: object
      nullable: true
      description: RBAC role details
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_system_role:
          type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    teams:
      type: array
      description: Teams the user belongs to.
      items:
        $ref: '#/UserTeamSummaryEntry'
    access_profile:
      $ref: '#/AccessProfile'

CreateUserRequest:
  type: object
  required:
    - name
    - email
  properties:
    name:
      type: string
      description: User's display name
    email:
      type: string
      format: email
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: User's email address (must be unique)
    role_id:
      type: integer
      description: Optional RBAC role ID to assign

UserResponse:
  type: object
  properties:
    user:
      $ref: '#/UserObject'

ListUsersResponse:
  type: object
  required: [users, count, total_count, limit, offset]
  properties:
    users:
      type: array
      items:
        $ref: '#/UserObject'
    count:
      type: integer
      description: Number of users in this response
    total_count:
      type: integer
      description: Total number of users matching the query
    limit:
      type: integer
      description: Requested page size, or the returned collection size when unpaged
    offset:
      type: integer
      description: Zero-based result offset

UserGovernanceRequest:
  type: object
  description: User-scoped governance settings. POST creates settings and PUT partially updates them.
  properties:
    user_id:
      type: string
      description: Optional body copy of the path user ID. When present, it must match the path.
    budget:
      $ref: './governance.yaml#/CreateBudgetRequest'
    budgets:
      type: array
      items:
        $ref: './governance.yaml#/CreateBudgetRequest'
    rate_limit:
      $ref: './governance.yaml#/CreateRateLimitRequest'
    provider_configs:
      type: array
      description: Optional Enterprise per-provider governance overrides.
      items:
        type: object
        additionalProperties: true

# ---- User Permissions ----

PermissionsResponse:
  type: object
  properties:
    permissions:
      type: object
      description: >
        Map of resource names to their permitted operations.
        When SCIM is disabled, returns full permissions for all resources.
      additionalProperties:
        type: object
        additionalProperties:
          type: boolean

# ---- User Role ----

AssignUserRoleRequest:
  type: object
  required:
    - role_id
  properties:
    role_id:
      type: integer
      description: ID of the RBAC role to assign

# ---- User Teams ----

UserTeamSummaryEntry:
  type: object
  properties:
    id:
      type: string
      description: Team ID
    name:
      type: string
      description: Team name
    business_unit_id:
      type: string
      nullable: true
      description: Business unit ID associated with this team (if any)
    business_unit_name:
      type: string
      nullable: true
      description: Business unit name associated with this team (if any)

UserTeamEntry:
  type: object
  properties:
    id:
      type: string
      description: Team ID
    name:
      type: string
      description: Team name
    source:
      type: string
      description: How the user was added to this team (e.g. "manual", "scim_sync")

AccessProfile:
  type: object
  nullable: true
  description: Active or fallback user access profile, if assigned.
  properties:
    id:
      type: integer
    user_id:
      type: string
    parent_profile_id:
      type: integer
      nullable: true
    name:
      type: string
    is_active:
      type: boolean
    expires_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserTeamsResponse:
  type: object
  properties:
    teams:
      type: array
      items:
        $ref: '#/UserTeamEntry'

UpdateUserTeamsRequest:
  type: object
  required:
    - team_ids
  properties:
    team_ids:
      type: array
      items:
        type: string
      description: List of team IDs to assign (replaces existing manual assignments; synced memberships are preserved)

# ---- Teams ----

TeamMemberObject:
  type: object
  properties:
    user_id:
      type: string
    user_name:
      type: string
    user_email:
      type: string
    source:
      type: string
      description: How the member was added (e.g. "manual", "scim_sync")

TeamMembersResponse:
  type: object
  properties:
    members:
      type: array
      items:
        $ref: '#/TeamMemberObject'

AddTeamMemberRequest:
  type: object
  required:
    - user_id
  properties:
    user_id:
      type: string
      description: ID of the user to add to the team

# ---- User Virtual Key Lookup ----

UserVirtualKeySummary:
  type: object
  properties:
    id:
      type: string
      description: Virtual key ID
    name:
      type: string
      description: Virtual key display name
    value:
      type: string
      description: Virtual key token value
    is_active:
      type: boolean
      nullable: true
      description: Whether the virtual key is currently active

UserVirtualKeyLookupResponse:
  type: object
  properties:
    user_id:
      type: string
      description: Internal ID of the resolved user
    email:
      type: string
      format: email
      description: Email address of the resolved user
    virtual_keys:
      type: array
      description: Virtual keys assigned to this user
      items:
        $ref: '#/UserVirtualKeySummary'
