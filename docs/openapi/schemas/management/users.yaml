UserObject:
  type: object
  properties:
    id:
      type: string
      description: Unique user identifier
    name:
      type: string
      description: User's display name
    email:
      type: string
      format: email
      description: User's email address
    role_id:
      type: integer
      nullable: true
      description: ID of the assigned RBAC role
    role:
      type: object
      nullable: true
      description: RBAC role details
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_system_role:
          type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    teams:
      type: array
      description: Teams the user belongs to.
      items:
        $ref: '#/UserTeamSummaryEntry'
    access_profile:
      $ref: '#/AccessProfile'

CreateUserRequest:
  type: object
  required:
    - name
    - email
  properties:
    name:
      type: string
      description: User's display name
    email:
      type: string
      format: email
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: User's email address (must be unique)
    role_id:
      type: integer
      description: Optional RBAC role ID to assign

UserResponse:
  type: object
  properties:
    user:
      $ref: '#/UserObject'

ListUsersResponse:
  type: object
  properties:
    users:
      type: array
      items:
        $ref: '#/UserObject'
    total:
      type: integer
      description: Total number of users matching the query
    page:
      type: integer
      description: Current page number
    limit:
      type: integer
      description: Number of users per page
    total_pages:
      type: integer
      description: Total number of pages
    has_more:
      type: boolean
      description: Whether more pages are available

# ---- User Permissions ----

PermissionsResponse:
  type: object
  properties:
    permissions:
      type: object
      description: >
        Map of resource names to their permitted operations.
        When SCIM is disabled, returns full permissions for all resources.
      additionalProperties:
        type: object
        additionalProperties:
          type: boolean

# ---- User Role ----

AssignUserRoleRequest:
  type: object
  required:
    - role_id
  properties:
    role_id:
      type: integer
      description: ID of the RBAC role to assign

# ---- User Teams ----

UserTeamSummaryEntry:
  type: object
  properties:
    id:
      type: string
      description: Team ID
    name:
      type: string
      description: Team name
    business_unit_id:
      type: string
      nullable: true
      description: Business unit ID associated with this team (if any)
    business_unit_name:
      type: string
      nullable: true
      description: Business unit name associated with this team (if any)

UserTeamEntry:
  type: object
  properties:
    id:
      type: string
      description: Team ID
    name:
      type: string
      description: Team name
    source:
      type: string
      description: How the user was added to this team (e.g. "manual", "scim_sync")

AccessProfile:
  type: object
  nullable: true
  description: Active or fallback user access profile, if assigned.
  properties:
    id:
      type: integer
    user_id:
      type: string
    parent_profile_id:
      type: integer
      nullable: true
    name:
      type: string
    is_active:
      type: boolean
    expires_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserTeamsResponse:
  type: object
  properties:
    teams:
      type: array
      items:
        $ref: '#/UserTeamEntry'

UpdateUserTeamsRequest:
  type: object
  required:
    - team_ids
  properties:
    team_ids:
      type: array
      items:
        type: string
      description: List of team IDs to assign (replaces existing manual assignments; synced memberships are preserved)

# ---- Teams ----

TeamObject:
  type: object
  properties:
    id:
      type: string
      description: Team ID (derived from name)
    name:
      type: string
      description: Team name
    member_count:
      type: integer
      description: Number of members in the team
    virtual_key_count:
      type: integer
      description: Number of virtual keys assigned to the team
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateTeamRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: Team name (must be unique)

UpdateTeamRequest:
  type: object
  properties:
    name:
      type: string
      description: >-
        Team name. Renaming is not allowed - sending a value different from the
        team's current name returns 400.
    customer_id:
      type: string
      description: >-
        Customer to attach to this team. Additive: the customer is attached and
        any customers already attached are left in place. Re-sending an
        already-attached customer is a no-op. To detach, use
        DELETE /api/teams/{id}/customers/{customerId}.

        This is the team <-> customer many-to-many association that drives
        governance and DAC customer derivation. It is distinct from the
        customer_id on PUT /api/governance/teams/{team_id}, which sets the
        team's budget-hierarchy parent and is not modified by this endpoint.
    customer_ids:
      type: array
      description: >-
        Customers to attach to this team, same semantics as customer_id. May be
        combined with customer_id; the two sets are merged.
      items:
        type: string

CreateTeamResponse:
  type: object
  properties:
    id:
      type: string
    name:
      type: string

UpdateTeamResponse:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    attached_customer_ids:
      type: array
      description: >-
        Customers attached by this request. Omitted when the request carried no
        customer_id or customer_ids.
      items:
        type: string
    warning:
      type: string
      description: >-
        Present only when the attachment was persisted but refreshing the cached
        team scope failed. The association is durable; the derived customer scope
        may lag until the next reload.

ListTeamsResponse:
  type: object
  properties:
    teams:
      type: array
      items:
        $ref: '#/TeamObject'
    total:
      type: integer
    page:
      type: integer
    limit:
      type: integer
    total_pages:
      type: integer
      description: Total number of pages
    has_more:
      type: boolean
      description: Whether more pages are available

# ---- Team Members ----

TeamMemberObject:
  type: object
  properties:
    user_id:
      type: string
    user_name:
      type: string
    user_email:
      type: string
    source:
      type: string
      description: How the member was added (e.g. "manual", "scim_sync")

TeamMembersResponse:
  type: object
  properties:
    members:
      type: array
      items:
        $ref: '#/TeamMemberObject'

AddTeamMemberRequest:
  type: object
  required:
    - user_id
  properties:
    user_id:
      type: string
      description: ID of the user to add to the team

# ---- User Virtual Key Lookup ----

UserVirtualKeySummary:
  type: object
  properties:
    id:
      type: string
      description: Virtual key ID
    name:
      type: string
      description: Virtual key display name
    value:
      type: string
      description: Virtual key token value
    is_active:
      type: boolean
      nullable: true
      description: Whether the virtual key is currently active

UserVirtualKeyLookupResponse:
  type: object
  properties:
    user_id:
      type: string
      description: Internal ID of the resolved user
    email:
      type: string
      format: email
      description: Email address of the resolved user
    virtual_keys:
      type: array
      description: Virtual keys assigned to this user
      items:
        $ref: '#/UserVirtualKeySummary'
