# Providers API schemas

ProviderStatus:
  type: string
  enum: [active, error, deleted]
  description: Status of the provider

NetworkConfig:
  type: object
  description: Network configuration for provider connections
  properties:
    base_url:
      type: string
      description: Base URL for the provider (optional)
    extra_headers:
      type: object
      additionalProperties:
        type: string
      description: Additional headers to include in requests
    default_request_timeout_in_seconds:
      type: integer
      description: Default timeout for requests
    max_retries:
      type: integer
      description: Maximum number of retries
    retry_backoff_initial:
      type: integer
      format: int64
      description: Initial backoff duration in milliseconds
    retry_backoff_max:
      type: integer
      format: int64
      description: Maximum backoff duration in milliseconds
    insecure_skip_verify:
      type: boolean
      description: Disable TLS certificate verification for provider connections. This bypasses server certificate validation and should be used only as a last resort when a trusted CA chain cannot be configured. Prefer ca_cert_pem for self-signed or private CA deployments.
    ca_cert_pem:
      type: string
      description: PEM-encoded CA certificate to trust for provider endpoint connections (e.g. self-signed or internal CA)
    allow_private_network:
      type: boolean
      default: false
      description: Allow connections to RFC 1918 private IPs (10.x, 172.16.x, 192.168.x). Enable for providers on a k8s pod network, LAN, or private VPC. Loopback addresses (localhost, 127.0.0.1, ::1) remain allowed regardless of this setting. Link-local addresses (169.254.x.x) are always blocked.

ConcurrencyAndBufferSize:
  type: object
  description: Concurrency settings
  properties:
    concurrency:
      type: integer
      description: Number of concurrent operations
    buffer_size:
      type: integer
      description: Size of the buffer

ProxyConfig:
  type: object
  description: Proxy configuration
  properties:
    type:
      type: string
      enum: [none, http, socks5, environment]
    url:
      type: string
    username:
      type: string
    password:
      type: string
    ca_cert_pem:
      type: string

AzureKeyConfig:
  type: object
  description: Azure-specific key configuration
  properties:
    endpoint:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    api_version:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      deprecated: true
      description: Deprecated and ignored. Bifrost uses the Azure OpenAI v1 API, which needs no api-version parameter. Set api_version on an individual alias to override it for that deployment.
    client_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    client_secret:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    tenant_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    scopes:
      type: array
      items:
        type: string
      description: List of scopes to use for authentication

VertexKeyConfig:
  type: object
  description: Vertex-specific key configuration
  properties:
    project_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    project_number:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    auth_credentials:
      $ref: '../../schemas/management/common.yaml#/EnvVar'

BedrockKeyConfig:
  type: object
  description: AWS Bedrock-specific key configuration
  properties:
    access_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    secret_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_token:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    batch_s3_config:
      type: object
      properties:
        buckets:
          type: array
          items:
            type: object
            properties:
              bucket_name:
                type: string
              prefix:
                type: string
              is_default:
                type: boolean

VllmKeyConfig:
  type: object
  description: VLLM-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    model_name:
      type: string
  required:
    - url

OllamaKeyConfig:
  type: object
  description: Ollama-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

ReplicateKeyConfig:
  type: object
  description: Replicate-specific key configuration
  properties:
    use_deployments_endpoint:
      type: boolean
      description: Whether to use the deployments endpoint instead of the models endpoint

SglKeyConfig:
  type: object
  description: SGLang-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

VLLMKeyConfig:
  type: object
  description: vLLM-specific key configuration for per-key routing to different vLLM instances
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: vLLM server base URL (required)
    model_name:
      type: string
      description: Exact model name served on this vLLM instance

AliasConfig:
  type: object
  description: |
    Rich configuration for a single key-level alias. Carries the wire model identifier plus
    optional canonical name, model family, and provider-specific overrides. Shared fields
    (region, project_id, use_anthropic_endpoints) are accepted on any provider's key but are
    only read by the providers named in their descriptions. The provider-specific overrides
    are validated against the owning key's provider and rejected on a mismatch.
  properties:
    model_id:
      type: string
      minLength: 1
      description: Provider-specific identifier sent on the wire (deployment name, inference profile ID, fine-tuned model ID, etc.)
    model_name:
      type: string
      description: Canonical model name used for pricing, logging, and family inference. Set this when model_id is opaque.
    model_family:
      type: string
      enum: [anthropic, openai, mistral, cohere, gemini, gemma, llama, imagen, veo, nova, titan]
      description: Underlying model family used for provider routing decisions. When unset, the family is inferred from model_name, model_id, and the alias name.
    description:
      type: string
      description: Free-form note surfaced in the UI. Not used for routing.
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Per-alias region override. Read by Bedrock, Bedrock Mantle, and Vertex; falls back to the key-level region.
    project_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Per-alias project override. Vertex reads it as the GCP project; Bedrock and Bedrock Mantle send it as the AWS project on the OpenAI-Project / anthropic-workspace-id header.
    use_anthropic_endpoints:
      type: boolean
      description: For DeepSeek, Fireworks, vLLM, and SGLang keys, routes this alias's chat completions and responses requests through the Anthropic-compatible /v1/messages endpoint. Overrides the key-level setting for this alias only.
    api_version:
      type: string
      description: Azure only. Overrides the api-version query parameter.
    anthropic_version:
      type: string
      description: Azure only. Overrides the anthropic-version header for Claude-on-Azure deployments.
    endpoint:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Azure only. Overrides the key-level Azure endpoint for this alias.
    project_number:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Vertex only. Per-alias GCP project number, required for fine-tuned models.
    force_single_region:
      type: boolean
      description: Vertex only. Calls the alias region as-is and skips promoting multi-region-only models to a multi-region endpoint.
    inference_profile_arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Bedrock only. Cross-region inference profile ARN invoked instead of the model ID.
    use_deployments_endpoint:
      type: boolean
      description: Replicate only. Routes the alias through the deployments endpoint instead of the models endpoint.
  required:
    - model_id

BedrockMantleKeyConfig:
  type: object
  description: Bedrock Mantle-specific key configuration
  properties:
    access_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    secret_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_token:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    role_arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: IAM role ARN for STS AssumeRole
    external_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_name:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    project_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Scopes inference and model listing to a Bedrock project, sent as the OpenAI-Project or anthropic-workspace-id header. Defaults to the account's default project when empty.
    endpoints:
      type: object
      description: Routes each AWS endpoint service through an interface VPC endpoint
      properties:
        runtime:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        control_plane:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        mantle:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        agent_runtime:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        s3:
          $ref: '../../schemas/management/common.yaml#/EnvVar'

Key:
  type: object
  description: API key configuration
  properties:
    id:
      type: string
      description: Unique identifier for the key
    name:
      type: string
      description: Name of the key
    value:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: API key value (redacted in responses)
    models:
      type: array
      items:
        type: string
      description: List of models this key can access (whitelist)
    blacklisted_models:
      type: array
      items:
        type: string
      description: List of models this key cannot access (blacklist)
    weight:
      type: number
      description: Weight for load balancing
    aliases:
      type: object
      propertyNames:
        minLength: 1
      additionalProperties:
        oneOf:
          - type: string
            minLength: 1
            description: Legacy shape. A bare provider-specific identifier, equivalent to an AliasConfig with only model_id set.
          - $ref: '#/AliasConfig'
      description: |
        Model alias mappings. Each entry maps a user-facing model name to either a bare
        provider-specific identifier (deployment name, inference profile ID, fine-tuned model
        ID) or an AliasConfig object carrying that identifier plus optional canonical name,
        model family, and provider-specific overrides. Both shapes are accepted on input; a
        response emits the bare string when only model_id is set.
    azure_key_config:
      $ref: '#/AzureKeyConfig'
    vertex_key_config:
      $ref: '#/VertexKeyConfig'
    bedrock_key_config:
      $ref: '#/BedrockKeyConfig'
    bedrock_mantle_key_config:
      $ref: '#/BedrockMantleKeyConfig'
    vllm_key_config:
      $ref: '#/VllmKeyConfig'
    ollama_key_config:
      $ref: '#/OllamaKeyConfig'
    sgl_key_config:
      $ref: '#/SglKeyConfig'
    replicate_key_config:
      $ref: '#/ReplicateKeyConfig'
    enabled:
      type: boolean
      description: Whether the key is active (defaults to true)
    use_for_batch_api:
      type: boolean
      description: Whether this key can be used for batch API operations
    use_anthropic_endpoints:
      type: boolean
      description: For DeepSeek, Fireworks, vLLM, and SGLang keys, routes chat completions and responses requests through the provider's Anthropic-compatible endpoints. Can be overridden per alias.
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection
    status:
      type: string
      description: Status of key (e.g., success, list_models_failed)
    description:
      type: string
      description: Error or status description for the key

AllowedRequests:
  type: object
  description: Allowed request types for custom providers
  properties:
    list_models:
      type: boolean
    text_completion:
      type: boolean
    text_completion_stream:
      type: boolean
    chat_completion:
      type: boolean
    chat_completion_stream:
      type: boolean
    responses:
      type: boolean
    responses_stream:
      type: boolean
    count_tokens:
      type: boolean
    embedding:
      type: boolean
    speech:
      type: boolean
    speech_stream:
      type: boolean
    transcription:
      type: boolean
    transcription_stream:
      type: boolean
    image_generation:
      type: boolean
    image_generation_stream:
      type: boolean
    batch_create:
      type: boolean
    batch_list:
      type: boolean
    batch_retrieve:
      type: boolean
    batch_cancel:
      type: boolean
    batch_results:
      type: boolean
    file_upload:
      type: boolean
    file_list:
      type: boolean
    file_retrieve:
      type: boolean
    file_delete:
      type: boolean
    file_content:
      type: boolean

CustomProviderConfig:
  type: object
  description: Custom provider configuration
  properties:
    is_key_less:
      type: boolean
    base_provider_type:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    allowed_requests:
      $ref: '#/AllowedRequests'
    request_path_overrides:
      type: object
      additionalProperties:
        type: string

ProviderResponse:
  type: object
  description: Provider configuration response
  properties:
    name:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'
    provider_status:
      $ref: '#/ProviderStatus'
    status:
      type: string
      description: Operational status (e.g., list_models_failed)
    description:
      type: string
      description: Error/status description
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection

ListProvidersResponse:
  type: object
  description: List providers response
  properties:
    providers:
      type: array
      items:
        $ref: '#/ProviderResponse'
    total:
      type: integer

AddProviderRequest:
  type: object
  description: Add provider request. Keys are managed separately via /api/providers/{provider}/keys.
  required:
    - provider
  properties:
    provider:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'

UpdateProviderRequest:
  type: object
  description: Update provider request. Keys are managed separately via /api/providers/{provider}/keys.
  properties:
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'

ListProviderKeysResponse:
  type: object
  description: Response for listing keys for a provider
  properties:
    keys:
      type: array
      items:
        $ref: '#/Key'
    total:
      type: integer

ModelResponse:
  type: object
  description: Model information
  properties:
    name:
      type: string
    provider:
      type: string
    accessible_by_keys:
      type: array
      items:
        type: string

Architecture:
  type: object
  properties:
    modality:
      type: string
    tokenizer:
      type: string
    instruct_type:
      type: string
    input_modalities:
      type: array
      items:
        type: string
    output_modalities:
      type: array
      items:
        type: string

ModelDetailsResponse:
  type: object
  description: Model details with capability metadata
  properties:
    name:
      type: string
    provider:
      type: string
    context_length:
      type: integer
    max_input_tokens:
      type: integer
    max_output_tokens:
      type: integer
    input_cost_per_token:
      type: number
      format: double
    output_cost_per_token:
      type: number
      format: double
    cache_creation_input_token_cost:
      type: number
      format: double
    cache_read_input_token_cost:
      type: number
      format: double
    architecture:
      $ref: '#/Architecture'
    additional_attributes:
      type: object
      additionalProperties:
        type: string
    accessible_by_keys:
      type: array
      items:
        type: string

ListModelsResponse:
  type: object
  description: List models response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelResponse'
    total:
      type: integer

ListModelDetailsResponse:
  type: object
  description: List model details response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelDetailsResponse'
    total:
      type: integer
