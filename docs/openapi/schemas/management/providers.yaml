# Providers API schemas

ProviderStatus:
  type: string
  enum: [active, error, deleted]
  description: Status of the provider

NetworkConfig:
  type: object
  description: Network configuration for provider connections
  properties:
    base_url:
      type: string
      description: Base URL for the provider (optional)
    extra_headers:
      type: object
      additionalProperties:
        type: string
      description: Additional headers to include in requests. A value may be a literal, an `env.VAR_NAME` reference, or a `vault.path` reference; references are resolved at load time and only the reference is stored. Literal values are masked in API responses while env/vault references stay visible as references; on update, a masked value sent back under the same header name keeps the stored value, while a masked value under a new or renamed header, or on provider create, is rejected with 400.
    extra_headers_secret_vars:
      type: object
      readOnly: true
      additionalProperties:
        $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Response only. The same headers as `extra_headers`, as SecretVar objects (`value`, `ref`, `type`) so clients can tell literals from `env`/`vault` references without parsing prefixes. Literal values are `<REDACTED>`. Ignored on input; send `extra_headers` to change headers.
    default_request_timeout_in_seconds:
      type: integer
      description: Default timeout for requests
    max_retries:
      type: integer
      description: Maximum number of retries
    retry_backoff_initial:
      type: integer
      format: int64
      description: Initial backoff duration in milliseconds
    retry_backoff_max:
      type: integer
      format: int64
      description: Maximum backoff duration in milliseconds
    insecure_skip_verify:
      type: boolean
      description: Disable TLS certificate verification for provider connections. This bypasses server certificate validation and should be used only as a last resort when a trusted CA chain cannot be configured. Prefer ca_cert_pem for self-signed or private CA deployments.
    ca_cert_pem:
      type: string
      description: PEM-encoded CA certificate to trust for provider endpoint connections (e.g. self-signed or internal CA)
    allow_private_network:
      type: boolean
      default: false
      description: Allow connections to RFC 1918 private IPs (10.x, 172.16.x, 192.168.x). Enable for providers on a k8s pod network, LAN, or private VPC. Loopback addresses (localhost, 127.0.0.1, ::1) remain allowed regardless of this setting. Link-local addresses (169.254.x.x) are always blocked.

ConcurrencyAndBufferSize:
  type: object
  description: Concurrency settings
  properties:
    concurrency:
      type: integer
      description: Number of concurrent operations
    buffer_size:
      type: integer
      description: Size of the buffer

ProxyConfig:
  type: object
  description: Proxy configuration
  properties:
    type:
      type: string
      enum: [none, http, socks5, environment]
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    username:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    password:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    ca_cert_pem:
      $ref: '../../schemas/management/common.yaml#/EnvVar'

AzureKeyConfig:
  type: object
  description: Azure-specific key configuration
  properties:
    endpoint:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    api_version:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    client_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    client_secret:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    tenant_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    scopes:
      type: array
      items:
        type: string
      description: List of scopes to use for authentication
    use_speech_endpoints:
      type: boolean
      default: false
      description: Send speech and transcription requests to Azure AI Speech (SSML text to speech, fast transcription) instead of Azure OpenAI. An alias can override it with its own use_speech_endpoints.
    use_voice_live_endpoints:
      type: boolean
      default: false
      description: Send realtime WebSocket sessions to Azure Voice Live (/voice-live/realtime) instead of Azure OpenAI. The WebRTC and client secret routes reject it. An alias can override it with its own use_voice_live_endpoints.

VertexKeyConfig:
  type: object
  description: Vertex-specific key configuration
  properties:
    project_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    project_number:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    auth_credentials:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    force_single_region:
      type: boolean
      default: false
      description: When true, always call the configured region and skip automatic promotion of multi-region-only models to a multi-region endpoint.
    use_session_routing:
      type: boolean
      default: false
      description: Send each request's prompt_cache_key to Gemini models as session_id. Vertex routes requests with the same session ID to one replica, so they reuse its implicit cache. Enable only if Google has turned on session routing for this key's project.
    aws_workload_identity:
      type: object
      description: >-
        GCP Workload Identity Federation from the workload's AWS identity (EKS IRSA / Pod Identity,
        ECS task role, EC2 instance profile, AWS_* env vars). Takes precedence over auth_credentials;
        the two must not be combined. aws_role_arn is redacted in GET responses; the other fields are
        identifiers and are returned in clear.
      properties:
        audience:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        service_account_email:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        token_lifetime_seconds:
          type: integer
          minimum: 600
          maximum: 43200
          description: Lifetime of the impersonated service-account token in seconds; only used with service_account_email. Default 3600. Lifetimes above 3600 require the target service account to be allowed by the organization policy constraint constraints/iam.allowServiceAccountCredentialLifetimeExtension; otherwise token generation fails.
        aws_region:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
        aws_role_arn:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
      required: [audience]
      additionalProperties: false
  # A key authenticates with either a credentials JSON or AWS workload identity federation, never
  # both; mirrors the rule in transports/config.schema.json and the API's validation.
  if:
    required: [aws_workload_identity]
  then:
    properties:
      auth_credentials:
        anyOf:
          - type: string
            maxLength: 0
          - type: object
            properties:
              value:
                type: string
                maxLength: 0
              ref:
                type: string
                maxLength: 0

BedrockKeyConfig:
  type: object
  description: AWS Bedrock-specific key configuration
  properties:
    access_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    secret_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_token:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    batch_s3_config:
      type: object
      properties:
        buckets:
          type: array
          items:
            type: object
            properties:
              bucket_name:
                type: string
              prefix:
                type: string
              is_default:
                type: boolean

SageMakerKeyConfig:
  type: object
  description: AWS SageMaker real-time endpoint key configuration. A pre-minted token in Key.value takes precedence and is sent as is; otherwise Bifrost mints the SageMaker bearer token from these AWS credentials (leave access_key and secret_key empty to use the default AWS credential chain). Passthrough signs requests with AWS credentials and rejects keys that set Key.value.
  properties:
    access_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    secret_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_token:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    region:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    role_arn:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    external_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    session_name:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    endpoints:
      type: object
      description: Runtime host override (VPC endpoint, FIPS or dual-stack host)
      properties:
        runtime:
          $ref: '../../schemas/management/common.yaml#/EnvVar'
      additionalProperties: false
  required:
    - region
  additionalProperties: false

VllmKeyConfig:
  type: object
  description: VLLM-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
    model_name:
      type: string
  required:
    - url

OllamaKeyConfig:
  type: object
  description: Ollama-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

ReplicateKeyConfig:
  type: object
  description: Replicate-specific key configuration
  properties:
    use_deployments_endpoint:
      type: boolean
      description: Whether to use the deployments endpoint instead of the models endpoint

SglKeyConfig:
  type: object
  description: SGLang-specific key configuration
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - url

CloudflareKeyConfig:
  type: object
  description: Cloudflare Workers AI-specific key configuration
  properties:
    account_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
  required:
    - account_id

VLLMKeyConfig:
  type: object
  description: vLLM-specific key configuration for per-key routing to different vLLM instances
  properties:
    url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: vLLM server base URL (required)
    model_name:
      type: string
      description: Exact model name served on this vLLM instance

OAuthKeyConfig:
  type: object
  description: OAuth-minted bearer for OpenAI-compatible providers (including custom providers on the openai base). Set this and leave value empty; Bifrost mints, caches and refreshes the access token. A non-empty value always wins. Secrets are redacted in responses.
  required:
    - grant_type
    - token_url
  properties:
    grant_type:
      type: string
      enum: [client_credentials, jwt_bearer]
      description: client_credentials (RFC 6749 §4.4) or jwt_bearer (RFC 7523, Bifrost signs an assertion with private_key)
    token_url:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: Token endpoint, absolute https URL (plain http is accepted for loopback hosts only). Must not carry userinfo, a query or a fragment; send extra parameters through extra_params
    client_id:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: client_credentials client ID (redacted in responses)
    client_secret:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: client_credentials client secret (redacted in responses)
    private_key:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: jwt_bearer RSA or EC private key, PEM (redacted in responses)
    scopes:
      type: array
      items:
        type: string
      description: Scopes requested, sent space-joined
    audience:
      type: string
      description: jwt_bearer aud claim (required for that grant); client_credentials optional audience form parameter
    issuer:
      type: string
      minLength: 1
      description: jwt_bearer iss claim (required for that grant)
    subject:
      type: string
      description: jwt_bearer sub claim (defaults to issuer)
    key_id:
      type: string
      description: jwt_bearer kid header
    signing_algorithm:
      type: string
      enum: [RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512]
      default: RS256
      description: jwt_bearer assertion signing algorithm
    auth_style:
      type: string
      enum: [header, body]
      default: header
      description: client_credentials credential placement (HTTP Basic header or form body)
    extra_params:
      type: object
      additionalProperties:
        type: string
      description: Extra form parameters sent on the token request
    assertion_lifetime_seconds:
      type: integer
      minimum: 0
      maximum: 3600
      default: 300
      description: >-
        jwt_bearer: seconds from issue until the assertion expires (exp = now + value); 0 or
        omitted uses the default of 300. iat is
        backdated by 30 seconds for clock skew, so the assertion's exp - iat span is this value plus 30.
  additionalProperties: false
  allOf:
    - if:
        required: [grant_type]
        properties:
          grant_type:
            const: client_credentials
      then:
        required: [client_id, client_secret]
        description: client_credentials needs the client ID and secret
    - if:
        required: [grant_type]
        properties:
          grant_type:
            const: jwt_bearer
      then:
        required: [private_key, issuer, audience]
        properties:
          audience:
            minLength: 1
        description: jwt_bearer needs the signing key plus the non-empty iss and aud claims

Key:
  type: object
  description: API key configuration
  properties:
    id:
      type: string
      description: Unique identifier for the key
    name:
      type: string
      description: Name of the key
    value:
      $ref: '../../schemas/management/common.yaml#/EnvVar'
      description: API key value (redacted in responses)
    models:
      type: array
      items:
        type: string
      description: List of models this key can access (whitelist). `["*"]` allows every model. An entry starting with `regex:` is an RE2 pattern matched case-insensitively against the whole model name; an empty pattern, `regex:*`, or a pattern that does not compile is rejected with 400. `blacklisted_models` wins over this list.
    blacklisted_models:
      type: array
      items:
        type: string
      description: List of models this key cannot access (blacklist), which wins over `models`. `["*"]` blocks every model. An entry starting with `regex:` is an RE2 pattern matched case-insensitively against the whole model name; an empty pattern, `regex:*`, or a pattern that does not compile is rejected with 400.
    weight:
      type: number
      minimum: 0
      description: Weight for load balancing. A negative weight is rejected with 400. A key with weight 0 is picked only when no other eligible key has a positive weight; when every weight is 0, keys are picked uniformly.
    aliases:
      type: object
      propertyNames:
        minLength: 1
      additionalProperties:
        type: string
        minLength: 1
      description: Model alias mappings - maps a user-facing model name to a provider-specific identifier (deployment name, inference profile ID, fine-tuned model ID, etc.)
    azure_key_config:
      $ref: '#/AzureKeyConfig'
    vertex_key_config:
      $ref: '#/VertexKeyConfig'
    bedrock_key_config:
      $ref: '#/BedrockKeyConfig'
    sagemaker_key_config:
      $ref: '#/SageMakerKeyConfig'
    vllm_key_config:
      $ref: '#/VllmKeyConfig'
    ollama_key_config:
      $ref: '#/OllamaKeyConfig'
    sgl_key_config:
      $ref: '#/SglKeyConfig'
    cloudflare_key_config:
      $ref: '#/CloudflareKeyConfig'
    replicate_key_config:
      $ref: '#/ReplicateKeyConfig'
    oauth_key_config:
      $ref: '#/OAuthKeyConfig'
    enabled:
      type: boolean
      description: Whether the key is active (defaults to true)
    use_for_batch_api:
      type: boolean
      description: Whether this key can be used for batch API operations
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection
    status:
      type: string
      description: Status of key (e.g., success, list_models_failed)
    description:
      type: string
      description: Error or status description for the key

AllowedRequests:
  type: object
  description: Allowed request types for custom providers
  properties:
    list_models:
      type: boolean
    text_completion:
      type: boolean
    text_completion_stream:
      type: boolean
    chat_completion:
      type: boolean
    chat_completion_stream:
      type: boolean
    responses:
      type: boolean
    responses_stream:
      type: boolean
    count_tokens:
      type: boolean
    embedding:
      type: boolean
    decisions:
      type: boolean
      description: Decision requests via /v1/decisions. A typesafe or openai base serves them natively; other bases emulate them through the Responses API only when the compat plugin's convert_decision_to_responses is enabled, and otherwise return unsupported_operation
    speech:
      type: boolean
    speech_stream:
      type: boolean
    transcription:
      type: boolean
    transcription_stream:
      type: boolean
    image_generation:
      type: boolean
    image_generation_stream:
      type: boolean
    batch_create:
      type: boolean
    batch_list:
      type: boolean
    batch_retrieve:
      type: boolean
    batch_cancel:
      type: boolean
    batch_results:
      type: boolean
    file_upload:
      type: boolean
    file_list:
      type: boolean
    file_retrieve:
      type: boolean
    file_delete:
      type: boolean
    file_content:
      type: boolean

CustomProviderConfig:
  type: object
  description: Custom provider configuration
  properties:
    is_key_less:
      type: boolean
    does_not_send_done_marker:
      type: boolean
      description: >-
        Provider ends streams on finish_reason without sending a data: [DONE] marker.
        Without this, a provider that also keeps the connection open leaves the stream
        waiting for a marker it never sends.
    base_provider_type:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    allowed_requests:
      $ref: '#/AllowedRequests'
    request_path_overrides:
      type: object
      additionalProperties:
        type: string

ProviderResponse:
  type: object
  description: Provider configuration response
  properties:
    name:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'
    prompt_cache:
      $ref: '#/PromptCacheConfig'
    injected_tools:
      $ref: '#/InjectedToolsConfig'
    provider_status:
      $ref: '#/ProviderStatus'
    status:
      type: string
      description: Operational status (e.g., list_models_failed)
    description:
      type: string
      description: Error/status description
    config_hash:
      type: string
      description: Hash of config.json version, used for change detection

ListProvidersResponse:
  type: object
  description: List providers response
  properties:
    providers:
      type: array
      items:
        $ref: '#/ProviderResponse'
    total:
      type: integer

AddProviderRequest:
  type: object
  description: Add provider request. Keys are managed separately via /api/providers/{provider}/keys.
  required:
    - provider
  properties:
    provider:
      $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'
    prompt_cache:
      $ref: '#/PromptCacheConfig'
    injected_tools:
      $ref: '#/InjectedToolsConfig'

CacheControlInjectionPoint:
  type: object
  description: One place to add a cache breakpoint. Must set role, index, or both.
  properties:
    location:
      type: string
      enum: [message]
    role:
      type: string
      enum: [system, developer, user, assistant]
    index:
      type: integer
      description: Negative values count from the end, so -1 is the last message.

PromptCacheConfig:
  type: object
  description: >-
    Synthesize prompt-cache breakpoints for requests that carry none. Off by default.
    Requests that already carry their own cache markers are never modified.
  properties:
    auto_inject:
      type: boolean
      description: Mark the first cacheable content block, keeping the cached prefix stable across agent turns.
    ttl:
      type: string
      enum: ["1h"]
      description: Lifetime for injected markers. Omit for the provider default.
    cache_control_injection_points:
      type: array
      description: Target specific messages instead. When set, replaces auto_inject rather than adding to it.
      items:
        $ref: '#/CacheControlInjectionPoint'

InjectedToolsConfig:
  type: array
  description: >-
    MCP tools injected into every chat and responses request served by this provider and
    executed server side when the model calls them. The client never sees the injected
    tool call, only the final answer. Names must be unique within a provider.
  items:
    $ref: '#/InjectedTool'

InjectedTool:
  type: object
  description: >-
    One MCP tool injected under a name the model sees. The name replaces any client tool
    with the same name; the name web_search also replaces native web search tools and
    web_search_options.
  required: [name, mcp_client_name, tool_name]
  additionalProperties: false
  properties:
    name:
      type: string
      pattern: '^[a-zA-Z0-9_-]{1,64}$'
      description: Tool name the model sees.
    mcp_client_name:
      type: string
      minLength: 1
      description: Name of the configured MCP client that provides the tool.
    tool_name:
      type: string
      minLength: 1
      description: Tool name as the MCP server exposes it, without the client prefix.

UpdateProviderRequest:
  type: object
  description: Update provider request. Keys are managed separately via /api/providers/{provider}/keys.
  properties:
    network_config:
      $ref: '#/NetworkConfig'
    concurrency_and_buffer_size:
      $ref: '#/ConcurrencyAndBufferSize'
    proxy_config:
      $ref: '#/ProxyConfig'
    send_back_raw_request:
      type: boolean
    send_back_raw_response:
      type: boolean
    store_raw_request_response:
      type: boolean
    custom_provider_config:
      $ref: '#/CustomProviderConfig'
    prompt_cache:
      $ref: '#/PromptCacheConfig'
    injected_tools:
      description: Send null to remove the provider's injected tools.
      oneOf:
        - $ref: '#/InjectedToolsConfig'
        - type: 'null'

ListProviderKeysResponse:
  type: object
  description: Response for listing keys for a provider
  properties:
    keys:
      type: array
      items:
        $ref: '#/Key'
    total:
      type: integer

ModelResponse:
  type: object
  description: Model information
  properties:
    name:
      type: string
    provider:
      type: string
    accessible_by_keys:
      type: array
      items:
        type: string

Architecture:
  type: object
  properties:
    modality:
      type: string
    tokenizer:
      type: string
    instruct_type:
      type: string
    input_modalities:
      type: array
      items:
        type: string
    output_modalities:
      type: array
      items:
        type: string

ModelDetailsResponse:
  type: object
  description: Model details with capability metadata
  properties:
    name:
      type: string
    provider:
      type: string
    context_length:
      type: integer
    max_input_tokens:
      type: integer
    max_output_tokens:
      type: integer
    input_cost_per_token:
      type: number
      format: double
    output_cost_per_token:
      type: number
      format: double
    cache_creation_input_token_cost:
      type: number
      format: double
    cache_read_input_token_cost:
      type: number
      format: double
    architecture:
      $ref: '#/Architecture'
    additional_attributes:
      type: object
      additionalProperties:
        type: string
    accessible_by_keys:
      type: array
      items:
        type: string

ListModelsResponse:
  type: object
  description: List models response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelResponse'
    total:
      type: integer

ListModelDetailsResponse:
  type: object
  description: List model details response
  properties:
    models:
      type: array
      items:
        $ref: '#/ModelDetailsResponse'
    total:
      type: integer
