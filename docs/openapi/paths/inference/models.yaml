models:
  get:
    operationId: listModels
    summary: List available models
    description: |
      Lists available models. If provider is not specified, lists all models from all configured providers.

      If a virtual key is provided, Bifrost only lists (and only queries) providers allowed by that virtual key.

      When Bifrost pricing/catalog metadata is available, `/v1/models` may also backfill:
      - `pricing`, `normalized_name`, and other descriptive fields from the catalog when the provider omitted them,
      - `supported_endpoints`, which currently contains at most one preferred Bifrost endpoint and is not exhaustive for multi-capable models,
      - `mode`, the preferred/default Bifrost API surface (chat, then responses, then text completion, else deterministic fallback) when that preferred mode maps to a known endpoint,
      - `supported_methods`, which preserves provider-native values when present and otherwise backfills Bifrost request-type identifiers derived from `supported_endpoints`.
    tags:
    - Models
    parameters:
    - name: provider
      in: query
      description: Filter by provider (e.g., openai, anthropic, bedrock)
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    - name: page_size
      in: query
      description: Maximum number of models to return
      schema:
        type: integer
        minimum: 0
    - name: page_token
      in: query
      description: Token for pagination
      schema:
        type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/models.yaml#/ListModelsResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
