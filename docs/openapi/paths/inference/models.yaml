models:
  get:
    operationId: listModels
    summary: List available models
    description: |
      Lists available models. If provider is not specified, lists all models from all configured providers.

      If a virtual key is provided, Bifrost only lists (and only queries) providers allowed by that virtual key.
    tags:
    - Models
    parameters:
    - name: provider
      in: query
      description: Filter by provider (e.g., openai, anthropic, bedrock)
      schema:
        $ref: '../../schemas/inference/common.yaml#/ModelProvider'
    - name: page_size
      in: query
      description: Maximum number of models to return
      schema:
        type: integer
        minimum: 0
    - name: page_token
      in: query
      description: Token for pagination
      schema:
        type: string
    - name: tags
      in: query
      description: >-
        Comma-separated tags (for example tags=prod,eu); only models carrying every listed tag
        are returned. Pagination applies to the filtered list. Not forwarded to providers.
        An invalid or empty tag is rejected with a 400. When large response mode streams the
        provider's response through unparsed, the filter cannot be applied and the request is
        rejected with a 400. A single-provider listing reads at most 20 pages from the provider;
        a provider with more pages is rejected with a 502 rather than filtered from a partial list.
      schema:
        type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/models.yaml#/ListModelsResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
