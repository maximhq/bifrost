codex:
  get:
    operationId: exportCodexCatalog
    summary: Export Codex model catalog
    description: 'Exports all matching models from configured Bifrost providers without pagination. Optional
      provider/query filters apply; deprecated models are hidden unless include_deprecated=true, including
      during search. Known modes other than chat and responses are excluded; models without mode metadata
      remain included. Model IDs retain the exact provider/model form, including custom providers and
      upstream IDs containing slashes. Uses inference middleware, not dashboard/admin authentication.
      Bearer inference credentials and virtual keys are accepted; virtual keys restrict both providers
      and models. Access-resolution errors return 401. Credentials may be omitted only when the deployment
      permits unauthenticated inference.


      Set Codex model_catalog_url to this endpoint URL to fetch the catalog directly. The catalog URL
      is separate from the inference base URL, which remains /openai/v1. The Bifrost launcher does not
      configure this setting automatically.


      When inference authentication is enforced, missing credentials return 401.'
    tags:
    - Models
    parameters:
    - name: provider
      in: query
      description: Configured provider name to filter, including custom provider names. Omit to include
        all accessible configured providers.
      schema:
        type: string
    - name: query
      in: query
      description: Search model names.
      schema:
        type: string
    - name: include_deprecated
      in: query
      description: Set to true to include deprecated models, which are otherwise hidden even during search.
      schema:
        type: boolean
        default: false
    responses:
      '200':
        description: Complete model catalog export
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/catalog.yaml#/CodexCatalogResponse
      '400':
        description: Failed to create the inference request context
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
      '401':
        description: Missing credentials when inference authentication is enforced, invalid inference
          credential, or catalog access could not be resolved
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
      '500':
        description: Failed to list configured catalog models
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
