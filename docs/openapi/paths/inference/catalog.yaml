pi:
  get:
    operationId: exportPiCatalog
    summary: Export Pi provider configuration
    description: 'Exports all matching configured models without pagination as a native providers.bifrost
      fragment. Optional provider/query filters apply; deprecated models are hidden unless include_deprecated=true.
      Known modes other than chat/responses are excluded; unknown modes remain included. Exact provider/model
      IDs, including upstream slashes, are preserved. Uses inference middleware and credentials, not dashboard
      authentication; virtual keys restrict providers and models. Credentials may be omitted only when
      unauthenticated inference is allowed. Access resolution errors return 401. Unknown capabilities,
      limits and prices are omitted; prices are USD per million tokens. Credentials are never embedded:
      the fragment references BIFROST_VIRTUAL_KEY. Merge into existing client configuration after inspection;
      no automatic catalog fetching or launcher integration. Targets Pi models.json providers.bifrost
      with openai-completions; only text/image input and metadata-confirmed thinking mappings are exported.


      When inference authentication is enforced, missing credentials return 401.'
    tags:
    - Models
    parameters:
    - name: provider
      in: query
      description: Configured provider name to filter, including custom provider names. Omit to include
        all accessible configured providers.
      schema:
        type: string
    - name: query
      in: query
      description: Search model names.
      schema:
        type: string
    - name: include_deprecated
      in: query
      description: Set to true to include deprecated models, which are otherwise hidden even during search.
      schema:
        type: boolean
        default: false
    - name: base_url
      in: query
      description: Full inference base URL including /openai/v1. Must be absolute HTTP(S) with hostname
        and no userinfo, query or fragment; invalid values return 400. Defaults to request scheme and
        Host plus the configured server base_path and /openai/v1, ignoring forwarded headers. Override
        behind a reverse proxy or TLS termination. An explicit base_url is used unchanged; the configured
        server base_path is not prepended.
      schema:
        type: string
        format: uri
      example: http://localhost:8080/openai/v1
    responses:
      '200':
        description: Native provider configuration fragment
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/catalog.yaml#/PiCatalogResponse
      '400':
        description: Invalid base_url or failed to create inference request context
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
      '401':
        description: Missing credentials when inference authentication is enforced, invalid inference
          credential, or catalog access could not be resolved
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
      '500':
        description: Failed to list configured catalog models
        content:
          application/json:
            schema:
              $ref: ../../schemas/inference/common.yaml#/BifrostError
    security:
    - BearerAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
