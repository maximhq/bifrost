login:
  post:
    operationId: login
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Login
    description: |
      Authenticates a user and returns a session token.
      Sets a cookie with the session token for subsequent requests.
    tags:
      - Session
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/session.yaml#/LoginRequest'
    # Public: exchanges username/password for a session token. Whitelisted
    # server-side (systemWhitelistedRoutes), so no bearer token is required.
    security: []
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/session.yaml#/LoginResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '403':
        description: Authentication is not enabled
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

logout:
  post:
    operationId: logout
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Logout
    description: |
      Logs out the current user and invalidates the session token.
    tags:
      - Session
    # Authenticated like every management endpoint (management API key), and the
    # dashboard additionally calls it with its HTTPOnly session cookie.
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
      - SessionCookieAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/session.yaml#/LogoutResponse'
      '403':
        description: Authentication is not enabled
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

is-auth-enabled:
  get:
    operationId: isAuthEnabled
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Check if authentication is enabled
    description: |
      Returns whether authentication is enabled and if the current token is valid.
    tags:
      - Session
    # Public: callable before login so the UI can decide whether to prompt for
    # credentials. Whitelisted server-side (systemWhitelistedRoutes).
    security: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/session.yaml#/IsAuthEnabledResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

ws-ticket:
  post:
    operationId: issueWSTicket
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Issue WebSocket ticket
    description: |
      Issues a short-lived ticket for authenticating WebSocket connections.
      The ticket can be used as a query parameter when upgrading to WebSocket.
    tags:
      - Session
    # Authenticated like every management endpoint (management API key), and the
    # dashboard additionally calls it with its HTTPOnly session cookie before
    # opening a WebSocket connection.
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
      - SessionCookieAuth: []
    responses:
      '200':
        description: Ticket issued successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket:
                  type: string
                  description: Short-lived WebSocket authentication ticket
      '403':
        description: Authentication is not enabled
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

setup:
  post:
    operationId: startSetupSession
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | The setup token itself - OSS only, while dashboard auth is not active |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Start a setup session
    description: |
      OSS only. While dashboard auth is not active (no admin account, or auth disabled),
      trades the operator's setup token, sent in the `X-Bifrost-Setup-Token` header, for an
      HttpOnly, `SameSite=Strict` cookie named `bifrost_setup_session`. The cookie carries no
      part of the token. It authenticates management API calls in place of the header for
      12 hours, until dashboard auth is enabled, or until `POST /api/session/logout` clears it.
      Changing the setup token invalidates every issued cookie.
    tags:
      - Session
    parameters:
      - name: X-Bifrost-Setup-Token
        in: header
        required: true
        schema:
          type: string
        description: The setup token configured via `setup_token` in config.json or `BIFROST_SETUP_TOKEN`.
    security: []
    responses:
      '200':
        description: Setup session started; the cookie is set with `Set-Cookie`.
        headers:
          Set-Cookie:
            schema:
              type: string
            description: '`bifrost_setup_session=<signed value>; Path=/; HttpOnly; SameSite=Strict` (plus `Secure` over TLS).'
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at:
                  type: string
                  format: date-time
                  description: When the setup session cookie expires.
      '401':
        description: The setup token header is missing.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '403':
        description: The setup token is wrong, or no setup token is configured on the server.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '409':
        description: The setup lock is not active (dashboard auth is enabled, or this is Bifrost Enterprise).
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
