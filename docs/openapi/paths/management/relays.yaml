# ---------------------------------------------------------------------------
# Data plane: /relay/{endpoint}/{path}
# Every method shares the same behaviour; one operation per method so clients see each.
# ---------------------------------------------------------------------------
_relay-call:
  description: &relay-call-description |
    Relays the request to the relay's upstream. Bifrost pins the request under the relay's `base_url`,
    matches it against the relay's `routes[]`, authenticates the caller like an inference request, drops the
    caller's credentials and gateway headers (`Authorization`, `x-api-key`, `api-key`, `x-goog-api-key`,
    `Cookie`, every `x-bf-*` header, hop-by-hop headers), injects the relay's own credential and
    `extra_headers`, and forwards the body unchanged. The upstream status, headers and body come back as is;
    a `text/event-stream` reply (or a route with `stream: true`) is streamed through.

    Governance evaluates the virtual key, its budgets and rate limits, then its relay grants: a key that
    holds no grant for this relay is refused with 403 before any upstream
    effect. A billable call with a 2xx reply is counted and charged what the relay's usage mapping computes;
    every call is written to Relay Logs. Routes that match no `routes[]` entry are refused with 404 unless
    the relay sets `skip_route_check`.

    Error responses generated by Bifrost itself use the standard error envelope. Error responses from the
    upstream are forwarded with the upstream's status and body.
  responses:
    "400":
      description: Malformed path (not rooted, `//`, backslashes or `..`), a request header sent under two spellings, or a request body the usage mapping cannot measure
      content:
        application/json:
          schema:
            $ref: "../../schemas/inference/common.yaml#/BifrostError"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      description: The virtual key has no grant for this relay, or a budget or rate limit refused the call
      content:
        application/json:
          schema:
            $ref: "../../schemas/inference/common.yaml#/BifrostError"
    "404":
      description: No relay has this name, no route matches the method and path, or the matching route is disabled
      content:
        application/json:
          schema:
            $ref: "../../schemas/inference/common.yaml#/BifrostError"
    "502":
      description: The upstream reply could not be relayed (for example a buffered response that exceeds the size limit)
      content:
        application/json:
          schema:
            $ref: "../../schemas/inference/common.yaml#/BifrostError"
    "500":
      $ref: "../../openapi.yaml#/components/responses/InternalError"

