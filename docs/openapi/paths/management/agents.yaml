    - Agent Gateway
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/agents.yaml#/AgentRegistrationView
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/agents.yaml#/AgentUpdateRequest
    x-mint:
      content: '**Required Permissions**


        | Permission | Granted via |

        | --- | --- |

        | `AgentGateway:Update` | RBAC role or API key scope |


        [How permissions work](/api/procuring-api-keys#required-permissions)

        '
