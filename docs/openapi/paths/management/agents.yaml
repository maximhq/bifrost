agents:
  post:
    operationId: agents_post
    summary: Register agent
    description: Fetch and validate an upstream A2A v1 Agent Card, then persist the registration. Enabled
      defaults to true. Uses management authentication.
    tags:
    - Agent Gateway
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '201':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/agents.yaml#/AgentRegistrationView
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/agents.yaml#/AgentCreateRequest
    x-mint:
      content: '**Required Permissions**


        | Permission | Granted via |

        | --- | --- |

        | `AgentGateway:Create` | RBAC role or API key scope |


        [How permissions work](/api/procuring-api-keys#required-permissions)

        '
  get:
    operationId: agents_get
    summary: List agents
    description: List all registrations, including disabled agents. Upstream credentials are redacted.
    tags:
    - Agent Gateway
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                agents:
                  type: array
                  items:
                    $ref: ../../schemas/management/agents.yaml#/AgentRegistrationView
                count:
                  type: integer
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
    x-mint:
      content: '**Required Permissions**


        | Permission | Granted via |

        | --- | --- |

        | `AgentGateway:View` | RBAC role or API key scope |


        [How permissions work](/api/procuring-api-keys#required-permissions)

        '
