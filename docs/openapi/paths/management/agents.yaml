inspect-agent:
  post:
    operationId: inspect_agent_post
    summary: Inspect agent card
    description: Fetch and validate an upstream A2A v1 card without registering the agent. Returns interfaces,
      capabilities, skills, security requirements, and warnings. Discovery credentials are used only for
      this fetch.
    tags:
    - Agent Gateway
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/agents.yaml#/AgentInspectResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
