agent-push-callback:
  post:
    operationId: agent_push_callback_post
    summary: Receive upstream push notification
    description: Upstream-only callback. Present the per-configuration token minted by Bifrost in A2A-Notification-Token.
      Bifrost verifies the event and task, then queues delivery to the registered downstream callback.
      Retransmissions are deduplicated. A downstream virtual key does not authenticate this endpoint.
    tags:
    - Agent Gateway
    security:
    - AgentNotificationTokenAuth: []
    responses:
      '202':
        description: Notification accepted; empty body.
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '413':
        description: Push payload exceeds the 1 MiB limit.
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/BifrostError
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/agents.yaml#/A2AEvent
