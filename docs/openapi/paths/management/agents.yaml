agent-push-configs:
  get:
    operationId: agent_push_configs_get
    summary: List stored push configurations
    description: List downstream callback configurations. Notification tokens and callback authentication
      credentials are never returned.
    tags:
    - Agent Gateway
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                push_configs:
                  type: array
                  items:
                    $ref: ../../schemas/management/agents.yaml#/AgentPushConfigView
                agent_names:
                  type: array
                  items:
                    type: string
                count:
                  type: integer
                total_count:
                  type: integer
                limit:
                  type: integer
                offset:
                  type: integer
      '401':
        $ref: ../../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../../openapi.yaml#/components/responses/Forbidden
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
    parameters:
    - name: agent_names
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated agent names.
    - name: task_id
      in: query
      required: false
      schema:
        type: string
    - name: config_id
      in: query
      required: false
      schema:
        type: string
    - name: url
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
      description: Page size. Nonpositive values default to 25; values above 100 are clamped to 100.
    - name: offset
      in: query
      required: false
      schema:
        type: integer
      description: Page offset. Negative values are clamped to zero.
    x-mint:
      content: '**Required Permissions**


        | Permission | Granted via |

        | --- | --- |

        | `AgentGateway:View` | RBAC role or API key scope |


        [How permissions work](/api/procuring-api-keys#required-permissions)

        '
