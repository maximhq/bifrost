agent-json-rpc:
  post:
    operationId: agent_json_rpc_post
    summary: Call agent over JSON-RPC
    description: 'Accepts a Bifrost virtual key in x-bf-vk, Authorization: Bearer, x-api-key, or x-goog-api-key.
      Authentication is required when enforce_auth_on_inference is enabled. An explicitly supplied invalid
      key is rejected even when authentication is optional. Access remains subject to agent grants and
      governance policy. A2A v1 JSON-RPC 2.0. SendStreamingMessage and SubscribeToTask return SSE. Protocol
      errors are JSON-RPC error envelopes; unsupported A2A-Version returns HTTP 200 with error code -32009.
      Unknown or disabled agents return an empty 404. gRPC is a separate listener advertised by the card
      when configured. SSE data events contain JSON-RPC response envelopes with A2A events.'
    tags:
    - Agent Gateway
    security:
    - VirtualKeyAuth: []
    - VirtualKeyBearerAuth: []
    - VirtualKeyApiKeyAuth: []
    - VirtualKeyGoogleAuth: []
    - {}
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/agents.yaml#/A2AJSONRPCResponse
          text/event-stream:
            schema:
              type: string
      '401':
        description: Authentication required. Error code -31401.
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/agents.yaml#/A2AJSONRPCError
      '404':
        description: Unknown or disabled agent; empty body.
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    - name: A2A-Version
      in: header
      required: false
      schema:
        type: string
      description: A2A v1 only. Omit to use the SDK default, or provide a 1.x version.
    - name: A2A-Extensions
      in: header
      required: false
      schema:
        type: string
      description: A2A extension URIs requested by the client.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/agents.yaml#/A2AJSONRPCRequest
          example:
            jsonrpc: '2.0'
            id: 1
            method: SendMessage
            params:
              message:
                messageId: message-1
                role: ROLE_USER
                parts:
                - text: Hello
