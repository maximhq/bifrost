    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/ModelRouterClassifyRequest'
          example:
            inputs:
              - id: row-1
                text: what time is it in Tokyo?
                expected_tier: SIMPLE
              - id: row-2
                text: now add retries with exponential backoff to the upload client
                previous_user_messages:
                  - here is our S3 upload client in Go
                expected_tier: MEDIUM
    responses:
