        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `RoutingRules:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update routing rule
    description: |
      Updates an existing routing rule's configuration.
    tags:
      - Routing
    parameters:
      - name: rule_id
        in: path
        required: true
        description: Routing rule ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/UpdateRoutingRuleRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Routing rule updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/RoutingRuleResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Routing rule not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '409':
        description: "Another rule in the same scope and scope_id already uses this priority, for example `routing rule with priority 5 already exists for scope 'global'; use a different priority`, or already has this name."
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteRoutingRule
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `RoutingRules:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete routing rule
    description: |
      Deletes a routing rule.
    tags:
      - Routing
    parameters:
      - name: rule_id
        in: path
        required: true
        description: Routing rule ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Routing rule deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '404':
        description: Routing rule not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

# Complexity analyzer

complexity:
  get:
    operationId: getComplexityAnalyzerConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get complexity analyzer config
    description: Returns the full complexity analyzer runtime config, including the selected classifier, semantic embedding and decision-model settings, optional LLM fallback settings, and per-tier reference phrase lists. Returns built-in defaults if none have been configured.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Complexity analyzer config retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexityAnalyzerConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

  put:
    operationId: updateComplexityAnalyzerConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update complexity analyzer config
    description: Replaces the full complexity analyzer runtime config and hot-reloads the routing plugin. Changing the embedding configuration or reference phrases triggers a background re-warm of the semantic classifier; unchanged phrases are not re-embedded. Setting semantic.fallback to llm requires an llm block. A decision model can be selected as the primary classifier or semantic fallback; it uses the decision block's provider and model (default typesafe/jev-latest) and that provider's credentials.
    tags:
      - Routing
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/ComplexityAnalyzerConfig'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Complexity analyzer config updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexityAnalyzerConfig'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

complexity-reset:
  post:
    operationId: resetComplexityAnalyzerConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Reset complexity analyzer config
    description: |
      Restores the built-in reference phrase lists and hot-reloads the routing plugin. The selected classifier, decision-model settings, semantic and LLM configuration, and session settings are preserved.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Complexity analyzer config reset successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexityAnalyzerConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

