complexity-suggestion-status:
  put:
    operationId: updateComplexitySuggestionStatus
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Accept, dismiss or reopen a phrase suggestion
    description: |
      Records the user's call on a suggestion. An open suggestion can be accepted or dismissed; either can be reopened. Accepting only records the decision: it does not change the phrase bank, so its phrases are served only once they are added to the bank, with POST /api/routing/model-routers/{router_id}/phrases or a router update. Later runs leave accepted and dismissed suggestions as they are and spend no model call on them, so the call sticks. Superseded is set by runs and cannot be changed here.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: router_id
        in: path
        required: true
        description: The model router; an unknown router is 404.
        schema:
          type: string
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestionStatusUpdate'
    responses:
      '200':
        description: Status updated
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestion'
      '400':
        description: Invalid request body, or a status that does not exist
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '404':
        description: The model router is not saved, or it has no suggestion with this id
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '409':
        description: The suggestion cannot move to that status from its current one, or it changed since it was read (another decision, or a run superseded it)
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '500':
        description: The suggestion could not be read or updated
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: Phrase suggestions are not available (no log store, or the routing plugin is not loaded), or the model router is saved but not loaded
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

complexity-suggestion-test:
  post:
    operationId: testComplexitySuggestionPhrases
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Test phrases against routed requests
    description: |
      Routes example requests the way the semantic router does, by nearest phrase, against the serving phrase bank and against the bank with the given phrases added, without saving anything. Use it to try an edited phrase before staging it. Each tested phrase also reports its nearest existing phrase, which shows a near-duplicate. The phrases and examples are embedded with the router's embedding model.
    tags:
      - Routing
    security:
