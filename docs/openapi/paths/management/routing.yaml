# Routing rule and complexity analyzer endpoints.
#
# Routing rules and the complexity analyzer config are also served on the /api/governance
# paths they used while routing rules lived inside the governance plugin. The *-legacy entries
# are aliases of the canonical operations: they $ref them with their own operationIds, since
# OpenAPI requires operationIds to be unique, and x-bifrost-successor marks them deprecated
# when the spec is bundled.

rules:
  get:
    operationId: listRoutingRules
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `RoutingRules:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List routing rules
    description: |
      Returns a list of all routing rules configured for intelligent request routing across providers.
    tags:
      - Routing
    parameters:
      - name: scope
        in: query
        description: Filter by scope. Returns only enabled rules in that scope and ignores limit, offset and search. A scope other than global needs scope_id.
        schema:
          type: string
          enum: [global, team, customer, virtual_key, user]
      - name: scope_id
        in: query
        description: Filter by scope ID. Required with a scope other than global.
        schema:
          type: string
      - name: limit
        in: query
        description: >-
          Page size, 0 to 100 (default 25). Values above 100 are clamped to 100 without an error, and 0 uses the default, so read `limit` back from the response. Page with `offset` until `offset >= total_count`. Sending limit, offset or
          search returns one page; without them every rule is returned. Ignored when
          scope is set.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 25
      - name: offset
        in: query
        description: Number of rules to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: search
        in: query
        description: Case-insensitive match against the rule's name or CEL expression.
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ListRoutingRulesResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createRoutingRule
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `RoutingRules:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Create routing rule
    description: |
      Creates a new CEL-based routing rule for intelligent request routing. Provider and model can be left empty to use the incoming request values. Only `name` and at least one target are required: `scope` defaults to `global`, `priority` to `0`, `enabled` to `true` and `chain_rule` to `false`, and an empty `cel_expression` matches every request.
    tags:
      - Routing
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/CreateRoutingRuleRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Routing rule created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/RoutingRuleResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '409':
        description: "Another rule in the same scope and scope_id already uses this priority, for example `routing rule with priority 5 already exists for scope 'global'; use a different priority`, or already has this name."
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

