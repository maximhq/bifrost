    summary: Cancel a phrase suggestion run
    description: |
      Stops a queued or running run, on whichever gateway node runs it. A queued run is recorded as cancelled at once. A running run stops at its next check and records itself as cancelled, keeping what it had written; the call waits a few seconds for that and returns the run as it ended, or, if it has not stopped by then, as it stands, still running.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: router_id
        in: path
        required: true
        description: The model router; an unknown router is 404.
        schema:
          type: string
    responses:
      '200':
        description: Run cancelled, or asked to stop
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestionRun'
      '404':
        description: The model router is not saved, or it has no run with this id
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '409':
        description: The run has already ended, or suggestions are off
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '500':
        description: The run could not be cancelled
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: Phrase suggestions are not available (no log store, or the routing plugin is not loaded), or the model router is saved but not loaded
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

complexity-suggestion-impact:
  post:
    operationId: replayComplexitySuggestionImpact
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Check what phrases would do to recent traffic
    description: |
      Adds the phrases given, by tier, to the router's saved phrases for this replay only, routes the router's captured requests from the window, by nearest phrase, against the saved bank and against the bank with the phrases added, and reports what would change. Nothing is saved: the phrases are dropped after the replay, and only the add phrases endpoint saves phrases. A phrase its tier already holds is skipped and reported; one another tier holds is refused. A window that reaches back before the router captured requests is first filled from its logs. Reported: each tier's request counts under both, the requests that change tier (the first 25 listed with their text when the caller may read their logs), and new phrases that take requests the live bank placed confidently in another tier. Past 10,000 requests a uniform sample of the window is replayed.

      Only requests that change tier are priced, both sides at the router's current models: their logged tokens at the highest-weighted target model of their live tier (or, when the live tier has no target, the model that served them), and at the router's highest-weighted target model for their new tier, at list price before caching. A change into no match, to a tier without a target model or known price, or of a log that is gone is counted as unpriced. A sampled replay's costs are scaled up to the whole window. Draft phrases the live bank lacks are embedded with the router's embedding model.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: router_id
        in: path
        required: true
        description: The model router; an unknown router is 404.
        schema:
          type: string
      - name: window
        in: query
        required: false
        description: Hours or days (24h, 7d); omitted is the whole lookback.
        schema:
          type: string
          example: 7d
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestionImpactRequest'
    responses:
      '200':
        description: Draft replayed
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestionImpact'
      '400':
        description: No phrases, an empty or too-long phrase, an unknown tier, a phrase another tier already holds, a bank past its phrase limit, or a window that is not a duration or is longer than the lookback
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '404':
        description: The model router is not saved
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '409':
        description: Suggestions are off for this router, or the stored router is in a form this version cannot read; save or reset it
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '500':
        description: The stored router could not be read
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '502':
        description: The embedding provider failed the draft's new phrases, or the logs could not be read
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: The router has no warmed phrase bank, phrase suggestions are not available (no log store, or the routing plugin is not loaded), the model router is saved but not loaded, or the config store is not available
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

model-router-phrases:
  post:
    operationId: addModelRouterPhrases
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Add phrases to a model router
    description: |
      Appends phrases, by tier, to the router's saved phrase bank and serves it; the one phrase suggestion endpoint that changes routing. A phrase its tier already holds is skipped and reported. A phrase another tier holds, a bank past its phrase limit, or a suggestion named that is not the router's or not open refuses the request, and nothing is saved. Once the phrases are saved, the suggestions named are marked accepted: the phrases stay saved even when one cannot be (a run superseded it meanwhile, or its status could not be written), and `accepted` lists only those that were. The router is served again even when every phrase was already there, so a retry after a failed reload reaches it. Unknown fields are refused with 400. Changed phrases are re-embedded in the background, as any phrase save is.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: router_id
        in: path
        required: true
        description: The model router; an unknown router is 404.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/AddModelRouterPhrasesRequest'
    responses:
      '200':
        description: Phrases added and the router served
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/AddModelRouterPhrasesResponse'
      '400':
        description: No phrases, an empty or too-long phrase, an unknown tier, a tier given twice, a phrase another tier already holds, or a bank past its phrase limit
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '404':
        description: The router, or a suggestion named, does not exist
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '409':
        description: A suggestion named is not open, or the stored router is one this version cannot read
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '500':
        description: The suggestions named could not be read, the save failed, or the phrases were saved but the router could not be served; a retry saves nothing more and reaches the reload again
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: suggestion_ids were sent while phrase suggestions are unavailable (no routing plugin or log store)
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
