complexity-status:
  get:
    operationId: getComplexityAnalyzerStatus
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get complexity classifier status
    description: |
      Returns the runtime status of the semantic complexity classifier (disabled, warming, ready, or failed), including warmup progress and whether a previous generation is still serving. When the llm fallback block is configured, also returns its readiness and the shipped default classification prompt.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Complexity classifier status retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySemanticStatus'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

complexity-status-retry:
  post:
    operationId: retryComplexityAnalyzerWarmup
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Retry failed complexity classifier warmup
    description: |
      Restarts the saved semantic classifier warmup only when its current state is failed. The retry runs asynchronously and does not change the saved configuration.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '202':
        description: Semantic warmup retry accepted
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySemanticStatus'
      '409':
        description: The semantic classifier is not currently failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

complexity-generations:
  get:
    operationId: listComplexityGenerations
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List complexity classifier generations
    description: |
      Lists the exemplar generations held in the vector store for semantic complexity routing, flagging the one currently serving. Every configuration change mints a new fingerprinted generation; a node-local store reclaims the previous one automatically, but on a shared external store retired generations are kept because another replica may still be serving them. The store holds no phrase text, so this listing is the only way to identify what has accumulated.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Generations retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexityGenerations'
      '503':
        description: The vector store could not be enumerated
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

complexity-generation-delete:
  delete:
    operationId: deleteComplexityGeneration
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Governance:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete a retired complexity generation
    description: |
      Removes one retired exemplar generation and the vectors it holds. The serving generation is refused, as are namespaces outside the classifier's own naming scheme, so this cannot drop an unrelated collection sharing the same backend. Deleting a generation that is already gone succeeds.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
    parameters:
      - name: namespace
        in: path
        required: true
        description: The fingerprinted namespace to remove, as returned by the generations listing.
        schema:
          type: string
          example: BifrostComplexityRouter_943f4d9a1b0502568b4dc4911c81cfa8c8b3fb3eb71311e732c95b18003cfdb5
    responses:
      '200':
        description: Generation deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: deleted
                namespace:
                  type: string
      '400':
        description: The namespace is not a complexity routing generation
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '409':
        description: The generation is currently serving classification requests
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: The vector store could not be reached
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

