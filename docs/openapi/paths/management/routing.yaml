complexity-suggestions:
  get:
    operationId: listComplexitySuggestions
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List phrase suggestions
    description: |
      Lists stored phrase suggestions for the semantic complexity router, largest cluster first, with how many there are per status, the last run, and when the next scheduled run is. Suggestions are written by runs over a sample of routed traffic; see the suggestions block of the model router config.
    tags:
      - Routing
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: router_id
        in: path
        required: true
        description: The model router; an unknown router is 404.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Comma-separated statuses to list (open, accepted, dismissed, superseded); default open.
        schema:
          type: string
          example: open,dismissed
      - name: limit
        in: query
        required: false
        description: Page size; default 100, at most 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: offset
        in: query
        required: false
        description: Suggestions to skip, in list order; default 0.
        schema:
          type: integer
          minimum: 0
    responses:
      '404':
        description: The model router is not saved
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '200':
        description: Suggestions retrieved
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ComplexitySuggestionsList'
      '400':
        description: Unknown status, or a limit or offset out of range
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '500':
        description: The suggestions could not be read
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'
      '503':
        description: Phrase suggestions are not available (no log store, or the routing plugin is not loaded), or the model router is saved but not loaded
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/BifrostError'

