    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Routers:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Classify statements with a model router
    description: |
      Classifies up to 100 statements with one model router as it is served now, and returns the complexity tier each one gets. Each statement is classified as the latest user turn of a chat request, through the same input extraction, classifier, and fallback chain as live traffic.

      Nothing is saved. No session tier is read or changed, and the statements are not captured for phrase suggestions. A router whose classifier is the decision model, or that falls back to the decision model or the LLM classifier, makes one model call per statement that reaches it, billed like any routing call.

      Label statements with `expected_tier` to score a dataset: the summary then reports accuracy over the labelled statements and a confusion matrix. Send a larger dataset in pages of 100.
    tags:
