# Paths for Business Unit management (Enterprise).
#
# Business units are organizational groupings that own governance (budget + rate
# limit). Membership is a many-to-many relation with users: a user may belong to
# several business units, and each membership edge carries its own provenance
# (manual / SCIM / OIDC) so one sync channel never clears another's. They live
# entirely under /api/governance/business-units, mirroring the other governance
# entities; the budget + rate-limit configuration is nested under
# /{id}/governance, and the member roster under /{id}/users. Implemented in
# bifrost-enterprise/handlers/businessunits.go.

# ---- Business Unit CRUD ----

business-units:
  get:
    operationId: listBusinessUnits
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List business units
    description: Returns a paginated list of business units, each with its user count.
    tags:
      - Governance
    parameters:
      - name: offset
        in: query
        description: Zero-based result offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Maximum number of business units to return (max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Case-insensitive search by business unit name
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/ListBusinessUnitsResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Create business unit
    description: Creates a new business unit. Names must be unique.
    tags:
      - Governance
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/CreateBusinessUnitRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitMutationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '409':
        description: A business unit with this name already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

business-units-by-id:
  get:
    operationId: getBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get business unit
    description: Returns a specific business unit by ID, including governance and user count.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitDetailResponse'
      '404':
        description: Business unit not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Update business unit
    description: Updates the business unit name.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/CreateBusinessUnitRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitMutationResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '409':
        description: A business unit with this name already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Delete business unit
    description: |
      Deletes a business unit. Every user membership of it is atomically removed as part of the
      deletion, and each affected user's governance is refreshed so the business unit stops
      applying to their requests.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '404':
        description: Business unit not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

# ---- Business Unit - User Membership (M:N) ----

business-units-users:
  get:
    operationId: listBusinessUnitUsers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List business unit users
    description: |
      Returns a paginated list of users that belong to the business unit, each with the
      provenance of its membership edge so a caller can tell an admin assignment apart from
      an identity-provider-synced one.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
      - name: offset
        in: query
        description: Zero-based result offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Maximum number of users to return (max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Case-insensitive search by user name or email
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitUsersResponse'
      '404':
        description: Business unit not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: assignUserToBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Assign user to business unit
    description: |
      Assigns an existing user to the business unit. Membership is many-to-many, so a user may
      belong to several business units and there is no conflict to reject.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/AssignUserToBusinessUnitRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: User assigned to business unit
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Business unit or user not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

business-units-user-by-id:
  delete:
    operationId: removeUserFromBusinessUnit
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Remove user from business unit
    description: Removes a user's membership of the business unit.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: User removed from business unit
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Membership not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

# ---- Business Unit Governance (budget + rate limit) ----

business-units-governance:
  post:
    operationId: createBusinessUnitGovernance
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Create business unit governance
    description: |
      Configures budget and/or rate limit governance for a business unit. At least
      one of `budget` or `rate_limit` is required. Returns 409 if the business unit
      already has governance configured (use PUT to update).
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/CreateBusinessUnitGovernanceRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit governance created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitGovernanceResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Business unit not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '409':
        description: Business unit already has governance configured
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateBusinessUnitGovernance
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Update business unit governance
    description: |
      Updates budget and/or rate limit governance for a business unit. Passing an
      empty `budget` or `rate_limit` object removes that governance component.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/UpdateBusinessUnitGovernanceRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit governance updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BusinessUnitGovernanceResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Business unit not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteBusinessUnitGovernance
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Delete business unit governance
    description: Removes all budget and rate limit governance from a business unit.
    tags:
      - Governance
    parameters:
      - name: business_unit_id
        in: path
        required: true
        description: Business unit ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Business unit governance deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '404':
        description: Business unit not found or has no governance configured
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
