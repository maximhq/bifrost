providers:
  get:
    operationId: listProviders
    summary: List all providers
    description: Returns a list of all configured providers with their configurations and status.
    tags:
      - Providers
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ListProvidersResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: addProvider
    summary: Add a new provider
    description: |
      Adds a new provider with the specified configuration.
      Setting network_config.base_url or network_config.allow_private_network requires a
      genuinely authenticated admin session - it is refused with 403 if dashboard
      authentication is disabled or unconfigured, even though other management endpoints
      remain reachable in that state. allow_private_network is guarded even without a base
      URL, because it also governs which addresses key-level URLs (Ollama/SGL/VLLM) may reach.
      The same applies to settings that let a third party read credentials in flight:
      proxy_config.url, proxy_config.ca_cert_pem, network_config.ca_cert_pem,
      network_config.insecure_skip_verify, and any absolute (scheme and host)
      custom_provider_config.request_path_overrides value.
    tags:
      - Providers
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/providers.yaml#/AddProviderRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Provider added successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ProviderResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          network_config.base_url, allow_private_network, a proxy URL, a CA certificate,
          insecure_skip_verify, or an absolute request path override was supplied and dashboard
          authentication is disabled or unconfigured (the request was not genuinely
          authenticated)
      '409':
        description: Provider already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

providers-by-name:
  get:
    operationId: getProvider
    summary: Get a specific provider
    description: Returns the configuration for a specific provider.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ProviderResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Provider not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateProvider
    summary: Update a provider
    description: |
      Updates a provider's configuration. Expects ALL fields to be provided,
      including both edited and non-edited fields. Partial updates are not supported.
      Changing network_config.base_url, or turning on network_config.allow_private_network
      (with or without a base URL), requires a genuinely authenticated admin session - it is
      refused with 403 if dashboard authentication is disabled or unconfigured, even though
      other management endpoints remain reachable in that state. The same applies to setting
      or changing proxy_config.url, proxy_config.ca_cert_pem, network_config.ca_cert_pem, or
      an absolute (scheme and host) custom_provider_config.request_path_overrides value, and
      to turning on network_config.insecure_skip_verify. Sending the stored values back
      unchanged (including redacted placeholders), clearing the base URL, proxy or an
      override, path-only overrides, or turning allow_private_network or
      insecure_skip_verify off is allowed.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/providers.yaml#/UpdateProviderRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Provider updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ProviderResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          network_config.base_url, a proxy URL, a CA certificate, or an absolute request path
          override was changed, or allow_private_network or insecure_skip_verify was turned on,
          and dashboard authentication is disabled or unconfigured (the request was not
          genuinely authenticated)
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteProvider
    summary: Delete a provider
    description: Removes a provider from the configuration.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Provider deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ProviderResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Provider not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

provider-keys:
  get:
    operationId: listProviderKeys
    summary: List keys for a provider
    description: Returns all keys configured for a specific provider.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ListProviderKeysResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Provider not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createProviderKey
    summary: Create a key for a provider
    description: |
      Creates a new API key for the specified provider. The key `id` is auto-generated
      if omitted. `enabled` defaults to `true` if omitted. `value` is required and must
      not be empty. Keys cannot be created on keyless providers.
      Setting any field that chooses the host Bifrost sends this key's credentials to
      requires a genuinely authenticated admin session - it is refused with 403 if dashboard
      authentication is disabled or unconfigured, even though other management endpoints
      remain reachable in that state.
      Guarded fields: ollama_key_config.url, sgl_key_config.url, vllm_key_config.url,
      azure_key_config.endpoint, databricks_key_config.workspace_url,
      github_copilot_key_config.github_domain,
      bedrock_key_config.endpoints.*, bedrock_mantle_key_config.endpoints.*, and
      aliases.<name>.endpoint.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/providers.yaml#/Key'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Key created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/Key'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A key endpoint field was set, changed, or removed and dashboard authentication is
          disabled or unconfigured (the request was not genuinely authenticated)
      '404':
        description: Provider not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '409':
        description: Key ID already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

provider-key-by-id:
  get:
    operationId: getProviderKey
    summary: Get a specific key for a provider
    description: Returns a single key for the specified provider.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
      - name: key_id
        in: path
        required: true
        description: Key ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/Key'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Provider or key not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateProviderKey
    summary: Update a key for a provider
    description: |
      Updates an existing key. Send the full key object. Redacted values sent back
      unchanged are automatically preserved (the server merges them with the stored
      raw values).
      Setting, changing, or removing any field that chooses the host Bifrost sends this
      key's credentials to requires a genuinely authenticated admin session - it is refused
      with 403 if dashboard authentication is disabled or unconfigured, even though other
      management endpoints remain reachable in that state. Sending the stored values back
      unchanged is allowed.
      Guarded fields: ollama_key_config.url, sgl_key_config.url, vllm_key_config.url,
      azure_key_config.endpoint, databricks_key_config.workspace_url,
      github_copilot_key_config.github_domain,
      bedrock_key_config.endpoints.*, bedrock_mantle_key_config.endpoints.*, and
      aliases.<name>.endpoint.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
      - name: key_id
        in: path
        required: true
        description: Key ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/providers.yaml#/Key'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Key updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/Key'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A key endpoint field was set, changed, or removed and dashboard authentication is
          disabled or unconfigured (the request was not genuinely authenticated)
      '404':
        description: Provider or key not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteProviderKey
    summary: Delete a key from a provider
    description: Deletes a key from the specified provider. Returns the deleted key.
    tags:
      - Providers
    parameters:
      - name: provider
        in: path
        required: true
        description: Provider name
        schema:
          type: string
      - name: key_id
        in: path
        required: true
        description: Key ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Key deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/Key'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Provider or key not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

keys:
  get:
    operationId: listKeys
    summary: List all keys
    description: Returns a list of all configured API keys across all providers.
    tags:
      - Providers
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../schemas/management/providers.yaml#/Key'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

models:
  get:
    operationId: listModelsManagement
    summary: List models
    description: |
      Lists available models with optional filtering by query, provider, or keys.
    tags:
      - Providers
    parameters:
      - name: query
        in: query
        description: Filter models by name (case-insensitive partial match)
        schema:
          type: string
      - name: provider
        in: query
        description: Filter by specific provider name
        schema:
          type: string
      - name: keys
        in: query
        description: Comma-separated list of key IDs to filter models accessible by those keys
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Maximum number of results to return (default 5)
        schema:
          type: integer
          default: 5
      - name: unfiltered
        in: query
        description: If true, return all models including those filtered out by provider-level restrictions
        schema:
          type: boolean
          default: false
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ListModelsResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

models-details:
  get:
    operationId: listModelDetailsManagement
    summary: List model details
    description: |
      Lists available models with capability metadata, when available from the model catalog, with optional filtering by query, provider, or keys.
    tags:
      - Providers
    parameters:
      - name: query
        in: query
        description: Filter models by name (case-insensitive partial match)
        schema:
          type: string
      - name: provider
        in: query
        description: Filter by specific provider name
        schema:
          type: string
      - name: keys
        in: query
        description: Comma-separated list of key IDs to filter models accessible by those keys
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Maximum number of results to return (default 20)
        schema:
          type: integer
          default: 20
      - name: unfiltered
        in: query
        description: If true, return all models including those filtered out by provider-level restrictions
        schema:
          type: boolean
          default: false
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/ListModelDetailsResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

models-parameters:
  get:
    operationId: getModelParameters
    summary: Get model parameters
    description: >-
      Returns the available parameter definitions for a model. The model ID
      is resolved against the model-parameters catalog with fallbacks, so
      provider-qualified IDs returned by /v1/models (e.g. "openai/gpt-4o",
      "openrouter/openai/gpt-4o") and bare aliases of provider-qualified
      catalog entries resolve to the same record as the stored key.
    tags:
      - Providers
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: model
        in: query
        required: true
        description: Model ID to get parameters for; provider-qualified IDs are resolved automatically
        schema:
          type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

models-base:
  get:
    operationId: listBaseModels
    summary: List base models
    description: Returns a list of base models from the model catalog.
    tags:
      - Providers
    parameters:
      - name: query
        in: query
        description: Filter models by name
        schema:
          type: string
      - name: provider
        in: query
        description: Filter by provider
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
