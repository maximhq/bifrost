users:
  get:
    operationId: listUsers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List users
    description: Returns a paginated list of users with optional search.
    tags:
      - Users
    parameters:
      - name: offset
        in: query
        description: Zero-based result offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: Number of users per page (max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Search by name or email
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/ListUsersResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createUser
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Create user
    description: Manually creates a new user in the organization.
    tags:
      - Users
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/users.yaml#/CreateUserRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/UserResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '409':
        description: User with this email already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-email-virtual-keys:
  get:
    operationId: getUserVirtualKeysByEmail
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get user's virtual keys by email
    description: >
      **Enterprise only.**

      Returns all virtual keys associated with a user, looked up by email
      address. Returns an empty `virtual_keys` array when the user exists but
      has no virtual keys assigned. Intended for MDM and credential-helper
      integrations that need to resolve a user's keys without knowing their
      internal ID.
    tags:
      - Users
    parameters:
      - name: email
        in: path
        required: true
        description: URL-encoded email address of the user
        schema:
          type: string
          format: email
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/UserVirtualKeyLookupResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-by-email:
  get:
    operationId: getUserByEmail
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get user by email
    description: Returns a single Enterprise user resolved by URL-encoded email address.
    tags:
      - Users
    parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/UserObject'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-by-id:
  get:
    operationId: getUser
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get user
    description: Returns a single Enterprise user.
    tags:
      - Users
    parameters:
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/UserObject'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteUser
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Delete user
    description: >
      Permanently removes a user from the organization. This cascades to delete
      the user's governance settings (budget/rate limits), team memberships,
      access profiles, and OIDC sessions. Cannot delete yourself.
    tags:
      - Users
    parameters:
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: User deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        description: Bad request (e.g. cannot delete yourself)
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-me-permissions:
  get:
    operationId: getCurrentUserPermissions
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get current user permissions
    description: >
      Returns the RBAC permissions for the authenticated user. When SCIM is not
      enabled, returns full permissions for all resources. Otherwise returns the
      permissions associated with the user's assigned role.
    tags:
      - Users
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/PermissionsResponse'
      '401':
        description: Unauthorized (user not authenticated)
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-role:
  put:
    operationId: assignUserRole
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Assign role to user
    description: >
      Assigns an RBAC role to a user. This also auto-assigns the default
      access profile for the new role and reloads the RBAC permission cache.
    tags:
      - Users
    parameters:
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/users.yaml#/AssignUserRoleRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Role assigned successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: User or role not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

users-teams:
  get:
    operationId: getUserTeams
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Get user's teams
    description: Returns the list of teams a user belongs to, including the membership source.
    tags:
      - Users
    parameters:
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/UserTeamsResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateUserTeams
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Update user's team assignments
    description: >
      Replaces the user's manual team assignments. Synced team memberships
      (from SCIM providers) are preserved and cannot be removed via this endpoint.
    tags:
      - Users
    parameters:
      - name: user_id
        in: path
        required: true
        description: User ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/users.yaml#/UpdateUserTeamsRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Teams updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        description: Bad request (e.g. team not found)
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

