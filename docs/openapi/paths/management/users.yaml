# ---- Teams ----

team-members:
  get:
    operationId: getTeamMembers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List team members
    description: Returns all members of a team with their user details and membership source.
    tags:
      - Teams
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/users.yaml#/TeamMembersResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Team not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: addTeamMember
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Add team member
    description: Adds a user to a team. Both the team and user must exist.
    tags:
      - Teams
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/users.yaml#/AddTeamMemberRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Member added successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '404':
        description: Team or user not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '409':
        description: User is already a member of this team
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

team-member-by-id:
  delete:
    operationId: removeTeamMember
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Remove team member
    description: Removes a user from a team.
    tags:
      - Teams
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        description: User ID to remove
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Member removed successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '404':
        description: Membership not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
