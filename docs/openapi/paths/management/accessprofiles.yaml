teams/{team_id}/access-profile/migrate:
  post:
    operationId: migrateTeamToAccessProfile
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Migrate a team to a new access profile
    description: >-
      Moves this team off its legacy budgets and rate limit onto a new access profile created for
      it from those limits - same amounts and reset windows, so all spend carries over - granting the
      chosen providers. Every virtual key the team owns is adopted, and the legacy limits are
      deleted. With `dry_run: true` nothing changes and the response previews the profile, the
      migration plan and the keys that would be adopted. If the attach fails the created profile is
      deleted, so a failed migration changes nothing.
    tags:
      - Access Profiles
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, provider_access]
            properties:
              name:
                type: string
                description: Name of the new access profile.
              provider_access:
                type: string
                enum: [all, selected, none]
                description: >-
                  `all` grants every configured provider; `selected` grants only the providers in
                  `provider_configs` and `providers`; `none` grants nothing until the profile is edited.
              provider_configs:
                type: array
                items:
                  $ref: '../../schemas/management/accessprofiles.yaml#/ProviderConfig'
                description: >-
                  With `provider_access` `selected`, each provider granted as an access profile grants
                  it: its allowed and blocked models, keys, and per-provider and per-model limits. A
                  provider listed here and in `providers` takes this config.
              providers:
                type: array
                items:
                  type: string
                description: >-
                  With `provider_access` `selected`, providers granted with all of their models. One of
                  `provider_configs` or `providers` is required when `provider_access` is `selected`.
              dry_run:
                type: boolean
                description: Preview the migration without changing anything.
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: >-
          The migration ran (`status: migrated`, with the new template, the attachment,
          `adopted_virtual_key_ids` and the `migration` plan), or its preview for a dry run
          (`access_profile`, `name_available`, `legacy_limits`, `migration`, `virtual_keys`).
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: The team does not exist.
      '409':
        description: The team already holds an access profile, or the profile name is taken.
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

