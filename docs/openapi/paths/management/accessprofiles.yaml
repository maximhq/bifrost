teams/{team_id}/access-profile/budgets/{budget_id}/override:
  put:
    operationId: updateTeamAccessProfileBudgetOverride
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Set a team's access-profile budget override
    description: |
      Sets or replaces the spending override on one budget of the access profile attached to this team.
      The override is additive - while it is active the budget is enforced against
      `max_limit + override_amount` - and it leaves the budget's base limit, current usage, and reset
      schedule untouched. Only this team is affected; the template and every other holder keep their
      limits. Use `mode: cycles` with a `cycles` count for a finite number of reset windows, or
      `mode: forever` until it is deleted. The override survives template propagation.

      Overrides apply to access-profile budgets only, not to legacy team budgets.
    tags:
      - Access Profiles
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: budget_id
        in: path
        required: true
        description: ID of a budget on the team's access profile - its own, a provider's, or a per-model one
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/governance.yaml#/BudgetOverrideRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Budget override applied successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BudgetOverrideResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: No access profile is attached to this team, or the budget is not one of its budgets.
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
  delete:
    operationId: deleteTeamAccessProfileBudgetOverride
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Remove a team's access-profile budget override
