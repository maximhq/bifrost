      Removes any active override from the budget, so it is enforced against its base `max_limit` again.
      Current usage and the reset schedule are unchanged. Safe to call on a budget with no override.
    tags:
      - Access Profiles
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: budget_id
        in: path
        required: true
        description: ID of a budget on the team's access profile - its own, a provider's, or a per-model one
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Budget override removed
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/governance.yaml#/BudgetOverrideResponse'
      '404':
