# Webhooks Management API

webhooks:
  get:
    operationId: listWebhookEndpoints
    summary: List webhook endpoints
    description: |
      Returns webhook endpoints, optionally filtered by search text, subscribed
      event, and disabled status. Signing secrets are never included and custom
      header values are redacted.
    tags:
      - Webhooks
    parameters:
      - name: search
        in: query
        required: false
        description: Case-insensitive match against endpoint name or URL.
        schema:
          type: string
      - name: event
        in: query
        required: false
        description: Comma-separated events; returns endpoints subscribed to any of them.
        schema:
          type: string
      - name: disabled
        in: query
        required: false
        description: Filter by disabled status. Omit for no filter.
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      '200':
        description: A page of webhook endpoints
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpointList'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []
  post:
    operationId: createWebhookEndpoint
    summary: Create a webhook endpoint
    description: |
      Creates a webhook endpoint. The signing secret is generated by the server
      and returned once in the response — it cannot be supplied and cannot be
      retrieved again afterwards.
    tags:
      - Webhooks
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpointRequest'
    responses:
      '201':
        description: Endpoint created; signing secret returned once.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpointWithSecret'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []

webhooks-by-id:
  get:
    operationId: getWebhookEndpoint
    summary: Get a webhook endpoint
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    responses:
      '200':
        description: The webhook endpoint
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpoint'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []
  put:
    operationId: updateWebhookEndpoint
    summary: Update a webhook endpoint
    description: |
      Updates a webhook endpoint. The signing secret is immutable here — use the
      rotate-secret endpoint to change it.
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpointRequest'
    responses:
      '200':
        description: The updated webhook endpoint
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpoint'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []
  delete:
    operationId: deleteWebhookEndpoint
    summary: Delete a webhook endpoint
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    responses:
      '200':
        description: Endpoint deleted
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookStatusResponse'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []

webhooks-rotate-secret:
  post:
    operationId: rotateWebhookEndpointSecret
    summary: Rotate a webhook signing secret
    description: |
      Generates a new signing secret for the endpoint and returns it once. The
      previous secret stops verifying immediately — there is no grace window, so
      update your receiver in the same change.
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    responses:
      '200':
        description: Secret rotated; new signing secret returned once.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookEndpointWithSecret'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
    security:
      - ManagementBearerAuth: []

webhooks-test:
  post:
    operationId: testWebhookEndpoint
    summary: Send a test delivery
    description: |
      Sends a sample signed delivery for the chosen event through the production
      signing path.
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/webhooks.yaml#/TestWebhookRequest'
    responses:
      '200':
        description: Test delivery attempted
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/TestWebhookResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
    security:
      - ManagementBearerAuth: []

webhooks-deliveries:
  get:
    operationId: listWebhookDeliveries
    summary: List delivery history
    description: Returns one page of delivery-attempt history for an endpoint, newest first.
    tags:
      - Webhooks
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      '200':
        description: A page of delivery history
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookDeliveryList'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '503':
        description: Logs store is not available.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
    security:
      - ManagementBearerAuth: []

webhooks-deliveries-search:
  get:
    operationId: searchWebhookDeliveries
    summary: Search delivery history
    description: |
      Returns one page of delivery-attempt history across every endpoint the
      filters select, newest first. Unlike the per-endpoint
      `/api/webhooks/{id}/deliveries` route, every filter is optional, so an
      unfiltered call returns history for all endpoints.

      Pagination is by delivery group (`webhook_id`), not by individual attempt:
      a page holds every attempt of the deliveries it covers, so `deliveries`
      can hold more entries than `limit`, and `total_count` counts deliveries
      rather than attempts.

      Filters select delivery groups, not attempts — a delivery is on the page
      if any of its attempts matches — and the matched delivery is then returned
      with its full attempt sequence intact.
    tags:
      - Webhooks
    parameters:
      - name: endpoint_ids
        in: query
        required: false
        description: Comma-separated webhook endpoint ids. Omit for all endpoints.
        schema:
          type: string
      - name: events
        in: query
        required: false
        description: Comma-separated event names, e.g. `async_job.completed`.
        schema:
          type: string
      - name: outcomes
        in: query
        required: false
        description: |
          Comma-separated delivery outcomes: `delivered`, `retryable_failure`,
          `permanent_failure`, `exhausted`.
        schema:
          type: string
      - name: status_class
        in: query
        required: false
        description: |
          Comma-separated response status bands: `2xx`, `4xx`, `5xx`, or `none`
          for attempts where no response arrived. Bands are alternatives (OR).
        schema:
          type: string
      - name: request_id
        in: query
        required: false
        description: Exact inference request id the delivery was raised for.
        schema:
          type: string
      - name: delivery_id
        in: query
        required: false
        description: Exact delivery-run id (the `webhook-id` wire header).
        schema:
          type: string
      - name: start_time
        in: query
        required: false
        description: RFC3339 lower bound on attempt time. Ignored when `period` is set.
        schema:
          type: string
          format: date-time
      - name: end_time
        in: query
        required: false
        description: RFC3339 upper bound on attempt time. Ignored when `period` is set.
        schema:
          type: string
          format: date-time
      - name: period
        in: query
        required: false
        description: |
          Relative window (e.g. `1h`, `24h`) resolved server-side. Takes
          precedence over `start_time` / `end_time`.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    responses:
      '200':
        description: A page of delivery history
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/WebhookDeliveryList'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '503':
        description: Logs store is not available.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
    security:
      - ManagementBearerAuth: []

webhooks-deliveries-redeliver:
  post:
    operationId: redeliverWebhook
    summary: Re-queue a delivery
    description: |
      Re-queues the delivery a history record belongs to, under its original
      webhook-id so receivers can deduplicate the replay.
    tags:
      - Webhooks
    parameters:
      - name: id
        in: path
        required: true
        description: The delivery history record id to re-queue.
        schema:
          type: string
    responses:
      '202':
        description: Redelivery queued
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/webhooks.yaml#/RedeliverWebhookResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '409':
        description: This delivery is already in flight.
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
    security:
      - ManagementBearerAuth: []

components:
  parameters:
    WebhookEndpointId:
      name: id
      in: path
      required: true
      description: The webhook endpoint id.
      schema:
        type: string
