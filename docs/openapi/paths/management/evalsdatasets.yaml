    summary: Compare two versions
    description: |
      Returns what changed from an earlier version to this one: column changes, and a page of added, removed and changed rows. Use `draft` as the number to compare the unsaved draft. `draft` is read again on every request. If a version is saved between pages, the next page compares a different pair. Check `from` and `to` on every page and start over when they change. To page a fixed comparison, use saved version numbers for both `number` and `against`. `from` and `to` change when a version is saved, not when the draft is edited, so an unsaved edit between two pages of a `draft` comparison is not detected. Column changes list added, removed, renamed and retyped columns; a change of column order is not reported.
    tags:
    - Datasets
    parameters:
    - name: number
      in: path
      required: true
      description: Version number, or `draft`
      schema:
        type: string
