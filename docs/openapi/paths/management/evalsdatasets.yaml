      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
datasets-files:
  post:
    operationId: uploadEvalDatasetFile
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Upload a file
    description: |
      Uploads a file for the dataset's file cells. The request body is the file itself, and its type comes from the Content-Type header. The bytes are kept in the object store when the gateway has one. Without one they are kept in the config database, and a file may be 5 MB at most.
    tags:
    - Datasets
    parameters:
    - *id001
    - name: name
      in: query
      required: true
      description: The file name
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetFileResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
