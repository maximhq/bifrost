datasets-version-restore:
  post:
    operationId: restoreEvalDatasetVersion
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Restore a version
    description: |
      Makes the dataset's rows and columns equal to a saved version and saves the result as a new version. Split membership is not versioned, and a restore does not roll it back. A row the restore brings back is in every split that still lists it (a split keeps a deleted row while a saved version holds it), and in no other split until it is added. Edits waiting in the draft are saved first, as their own version. With `max_versions` set, the restore's own save removes the oldest versions over the cap, which can include the version from before the restore and the one holding the waiting edits; the restore then cannot be undone. That pruning also takes out of every split the rows that no remaining version holds, such as a row added in the waiting edits. Restoring the version that is already the head, with no draft changes, returns that version and saves nothing.
    tags:
    - Datasets
    parameters:
    - *id001
    - *id005
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetVersionResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
