datasets-rows-from-logs:
  post:
    operationId: addEvalDatasetRowsFromLogs
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Add rows from logs
    description: |
      Adds one row per request log, filled by column type: the last user message as the input, the earlier messages as the conversation history, the reply as the output and the tool calls the model made as the expected tool calls. Logs that are missing, were stored without content, or whose content cannot be read are skipped and listed. The added rows are saved as a new version. Needs a log store. The text of all the logs in one call (messages, replies and tool calls) is capped at 64 MiB: past it the call fails with 400 and nothing is added, so send fewer logs per call.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetFromLogsRequest
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetCurateResult
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
datasets-rows-from-sessions:
  post:
    operationId: addEvalDatasetRowsFromSessions
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Add rows from sessions
    description: |
      Adds one row per session. The session's requests that have content go into a variable column named `session`, which is created when the dataset has none; a request logged without content (content logging off) is left out, and a session with no such request is skipped. The first request fills the input and the last reply fills the output. The added rows are saved as a new version. Needs a log store. A session is read up to 2,000 root requests (retries and fallbacks are not counted); a longer session is not cut short but skipped, and listed in `skipped` with the reason. A session one of whose requests cannot be read is skipped the same way. A request deleted while the session is read, by log retention for example, is left out. The session is saved with the requests that remain, or skipped and listed in `skipped` when none remain. Requests that arrive while the session is read are not included. The text of all the sessions in one call (requests, replies and tool calls) is capped at 64 MiB: past it the call fails with 400 and nothing is added, so send fewer sessions per call.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetFromSessionsRequest
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
