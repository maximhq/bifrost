# Dataset paths

datasets:
  get:
    operationId: listEvalDatasets
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List datasets
    description: |
      Returns datasets, newest first, each with its column, row and split counts.
    tags:
    - Datasets
    parameters:
    - name: search
      in: query
      required: false
      description: Case-insensitive match on name or description
      schema:
        type: string
    - name: tag
      in: query
      required: false
      description: Only datasets with this exact tag
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size. 0 or absent means 50; a value above 200 is read as 200
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      required: false
      description: Number of datasets to skip
      schema:
        type: integer
        minimum: 0
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetListResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  post:
    operationId: createEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Create a dataset
    description: |
      Creates a dataset. Columns come from `columns`, from a `template` (qa, retrieval or agent), from both, or are added later.
    tags:
    - Datasets
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
datasets-by-id:
  get:
    operationId: getEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get a dataset
    description: |
      Returns one dataset with its draft columns, its splits and its current row count.
    tags:
    - Datasets
    parameters:
    - &id001
      name: id
      in: path
      required: true
      description: Dataset ID
      schema:
        type: string
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetResponse
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  put:
    operationId: updateEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update a dataset
    description: |
      Replaces the name, description, tags and `max_versions` together. A field left out is cleared: send the current description, tags and `max_versions` to keep them. Leaving out `max_versions` removes the cap. Lowering `max_versions` deletes the oldest versions over the new limit right away. Versions that a test run reads, and the latest version, are never deleted, so more versions than `max_versions` can remain.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  delete:
    operationId: deleteEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete a dataset
    description: |
      Deletes a dataset with its rows, versions and splits. Its name becomes free for reuse. A dataset that any test run reads, finished runs included, cannot be deleted (409) until those runs are deleted.
    tags:
    - Datasets
    parameters:
    - *id001
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DeletedResponse
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
datasets-duplicate:
  post:
    operationId: duplicateEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Duplicate a dataset
    description: |
      Copies the columns, current rows and splits under a new name. The copy starts at version 1 and carries no history. Uploaded files are copied too, and the copy's file cells name its own files, so the copy keeps working after the source is deleted. If the dataset's draft, or the rows of a split it had when the copy started, change while it is being copied, the call fails with 409. A split created during the copy is not part of the copy. If anything fails after the copy is created (409 when the draft changes during the copy, or any other error), the copy is removed. That removal is best effort: if it fails too, a dataset with the copy's name is left behind, and a retry with that name gets 409 until it is deleted. List datasets, delete the leftover copy, then retry.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetDuplicateRequest
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
