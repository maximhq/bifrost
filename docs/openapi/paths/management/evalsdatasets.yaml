datasets-export:
  get:
    operationId: exportEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Export a dataset
    description: |
      Streams the dataset, one version of it or one split of it as CSV or JSONL. In CSV, a header or cell that starts with `=`, `+`, `-`, `@`, a tab or a carriage return is written with a leading `'`, so a spreadsheet reads it as text; an import of that CSV maps such a header back to its column, while the cells keep the quote. JSONL writes one row per line: text cells as JSON strings as stored, structured cells as their JSON value in compact form, and empty cells as `""`. Errors found by the checks before the stream starts are returned as JSON with their status. A read that fails once the stream has started, even before the first row, ends the transfer early, without the final chunk: treat an incomplete transfer as failed and discard its rows. The same happens when, while the export runs, the dataset is deleted, the exported version is removed, the draft's columns change (draft exports), or rows are added to or removed from the exported split through its membership endpoint (split exports): export again. Rows added, edited or deleted in the draft do not end a draft export: each page shows the rows as it read them.
    tags:
    - Datasets
    parameters:
    - *id001
    - name: format
      in: query
      required: false
      description: Defaults to csv
      schema:
        type: string
        enum:
        - csv
        - jsonl
    - *id004
    - name: split
      in: query
      required: false
      description: Only rows in this split (a split ID). Split membership is not versioned, so the export holds the split's current rows, read at the requested version
      schema:
        type: string
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: The rows, streamed
        content:
          text/csv:
            schema:
              type: string
          application/x-ndjson:
            schema:
              type: string
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
