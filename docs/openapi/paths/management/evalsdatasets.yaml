    - name: after
      in: query
      required: false
      description: Return row changes after this sequence number
      schema:
        type: integer
        minimum: 0
    - name: limit
      in: query
      required: false
      description: Page size. 0 or absent means 100; a value above 200 is read as 200
      schema:
