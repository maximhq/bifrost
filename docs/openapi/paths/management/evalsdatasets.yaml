    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Edit many cells
    description: |
      Applies one spreadsheet edit that touches many cells, such as a paste or a range delete. It changes cells of up to 1,000 existing rows and appends up to 1,000 new rows, all in one transaction: if any cell is invalid, nothing is changed.
