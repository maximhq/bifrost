datasets-rows-from-logs:
  post:
    operationId: addEvalDatasetRowsFromLogs
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Add rows from logs
    description: |
      Adds one row per request log, filled by column type: the last user message as the input, the earlier messages as the conversation history, the reply as the output and the tool calls the model made as the expected tool calls. Logs that are missing or were stored without content are skipped and listed. The added rows are saved as a new version. Needs a log store.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetFromLogsRequest
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetCurateResult
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
