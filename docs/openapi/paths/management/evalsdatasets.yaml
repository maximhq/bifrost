# Dataset paths

datasets:
  get:
    operationId: listEvalDatasets
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List datasets
    description: |
      Returns datasets, newest first, each with its column, row and split counts.
    tags:
    - Datasets
    parameters:
    - name: search
      in: query
      required: false
      description: Case-insensitive match on name or description
      schema:
        type: string
    - name: tag
      in: query
      required: false
      description: Only datasets with this exact tag
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size, 1 to 200. Defaults to 50
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      description: Number of datasets to skip
      schema:
        type: integer
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetListResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  post:
    operationId: createEvalDataset
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Create a dataset
    description: |
      Creates a dataset. Columns come from `columns`, from a `template` (qa, retrieval or agent), from both, or are added later.
    tags:
    - Datasets
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '409':
        $ref: ../../openapi.yaml#/components/responses/Conflict
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
