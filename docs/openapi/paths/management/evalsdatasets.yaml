        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Download a file
    description: |
      Returns an uploaded file's bytes. PNG, JPEG, GIF, WebP, AVIF and BMP images are served to be shown in place. Every other type, SVG and HTML included, is served as a download, so an uploaded file never runs as a page of the gateway.
    tags:
