datasets-rows:
  get:
    operationId: listEvalDatasetRows
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List rows
    description: |
      Returns a page of rows in order. Paging is by `after`, the `next_after` of the previous page, so a late page costs the same as the first.
    tags:
    - Datasets
    parameters:
    - *id001
    - &id004
      name: version
      in: query
      required: false
      description: A saved version number to read. Leave out to read the draft
      schema:
        type: integer
    - name: split
      in: query
      required: false
      description: Only rows in this split (a split ID)
      schema:
        type: string
    - name: search
      in: query
      required: false
      description: Case-insensitive match on any cell
      schema:
        type: string
    - name: after
      in: query
      required: false
      description: Return rows after this sequence number. Use it to walk the whole dataset
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      description: Skip this many rows, to read a page by row position. Cannot be combined with after
      schema:
        type: integer
        minimum: 0
    - name: limit
      in: query
      required: false
      description: Page size, 1 to 200. Defaults to 100
      schema:
        type: integer
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetRowsPage
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  post:
    operationId: addEvalDatasetRows
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Add rows
    description: |
      Appends up to 1,000 rows. Each row maps a column ID or a column name to a cell value. A cell of an `expected_tool_calls`, `conversation_history` or `tags` column must be valid JSON.
    tags:
    - Datasets
    parameters:
    - *id001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetAddRowsRequest
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsdatasets.yaml#/DatasetWriteResult
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
