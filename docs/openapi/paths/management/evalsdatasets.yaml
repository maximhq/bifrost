    operationId: updateEvalDatasetColumn
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update a column
    description: |
      Renames or retypes a column. Saved versions keep the column as it was. Changing the type to a structured one (`expected_tool_calls`, `conversation_history`, `tags`, `file`) checks every cell of the draft. If any cell does not fit the new type, the call fails with 400 and nothing changes. Cells that fit are rewritten in the new type's form, so a URL list becomes a JSON list of file references. Saved versions keep their cells.
