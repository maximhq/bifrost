plugins-builtins:
  get:
    operationId: listBuiltinPlugins
    summary: List built-in plugin names
    description: |
      Returns the canonical list of built-in plugin names available in this Bifrost build.
      Use this to discover which plugins can be enabled without supplying a custom binary.
    tags:
      - Plugins
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Built-in plugin names retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                plugins:
                  type: array
                  description: Canonical names of built-in plugins
                  items:
                    type: string
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

plugins:
  get:
    operationId: listPlugins
    summary: List all plugins
    description: |
      Returns a list of all plugins with their configurations and status.
      The `actualName` field contains the plugin name from `GetName()` (used as the map key),
      while `name` contains the display name from the configuration.
      The `types` array in the status shows which interfaces the plugin implements (llm, mcp, http).
    tags:
      - Plugins
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/plugins.yaml#/ListPluginsResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createPlugin
    summary: Create a new plugin
    description: |
      Creates a new plugin with the specified configuration.
      Setting `path` on a non-builtin plugin loads native code (a .so, via dlopen) into the
      gateway process and requires genuine admin authentication - it is refused with 403 if
      dashboard authentication is disabled or unconfigured, even though other management
      endpoints remain reachable in that state. Only `http`/`https` URLs are fetched for
      remote paths, and by default only ones resolving to a public address; private,
      loopback, link-local, and CGNAT addresses are additionally allowed if explicitly
      listed in the deploy-time `server.plugin_download_private_allowlist` config. Local
      filesystem paths are unaffected.
    tags:
      - Plugins
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/plugins.yaml#/CreatePluginRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '201':
        description: Plugin created successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/plugins.yaml#/PluginResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A non-builtin path was supplied and dashboard authentication is disabled or
          unconfigured (the request was not genuinely authenticated)
      '409':
        description: Plugin already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

/plugins/{name}:
  get:
    operationId: getPlugin
    summary: Get a specific plugin
    description: |
      Returns the configuration for a specific plugin.
      The response includes the plugin status with types array showing which interfaces
      the plugin implements (llm, mcp, http). The `actualName` field shows the plugin name
      from GetName() (used as the map key), which may differ from the display name (`name`).
    tags:
      - Plugins
    parameters:
      - name: name
        in: path
        required: true
        description: Plugin display name (the config field `name`, not the internal `actualName` from GetName())
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/plugins.yaml#/Plugin'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Plugin not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updatePlugin
    summary: Update a plugin
    description: |
      Updates a plugin's configuration. Will reload or stop the plugin based on enabled status.
      The response `actualName` field shows the plugin name from GetName() (used as the map key),
      which may differ from the display name (`name`).
      Setting `path` on a non-builtin plugin loads native code (a .so, via dlopen) into the
      gateway process and requires genuine admin authentication - it is refused with 403 if
      dashboard authentication is disabled or unconfigured, even though other management
      endpoints remain reachable in that state. Only `http`/`https` URLs are fetched for
      remote paths, and by default only ones resolving to a public address; private,
      loopback, link-local, and CGNAT addresses are additionally allowed if explicitly
      listed in the deploy-time `server.plugin_download_private_allowlist` config. Local
      filesystem paths are unaffected.
    tags:
      - Plugins
    parameters:
      - name: name
        in: path
        required: true
        description: Plugin display name (the config field `name`, not the internal `actualName` from GetName())
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/plugins.yaml#/UpdatePluginRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Plugin updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/plugins.yaml#/PluginResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A non-builtin path was supplied and dashboard authentication is disabled or
          unconfigured (the request was not genuinely authenticated)
      '404':
        description: Plugin not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deletePlugin
    summary: Delete a plugin
    description: Removes a plugin from the configuration and stops it if running.
    tags:
      - Plugins
    parameters:
      - name: name
        in: path
        required: true
        description: Plugin display name (the config field `name`, not the internal `actualName` from GetName())
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Plugin deleted successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Plugin not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
