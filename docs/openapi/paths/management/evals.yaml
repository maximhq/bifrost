evaluators-execute:
  post:
    operationId: executeEvaluator
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Execute evaluator
    description: |
      Runs a saved evaluator on a set of variables. The run is queued, and the call waits for the result up
      to `wait_ms`. An evaluator that calls a model runs on a provider key marked for evaluations, within
      that key's eval concurrency.
      
      Once the run is queued, a missing variable or a failed evaluator is a completed execution whose
      score status is `na` or `error`, not an HTTP error. An evaluator that calls a model returns 422
      when no key is enabled for evaluations on its provider and model, whatever its variables, and
      the rejected execution was stored as completed: the response carries no execution object and no
      model call is made. If the rejection cannot be stored, the call answers 202 with the execution
      instead.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
        required: true
        description: Evaluator ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/evals.yaml#/ExecuteRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/ExecutionResponse'
      '202':
        description: "The execution is stored, but its result is not in this response: the wait ended, a status read failed, or its placement on a queue is still pending (for example, no eval key was found and the rejection could not be stored). It may still run or may already be done. Poll the execution by its ID."
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/ExecutionResponse'
      '422':
        description: The evaluator calls a model, no provider key is enabled for evaluations on that provider and model, and the rejected execution was stored as completed. The response carries no execution object and no model call is made. If the rejection cannot be stored, the call answers 202 with the execution instead.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

