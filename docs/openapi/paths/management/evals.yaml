evaluators-execute:
  post:
    operationId: executeEvaluator
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Execute evaluator
    description: |
      Runs a saved evaluator on a set of variables. The run is queued, and the call waits for the result up
      to `wait_ms`. An evaluator that calls a model runs on a provider key marked for evaluations, within
      that key's eval concurrency.
      
      A missing variable or a failed evaluator is a completed execution whose score status is `na` or
      `error`, not an HTTP error.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
        required: true
        description: Evaluator ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/evals.yaml#/ExecuteRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/ExecutionResponse'
      '202':
        description: The run is still going when the wait ends. Poll the execution for its result.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/ExecutionResponse'
      '422':
        description: The evaluator calls a model and no provider key is enabled for evaluations on that provider and model.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

