    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List evaluation keys
    description: |
      Returns the enabled provider keys marked "use for evaluations", sorted by provider and then name.
      A disabled key is left out even when it is marked.
      An evaluator that calls a model runs only on one of these keys. The list is empty when no key is marked, and also when evaluations cannot run on this gateway (the evaluation queue or its runner failed to start; the gateway log has the reason), whatever the keys say.
    tags:
      - Evaluators
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/ListEvalKeysResponse'
      '500':
