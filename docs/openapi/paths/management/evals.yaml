      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateEvaluator
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update evaluator
    description: |
      Updates name, description and tags in place. A config that differs from the current one is stored as
      a new version; sending the current config back does not create a new version. The type cannot be
      changed.

      Description and tags are replaced by what the request sends, so an omitted description or tag list
      clears the stored one. Resend them to keep them.
      
      A header sent as `<REDACTED>` keeps its stored value only when the stored config has that header and the URL keeps the same scheme, host and port. Otherwise the request is refused (validate answers `valid: false`): send the header value again after changing the endpoint.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
        required: true
        description: Evaluator ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/evals.yaml#/UpdateEvaluatorRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/EvaluatorResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '409':
        $ref: '../../openapi.yaml#/components/responses/Conflict'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteEvaluator
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete evaluator
    description: |
      Deletes an evaluator. Its versions are kept, and its name can be reused.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
        required: true
        description: Evaluator ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/MessageResponse'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

