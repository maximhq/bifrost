# Evaluators paths

evaluators:
  get:
    operationId: listEvaluators
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List evaluators
    description: |
      Returns evaluators, newest first, without their configs.
    tags:
      - Evaluators
    parameters:
      - name: type
        in: query
        required: false
        description: Only evaluators of this type (ai, programmatic, statistical, api, human). Several types separated by commas match any of them
        schema:
          type: string
      - name: source
        in: query
        required: false
        description: Only evaluators written by a user (custom) or installed from the catalog (builtin)
        schema:
          type: string
          enum: [custom, builtin]
      - name: status
        in: query
        required: false
        description: A provider-level check. `no_key` lists evaluators that call a model whose provider has no enabled key marked for evaluations; `ready` lists the rest. `ready` does not promise that a marked key allows the evaluator's model, which is checked when the evaluator runs.
        schema:
          type: string
          enum: [ready, no_key]
      - name: search
        in: query
        required: false
        description: Case-insensitive match on name or description
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Only evaluators with this exact tag
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Page size. Defaults to 50. A value above 200 is clamped to 200; a value below 1 is refused.
        schema:
          type: integer
          minimum: 1
          default: 50
      - name: offset
        in: query
        required: false
        description: Number of evaluators to skip. A negative value is refused.
        schema:
          type: integer
          minimum: 0
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/EvaluatorListResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createEvaluator
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Create evaluator
    description: |
      Creates a custom evaluator with its first version. The config is validated for the given type, and
      for a programmatic evaluator the code is compiled.
      
      Statistical evaluators are not created here: install one from the catalog.
    tags:
      - Evaluators
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/evals.yaml#/CreateEvaluatorRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/evals.yaml#/EvaluatorResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '409':
        $ref: '../../openapi.yaml#/components/responses/Conflict'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

