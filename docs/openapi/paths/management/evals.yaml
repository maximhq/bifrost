        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete evaluator
    description: |
      Deletes an evaluator. Its versions are kept, and its name can be reused.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
