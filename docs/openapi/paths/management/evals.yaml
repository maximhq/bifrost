executions-by-id:
  get:
    operationId: getEvaluatorExecution
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get execution
    description: |
      Returns an execution and, once it has completed, its result.
      A completed execution is kept for at least seven days after it completes. An hourly cleanup deletes it after that, and polling it then answers 404, the same as an unknown ID, so collect the result within seven days.
    tags:
      - Evaluators
    parameters:
      - name: id
        in: path
        required: true
        description: Execution ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
