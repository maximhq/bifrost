virtual-key-users:
  get:
    operationId: listVirtualKeyUsers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List users attached to a virtual key
    tags: [Virtual Keys, Users]
    parameters:
      - name: vk_id
        in: path
        required: true
        schema: { type: string }
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Attached users
        content:
          application/json:
            schema:
              type: object
              required: [users, count]
              properties:
                users:
                  type: array
                  items:
                    $ref: '../../schemas/management/users.yaml#/UserObject'
                count: { type: integer }
  post:
    operationId: attachVirtualKeyUsers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Attach users to a virtual key
    tags: [Virtual Keys, Users]
    parameters:
      - name: vk_id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_ids]
            properties:
              user_ids:
                type: array
                items: { type: string }
              preserve_usage: { type: boolean, default: false }
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Users attached
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'

