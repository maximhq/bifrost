user-virtual-keys:
  get:
    operationId: listUserVirtualKeys
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>

        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `VirtualKeys:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List virtual keys available to a user
    description: |
      Returns every virtual key assigned to the user, independent of access profiles, so
      directly-assigned standalone keys are visible alongside profile-issued ones.
    tags: [Users, Virtual Keys]
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: User virtual keys
        content:
          application/json:
            schema:
              type: object
              properties:
                virtual_keys:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      value: { type: string }
                      is_access_profile_managed:
                        type: boolean
                        description: >
                          True when an access profile governs this key, in which case its policy
                          is edit-locked and changed by editing and propagating the profile.
  post:
    operationId: addUserVirtualKey
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>

        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `VirtualKeys:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Mint an extra virtual key for a user
    description: |
      Issues an additional virtual key for the user.

      Virtual keys are scoped to the **user**, not to any one access profile: what a request may
      do with the key is read from whichever of the user's active profiles grants it, and each of
      those profiles is a separate routing candidate the request may be served by. The user must
      therefore hold at least one access profile — the request returns 404 otherwise — but the key
      is not tied to the profile that happened to be current when it was minted, and it survives
      that profile being detached as long as the user still holds another.
    tags: [Users, Virtual Keys]
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/accessprofiles.yaml#/AddVirtualKeyRequest'
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Virtual key created.
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/accessprofiles.yaml#/AddVirtualKeyResponse'
      '404':
        description: User has no access profiles
      '409':
        description: A virtual key with this name already exists
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

user-vk-creation-policy:
  get:
    operationId: getMyVirtualKeyCreationPolicy
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>

        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `VirtualKeys:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get the calling user's virtual-key creation policy
    description: |
      Resolves the access profile that would govern a virtual key the **calling** user creates,
      returning its name or none. Whether governance applies at all is decided separately from the
      `VirtualKeys:CreateStandalone` permission (see `/api/governance/users/me/permissions`); this
      endpoint only resolves the profile, and the create form combines the two.

      Self-scoped: it always describes the caller and takes no user ID. Returns
      `{"has_access_profile": false}` when the caller has no per-user identity (local admin) or holds
      no active access profile. When several of their profiles qualify, the highest-ranked one governs.
      Holding no profile does not by itself block a caller from creating a key: given
      `VirtualKeys:Create`, the key is created ungoverned.
    tags: [Users, Virtual Keys]
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Virtual-key creation policy for the calling user
        content:
          application/json:
            schema:
              type: object
              required: [has_access_profile]
              properties:
                has_access_profile:
                  type: boolean
                  description: Whether the caller holds an access profile that would govern keys they create.
                profile_name:
                  type: string
                  description: Name of the governing access profile. Present only when `has_access_profile` is true.
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

