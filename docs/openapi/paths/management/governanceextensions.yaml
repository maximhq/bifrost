business-unit-customers:
  get:
    operationId: listBusinessUnitCustomers
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: List customers attached to a business unit
    tags: [Business Units, Customers]
    parameters:
      - name: business_unit_id
        in: path
        required: true
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Attached customers
        content:
          application/json:
            schema:
              type: object
              properties:
                customers:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                count: { type: integer }
                total_count: { type: integer }
                limit: { type: integer }
                offset: { type: integer }
  post:
    operationId: attachBusinessUnitCustomer
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>
    summary: Attach customers to a business unit
    tags: [Business Units, Customers]
    parameters:
      - name: business_unit_id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              customer_id: { type: string }
              customer_ids:
                type: array
                items: { type: string }
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Customers attached
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/MessageResponse'

