budget-request-approve:
  post:
    operationId: approveBudgetRequest
    x-mint:
      metadata:
        tag: Enterprise
      content: |
        <Note>
          This endpoint is available in [Bifrost Enterprise](https://www.getmaxim.ai/bifrost/enterprise) only.
        </Note>

        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `VirtualKeys:Update` | RBAC role or API key scope |
        | `AccessProfiles:Update` | Also required when the request targets an access-profile budget |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Approve a budget increase request
    description: |
      Approves a pending budget increase request and applies the approved amount as an override on the
      target budget. The override is additive: the budget's `max_limit`, `current_usage` and reset schedule
      are unchanged. The status change and the override write happen in one transaction, so a failed write
      leaves the request pending and two approvers can never both apply it.

      The body is optional. `amount`, `mode` and `cycles` default to the values in the request.

      When the budget already has an active override, the approved amount is added to it. A plain add
      (`override_strategy` empty or `add`) needs both to share a lifetime, meaning the same `mode` and, for
      `cycles`, the same number of cycles remaining; otherwise it returns `409`. Use `replace` to drop the
      active override and apply the approved amount and duration on their own, or `add_keep_lifetime` to add
      the amount while keeping the active override's mode and remaining cycles. With `add_keep_lifetime`,
      any `mode` and `cycles` in the body are ignored and the request records the duration actually applied.

      Approvers only see requests for virtual keys and access profiles in their data scope; a request outside
      it returns `404`. An approver cannot decide their own request.
    tags:
      - Governance
    parameters:
      - name: request_id
        in: path
        required: true
        description: Budget request ID
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../schemas/management/governance.yaml#/ApproveBudgetRequestRequest"
          example:
            override_strategy: add_keep_lifetime
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      "200":
        description: Request approved and override applied
        content:
          application/json:
            schema:
              $ref: "../../schemas/management/governance.yaml#/BudgetRequest"
      "400":
        description: |
          Invalid body: malformed JSON, `note` longer than 2000 characters, an unknown `override_strategy`,
          `amount` not greater than 0, `mode` not `cycles` or `forever`, or `cycles` outside 1-120 in
          `cycles` mode.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "401":
        $ref: "../../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: |
          The caller lacks `VirtualKeys:Update`, the request targets an access-profile budget and the caller
          lacks `AccessProfiles:Update`, or the caller is the requester.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "404":
        description: |
          The budget request does not exist or is outside the approver's data scope, or its virtual key,
          access profile or budget no longer exists.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "409":
        description: |
          The request was already decided, the active override's lifetime differs from the approval under a
          plain add, or the override was removed while approving with `add_keep_lifetime`.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "500":
        $ref: "../../openapi.yaml#/components/responses/InternalError"
