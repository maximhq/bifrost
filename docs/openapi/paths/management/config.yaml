config:
  get:
    operationId: getConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get configuration
    description: |
      Retrieves the current Bifrost configuration including client config, framework config,
      auth config, and connection status for various stores.
    tags:
      - Configuration
    parameters:
      - name: from_db
        in: query
        description: If true, fetch configuration directly from the database
        schema:
          type: string
          enum: ["true", "false"]
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/GetConfigResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update configuration
    description: |
      Updates the Bifrost configuration. Supports hot-reloading of certain settings
      like drop_excess_requests. Some settings may require a restart to take effect.
      Creating the very first admin account requires auth_config.setup_token. When an
      admin account already exists but dashboard authentication is disabled, a request
      that re-enables it or changes admin_username / admin_password must carry either
      auth_config.current_password (the stored admin password) or a valid
      auth_config.setup_token; otherwise it is refused with 403. A genuinely
      authenticated session needs neither.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/UpdateConfigRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          auth_config was changed without the required proof: the first admin account
          needs a valid setup_token, and re-enabling authentication or changing the admin
          credentials while dashboard authentication is disabled needs current_password
          or a valid setup_token
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

version:
  get:
    operationId: getVersion
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get version
    description: |
      Returns the current Bifrost version information.
      Unauthenticated by design - `/api/version` is in the auth middleware's system whitelist.
    tags:
      - Configuration
    # Public: system-whitelisted in AuthMiddleware.APIMiddleware().
    security: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/Version'

proxy-config:
  get:
    operationId: getProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get proxy configuration
    description: |
      Retrieves the current global proxy configuration.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/ProxyConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        description: Config store not available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

  put:
    operationId: updateProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update proxy configuration
    description: |
      Updates the global proxy configuration.
      Setting a new proxy url or turning on skip_tls_verify requires a genuinely
      authenticated admin session - it is refused with 403 if dashboard authentication is
      disabled or unconfigured, even though other management endpoints remain reachable in
      that state. Saving other fields with the stored url, disabling the proxy, or turning
      skip_tls_verify off is allowed.
      The url follows the same destination rule as a provider base_url: it must be an http
      or https URL whose host resolves to a routable address. Private and loopback hosts are
      accepted (a self-hosted egress proxy is the normal setup); link-local (for example the
      cloud metadata endpoint) and unspecified addresses are refused with 400.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/ProxyConfig'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Proxy configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A new proxy url was supplied or skip_tls_verify was turned on, and dashboard
          authentication is disabled or unconfigured (the request was not genuinely
          authenticated)
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

force-sync-pricing:
  post:
    operationId: forceSyncPricing
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
