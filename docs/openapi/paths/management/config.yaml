config:
  get:
    operationId: getConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get configuration
    description: |
      Retrieves the current Bifrost configuration including client config, framework config,
      auth config, and connection status for various stores.
    tags:
      - Configuration
    parameters:
      - name: from_db
        in: query
        description: If true, fetch configuration directly from the database
        schema:
          type: string
          enum: ["true", "false"]
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/GetConfigResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update configuration
    description: |
      Updates the Bifrost configuration. Supports hot-reloading of certain settings
      like drop_excess_requests. Some settings may require a restart to take effect.
      Creating the very first admin account requires auth_config.setup_token. When an
      admin account already exists but dashboard authentication is disabled, a request
      that re-enables it or changes admin_username / admin_password must carry either
      auth_config.current_password (the stored admin password) or a valid
      auth_config.setup_token; otherwise it is refused with 403. A genuinely
      authenticated session needs neither. Changing
      client_config.mcp_oauth_private_allowlist also requires an authenticated
      admin session and is refused with 403 while dashboard authentication is off.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/UpdateConfigRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          auth_config was changed without the required proof: the first admin account
          needs a valid setup_token, and re-enabling authentication or changing the admin
          credentials while dashboard authentication is disabled needs current_password
          or a valid setup_token; or client_config.mcp_oauth_private_allowlist was changed
          without an authenticated admin session
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

version:
  get:
    operationId: getVersion
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get version
    description: |
      Returns the current Bifrost version information.
      Unauthenticated by design - `/api/version` is in the auth middleware's system whitelist.
    tags:
      - Configuration
    # Public: system-whitelisted in AuthMiddleware.APIMiddleware().
    security: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/Version'

proxy-config:
  get:
    operationId: getProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get proxy configuration
    description: |
      Retrieves the current global proxy configuration.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/ProxyConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        description: Config store not available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

  put:
    operationId: updateProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update proxy configuration
    description: |
      Updates the global proxy configuration.
      Setting a new proxy url or turning on skip_tls_verify requires a genuinely
      authenticated admin session - it is refused with 403 if dashboard authentication is
      disabled or unconfigured, even though other management endpoints remain reachable in
      that state. Saving other fields with the stored url, disabling the proxy, or turning
      skip_tls_verify off is allowed.
      The url follows the same destination rule as a provider base_url: it must be an http
      or https URL whose host resolves to a routable address. Private and loopback hosts are
      accepted (a self-hosted egress proxy is the normal setup); link-local (for example the
      cloud metadata endpoint) and unspecified addresses are refused with 400.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/ProxyConfig'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Proxy configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: >-
          A new proxy url was supplied or skip_tls_verify was turned on, and dashboard
          authentication is disabled or unconfigured (the request was not genuinely
          authenticated)
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

vector-stores:
  get:
    operationId: listVectorStores
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List vector stores
    description: |
      Lists every vector store config.json configures (the primary vector_store and each
      vector_stores entry), what became of it at startup, and its retention and storage limit.
      Stores themselves are configured in config.json only.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/VectorStoreList'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

vector-store:
  put:
    operationId: updateVectorStoreSettings
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update a vector store's settings
    description: |
      Changes one configured store's retention_days and max_size_mb. A field left out keeps the
      stored value; null resets it to 0. The change lasts across restarts until config.json
      changes that store's value, which then wins. A store that shares another's connection
      follows that store's settings and is refused with 409.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: name
        in: path
        required: true
        description: The store's name.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/UpdateVectorStoreSettingsRequest'
    responses:
      '200':
        description: The store with its new settings
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/VectorStore'
      '400':
        description: A value out of range, not a whole number, or a field that cannot be changed
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '404':
        description: No store with this name is configured
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '409':
        description: The store shares another store's connection; edit that store instead
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        description: Saved, but the settings were not reloaded into memory
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '503':
        description: Config store not available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

