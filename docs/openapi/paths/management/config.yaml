config:
  get:
    operationId: getConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get configuration
    description: |
      Retrieves the current Bifrost configuration including client config, framework config,
      auth config, and connection status for various stores.
    tags:
      - Configuration
    parameters:
      - name: from_db
        in: query
        description: If true, fetch configuration directly from the database
        schema:
          type: string
          enum: ["true", "false"]
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/GetConfigResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  put:
    operationId: updateConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update configuration
    description: |
      Updates the Bifrost configuration. Supports hot-reloading of certain settings
      like drop_excess_requests. Some settings may require a restart to take effect.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/UpdateConfigRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

version:
  get:
    operationId: getVersion
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get version
    description: |
      Returns the current Bifrost version information.
      Unauthenticated by design - `/api/version` is in the auth middleware's system whitelist.
    tags:
      - Configuration
    # Public: system-whitelisted in AuthMiddleware.APIMiddleware().
    security: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/Version'

proxy-config:
  get:
    operationId: getProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get proxy configuration
    description: |
      Retrieves the current global proxy configuration.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/config.yaml#/ProxyConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        description: Config store not available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

  put:
    operationId: updateProxyConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Update proxy configuration
    description: |
      Updates the global proxy configuration.
    tags:
      - Configuration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/config.yaml#/ProxyConfig'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Proxy configuration updated successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

force-sync-pricing:
  post:
    operationId: forceSyncPricing
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Settings:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Force pricing sync
    description: |
      Triggers an immediate pricing sync and resets the pricing sync timer.
    tags:
      - Configuration
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Pricing sync triggered successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        description: Config store not available
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
