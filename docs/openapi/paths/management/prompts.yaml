# Prompt Repository paths

folders:
  get:
    operationId: listFolders
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `PromptRepository:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List folders
    description: |
      Returns all prompt folders.
    tags:
      - Prompt Repository
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                folders:
                  type: array
                  items:
                    $ref: '../../schemas/management/prompts.yaml#/Folder'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

  post:
    operationId: createFolder
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `PromptRepository:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Create folder
    description: |
      Creates a new prompt folder.
    tags:
      - Prompt Repository
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/prompts.yaml#/CreateFolderRequest'
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Folder created
        content:
          application/json:
            schema:
              type: object
              properties:
                folder:
                  $ref: '../../schemas/management/prompts.yaml#/Folder'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

