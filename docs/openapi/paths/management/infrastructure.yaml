# Infrastructure endpoints (WebSocket, MCP Server, Metrics)

websocket:
  get:
    operationId: websocketConnect
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: WebSocket connection
    description: |
      Upgrades to a WebSocket connection for real-time updates.
      Server pushes log events, MCP log events, and store update notifications.
      Heartbeat pings are sent every 30 seconds.

      Every message is an envelope with a `type` discriminator. Two carry
      governance-project state:

      - `store_update` names the resources that changed, so a client holding a
        cached list can refetch it. A project create, edit, delete or member
        change sends `{"type": "store_update", "tags": ["Projects"]}`.
      - `redivision_progress` reports an equal-split project recalculating
        every member's share of every cap. Its `operation_id` matches the
        `redivision_job_id` returned by the project and member routes, and by
        a user deletion, so a client can follow the job it started.

      The message shapes are documented as `StoreUpdateMessage` and
      `RedivisionProgressMessage`; they arrive over the socket rather than as
      an HTTP response body.
    tags:
      - Infrastructure
    parameters:
      - name: ticket
        in: query
        required: false
        description: |
          Single-use WebSocket ticket from `POST /api/session/ws-ticket`. Use this when an
          `Authorization` header cannot be set (browser WebSocket clients).
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
      - SessionCookieAuth: []
    responses:
      "101":
        description: WebSocket upgrade successful
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../../schemas/management/infrastructure.yaml#/StoreUpdateMessage"
                - $ref: "../../schemas/management/infrastructure.yaml#/RedivisionProgressMessage"
              description: >-
                One of the server-pushed message envelopes. Listed here because
                the spec has nowhere else to describe a socket payload.

mcp-server:
  post:
    operationId: mcpServerMessage
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Not RBAC-gated - authorized by the credential below |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: MCP protocol message
    description: |
      Receives a JSON-RPC 2.0 message for the MCP protocol server.
      Returns a JSON-RPC 2.0 response, or null for notifications.
    tags:
      - Infrastructure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: JSON-RPC 2.0 request
            properties:
              jsonrpc:
                type: string
                enum: ["2.0"]
              method:
                type: string
              params:
                type: object
              id:
                oneOf:
                  - type: string
                  - type: integer
    responses:
      "200":
        description: JSON-RPC 2.0 response
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                result:
                  type: object
                error:
                  type: object
                  properties:
                    code:
                      type: integer
                    message:
                      type: string
                id:
                  oneOf:
                    - type: string
                    - type: integer
    security:
      - BearerAuth: []
      - VirtualKeyAuth: []
      - ApiKeyAuth: []
  get:
    operationId: mcpServerSSE
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Not RBAC-gated - authorized by the credential below |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: MCP protocol SSE stream
    description: |
      Opens a Server-Sent Events stream for the MCP protocol server.
      Returns `Content-Type: text/event-stream`.
    tags:
      - Infrastructure
    responses:
      "200":
        description: SSE stream opened
        content:
          text/event-stream:
            schema:
              type: string
    security:
      - BearerAuth: []
      - VirtualKeyAuth: []
      - ApiKeyAuth: []

bifrost-mcp:
  post:
    operationId: bifrostMCPMessage
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Not RBAC-gated - each `tools/call` is authorized by the permission its route requires |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Bifrost MCP message
    description: |
      Receives a JSON-RPC 2.0 message for the Bifrost MCP, which serves this gateway's own
      HTTP API as MCP tools: every operation in this spec except the deprecated ones, the
      routes that cannot be a request/response tool (session and credential endpoints,
      browser OAuth steps, streams and WebSocket upgrades, binary downloads, and the two MCP
      servers themselves) and any route this gateway does not serve. Tools are named after
      their `operationId`. With `client.bifrost_mcp_allow_writes` off, non-GET `/api`
      operations are left out; inference, batch and file routes are served either way.

      The server is stateless Streamable HTTP: every message is a POST, there is no session,
      and `notifications/cancelled` is accepted and ignored. A tool call never streams: the
      `stream` argument is dropped, so the route answers once.

      It takes the same credentials as the management API: the admin login, or a management
      API key. On OSS, while dashboard auth is not active (no admin account, or auth disabled),
      it takes the setup token instead, in the `X-Bifrost-Setup-Token` header only: sent as
      `Authorization: Bearer` it is refused with `401`, and once dashboard auth is enabled the
      setup token is no longer accepted. A virtual key alone is refused with `401`; to use one
      with inference tools, send it in `x-bf-vk` alongside a management credential. Each tool
      call is authorized again by the route it reaches, with the caller's credential.
    tags:
      - Infrastructure
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: JSON-RPC 2.0 request or notification
            properties:
              jsonrpc:
                type: string
                enum: ["2.0"]
              method:
                type: string
                description: MCP method, such as `initialize`, `tools/list` or `tools/call`
              params:
                type: object
              id:
                oneOf:
                  - type: string
                  - type: integer
    responses:
      "200":
        description: JSON-RPC 2.0 response
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                result:
                  type: object
                error:
                  type: object
                  properties:
                    code:
                      type: integer
                    message:
                      type: string
                id:
                  description: The request's id; null on a parse error, when the id could not be read
                  oneOf:
                    - type: string
                    - type: integer
                    - type: "null"
      "202":
        description: Notification accepted; no response body
      "401":
        description: |
          No management credential, or only a virtual key. A virtual-key-only request is
          answered with a message saying to send a management credential alongside it. While
          the OSS setup lock is on, a request without the `X-Bifrost-Setup-Token` header is
          answered with a message asking for it.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "503":
        description: |
          The Bifrost MCP is not loaded: `client.bifrost_url` is unset ("the Bifrost MCP needs
          bifrost_url set"), or the spec named by `framework.pricing.openapi_url` could not be
          loaded yet ("the Bifrost MCP spec is unavailable"; retried in the background).
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
  get:
    operationId: bifrostMCPStream
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Not RBAC-gated - authorized by the credential below |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Bifrost MCP SSE stream (not offered)
    description: |
      The Bifrost MCP has no server-to-client SSE stream, which Streamable HTTP lets a server
      decline. A GET runs the same authentication as POST first: a management credential, or
      the setup token in `X-Bifrost-Setup-Token` while the OSS setup lock is on. Once it is
      admitted, it is answered `405` with `Allow: POST`.
    tags:
      - Infrastructure
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      "401":
        description: |
          No management credential, or only a virtual key, refused before the `405`. A
          virtual-key-only request is answered with a message saying to send a management
          credential alongside it. While the OSS setup lock is on, a request without the
          `X-Bifrost-Setup-Token` header is answered with a message asking for it.
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"
      "405":
        description: The Bifrost MCP serves JSON-RPC over POST only
        headers:
          Allow:
            schema:
              type: string
              enum: ["POST"]
        content:
          application/json:
            schema:
              $ref: "../../schemas/inference/common.yaml#/BifrostError"

metrics:
  get:
    operationId: getMetrics
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Metrics:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Prometheus metrics
    description: |
      Returns Prometheus-formatted metrics for monitoring.
      Registered behind the management auth middleware chain, so a scraper must present
      management credentials (or the route must be added to `client_config.whitelisted_routes`).
    tags:
      - Infrastructure
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      "200":
        description: Prometheus metrics
        content:
          text/plain:
            schema:
              type: string
