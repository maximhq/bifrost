# Infrastructure endpoints (WebSocket, MCP Server, Metrics)

websocket:
  get:
    operationId: websocketConnect
    summary: WebSocket connection
    description: |
      Upgrades to a WebSocket connection for real-time updates.
      Server pushes log events, MCP log events, and store update notifications.
      Heartbeat pings are sent every 30 seconds.

      Every message is an envelope with a `type` discriminator. Two carry
      governance-project state:

      - `store_update` names the resources that changed, so a client holding a
        cached list can refetch it. A project create, edit, delete or member
        change sends `{"type": "store_update", "tags": ["Projects"]}`.
      - `redivision_progress` reports an equal-split project recalculating
        every member's share of every cap. Its `operation_id` matches the
        `redivision_job_id` returned by the project and member routes, and by
        a user deletion, so a client can follow the job it started.

      The message shapes are documented as `StoreUpdateMessage` and
      `RedivisionProgressMessage`; they arrive over the socket rather than as
      an HTTP response body.
    tags:
      - Infrastructure
    responses:
      '101':
        description: WebSocket upgrade successful
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../../schemas/management/infrastructure.yaml#/StoreUpdateMessage'
                - $ref: '../../schemas/management/infrastructure.yaml#/RedivisionProgressMessage'
              description: >-
                One of the server-pushed message envelopes. Listed here because
                the spec has nowhere else to describe a socket payload.

mcp-server:
  post:
    operationId: mcpServerMessage
    summary: MCP protocol message
    description: |
      Receives a JSON-RPC 2.0 message for the MCP protocol server.
      Returns a JSON-RPC 2.0 response, or null for notifications.
    tags:
      - Infrastructure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: JSON-RPC 2.0 request
            properties:
              jsonrpc:
                type: string
                enum: ["2.0"]
              method:
                type: string
              params:
                type: object
              id:
                oneOf:
                  - type: string
                  - type: integer
    responses:
      '200':
        description: JSON-RPC 2.0 response
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                result:
                  type: object
                error:
                  type: object
                  properties:
                    code:
                      type: integer
                    message:
                      type: string
                id:
                  oneOf:
                    - type: string
                    - type: integer
    security:
      - BearerAuth: []
      - BasicAuth: []
      - VirtualKeyAuth: []
      - ApiKeyAuth: []
  get:
    operationId: mcpServerSSE
    summary: MCP protocol SSE stream
    description: |
      Opens a Server-Sent Events stream for the MCP protocol server.
      Returns `Content-Type: text/event-stream`.
    tags:
      - Infrastructure
    responses:
      '200':
        description: SSE stream opened
        content:
          text/event-stream:
            schema:
              type: string
    security:
      - BearerAuth: []
      - BasicAuth: []
      - VirtualKeyAuth: []
      - ApiKeyAuth: []

metrics:
  get:
    operationId: getMetrics
    summary: Prometheus metrics
    description: Returns Prometheus-formatted metrics for monitoring.
    tags:
      - Infrastructure
    responses:
      '200':
        description: Prometheus metrics
        content:
          text/plain:
            schema:
              type: string

websocket-responses:
  get:
    operationId: websocketResponses
    summary: WebSocket Responses API
    description: |
      Upgrades to a WebSocket connection for the streaming Responses API.
      Clients send `response.create` events and receive streaming response events.
      Supports authentication via Bearer token, x-api-key, or x-bf-vk headers.
    tags:
      - Infrastructure
    responses:
      '101':
        description: WebSocket upgrade successful
