# Warp Agent API

warp-config:
  get:
    operationId: getWarpConfig
    summary: Read Warp configuration
    description: |
      Returns Warp's settings for the settings page. The stored provider
      credential is never included — only `api_key_set`, reporting whether one
      exists.

      A deployment that has never configured Warp gets `200` with
      `configured: false` and the default values, not a `404`. The settings page
      needs to render its empty form, and a `404` would make "never set up"
      indistinguishable from "this build has no Warp route".
    tags:
      - Warp
    responses:
      '200':
        description: Warp configuration
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/warp.yaml#/WarpConfig'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'
    security:
      - ManagementBearerAuth: []
  put:
    operationId: updateWarpConfig
    summary: Update Warp configuration
    description: |
      Writes Warp's settings. **Administrators only.**

      RBAC in this transport is enterprise-only and path-based, so the floor is
      enforced in the handler: a single write plants a credential that the
      server then uses to make outbound calls, which is not something an
      ordinary dashboard user should be able to do. Non-admin callers get `403`.

      Omitting `api_key` leaves the stored credential unchanged; sending an
      empty string clears it. See the schema for why the two are distinct.
    tags:
      - Warp
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/warp.yaml#/WarpConfigInput'
    responses:
      '200':
        description: The updated configuration, with the credential redacted
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/warp.yaml#/WarpConfig'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '403':
        description: Caller is not an administrator
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'
    security:
      - ManagementBearerAuth: []

warp-chat:
  post:
    operationId: warpChat
    summary: Ask Warp a question
    description: |
      Runs Warp's agent loop over the deployment's telemetry and returns an
      answer.

      **This route exists only where Warp can work.** It is not registered when
      the deployment has no logging plugin, because Warp's tools would have
      nothing to read. A `404` therefore means "this deployment has no log
      store", not "wrong URL" - a route that registered and always failed would
      tell the dashboard the feature was present and only reveal otherwise after
      a user typed a question.

      Conversation history is client-sent and no session is stored: the dashboard
      already holds the thread, so a server-side session would need TTLs, cleanup
      and cross-node coordination for no user-visible gain.

      **Data visibility equals the caller's own.** Every tool query runs against
      the caller's row-level scope, so Warp can never surface data the caller
      could not already retrieve from the logs API directly.

      With `stream: true` (the default) the response is `text/event-stream`. Both
      modes run the identical loop; only the sink differs.
    tags:
      - Warp
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/warp.yaml#/WarpChatRequest'
    responses:
      '200':
        description: |
          The answer. `text/event-stream` when streaming, otherwise a single JSON
          body.

          SSE frames are `event: <type>` with a JSON payload. Types are `start`,
          `delta` (an answer fragment), `tool_call_start`, `tool_call_end`,
          `error` and `done`.

          **`error` is terminal and is never followed by `done`.** A client that
          treats `done` as the only completion signal will read a failed request
          as a successful one, so both must end the stream.
        content:
          text/event-stream:
            schema:
              type: string
          application/json:
            schema:
              $ref: '../../schemas/management/warp.yaml#/WarpChatResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '413':
        description: Conversation exceeds the server's history limit
      '503':
        description: Warp is not configured or has no model client
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/warp.yaml#/WarpUnavailable'
    security:
      - ManagementBearerAuth: []
