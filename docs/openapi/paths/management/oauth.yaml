oauth-callback:
  get:
    operationId: handleOAuthCallback
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: OAuth callback endpoint
    description: |
      Handles the OAuth provider callback after user authorization.
      This endpoint processes the authorization code and exchanges it for an access token.
      On success, displays an HTML page that closes the authorization window.
    tags:
      - OAuth
    parameters:
      - name: state
        in: query
        required: true
        description: State parameter for OAuth security (CSRF protection)
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: |
          Authorization code from the OAuth provider. Present on success only;
          `code` and `error` are mutually exclusive — one of them is always set.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: |
          Error code if authorization failed. Mutually exclusive with `code`.
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        description: Error description if authorization failed
        schema:
          type: string
    # Public: hit by the browser after the upstream OAuth provider redirects
    # back, with no cookie/bearer context. Whitelisted server-side; the `state`
    # query parameter provides CSRF protection.
    security: []
    responses:
      '200':
        description: OAuth authorization successful. Returns HTML page that closes the authorization window.
        content:
          text/html:
            schema:
              type: string
      '400':
        description: OAuth authorization failed or missing required parameters
        content:
          text/html:
            schema:
              type: string

oauth-config-status:
  get:
    operationId: getOAuthConfigStatus
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get OAuth config status
    description: |
      Retrieves the current status of an OAuth configuration.
      Shows whether the OAuth flow is pending, authorized, or failed,
      and includes token expiration and scopes if authorized.

      For a reauthorize flow (POST /api/mcp/client/{id}/reauthorize) pass the
      returned flow_id: the config's own status has been "authorized" since the
      client was first verified and never regresses, so only the flow row can
      say whether this particular consent has completed. With flow_id the
      status is pending until the provider redirects back, then authorized,
      failed, or expired.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: OAuth config ID
        schema:
          type: string
      - name: flow_id
        in: query
        required: false
        description: Flow ID from the reauthorize response; resolves the status from that flow row
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: OAuth config status retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/oauth.yaml#/OAuthConfigStatus'
      '404':
        description: OAuth config not found, or flow_id does not belong to this OAuth config
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

oauth-config-by-id:
  delete:
    operationId: revokeOAuthConfig
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Revoke OAuth config
    description: |
      Revokes a server-level OAuth configuration and its associated access token.
      After revocation, the MCP client will no longer be able to use this OAuth token.
      Revocation is not terminal for the client: an admin can restore access by
      redoing consent via POST /api/mcp/client/{id}/reauthorize, which runs
      against the credentials currently stored on the client's OAuth config.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: OAuth config ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: OAuth token revoked successfully
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/SuccessResponse'
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

# ─── MCP Per-User OAuth flow (consent page support) ─────────────────────────
# Two endpoints powering the /workspace/mcp-sessions/auth?flow=<id> consent
# page. The Bifrost backend mints the flow when a per-user OAuth tool call
# fires its inline-401; the page calls flowDetail to render the binding, then
# flowStart to retrieve the upstream provider's authorize URL.

per-user-oauth-flow-detail:
  get:
    operationId: getPerUserOauthFlow
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get per-user OAuth flow detail
    description: |
      Returns the pending OAuth flow row metadata: which MCP client is being
      authorized, which identity (user / VK / session) the resulting token
      will be bound to, and whether an active token already exists for that
      binding (`has_active_token`).

      Requires management API authentication via `Authorization: Bearer <API key>`.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: Flow row ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Flow detail
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/oauth.yaml#/MCPOauthFlowDetail'
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

per-user-oauth-flow-start:
  get:
    operationId: startPerUserOauthFlow
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Any authenticated caller - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Start the upstream OAuth authorization for a pending flow
    description: |
      Reconstructs the upstream provider's authorize URL for a pending OAuth
      flow. The auth-landing page redirects the browser to that URL; the user
      completes upstream auth; the upstream provider redirects back to
      `/api/oauth/callback`, which exchanges the code for tokens server-side
      and stores them against the flow's identity.

      Returns 410 if the flow is no longer pending (expired / completed /
      failed). The caller should restart the original action to get a fresh
      flow.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: Flow row ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Authorize URL
        content:
          application/json:
            schema:
              type: object
              required: [authorize_url]
              properties:
                authorize_url:
                  type: string
                  description: Where to send the browser to complete upstream OAuth
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '410':
        description: Flow is no longer pending; restart the original action
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '503':
        description: OAuth provider not configured
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/common.yaml#/ErrorResponse'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'

# The endpoints above cover upstream MCP OAuth, Bifrost acting as an OAuth
# *client* against external MCP servers (via the per-user-oauth-flow-*
# endpoints above and the /api/mcp/client/* flows). The endpoints below are
# the management side of the inbound surface, where Bifrost acts as an OAuth
# Authorization Server for /mcp callers: the consent page APIs and the
# grants list. The protocol endpoints themselves (/.well-known/*, /oauth2/*)
# are a separate feature and are not documented in this file.

oauth2-sessions:
  get:
    operationId: listOAuth2Sessions
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `MCPGateway:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List OAuth2 grants
    description: |
      Lists the active OAuth2 grants Bifrost has issued to downstream /mcp clients and
      that are visible to the caller, filtered and paginated.
    tags:
      - OAuth
    parameters:
      - name: q
        in: query
        description: Case-insensitive substring matched against the client name or ID and the bound identity.
        schema:
          type: string
      - name: bf_mode
        in: query
        description: Comma-separated identity dimensions to include (user, vk, session). Any other value is rejected with 400.
        schema:
          type: string
          example: user,vk
      - name: virtual_key_id
        in: query
        description: Comma-separated virtual key IDs to include.
        schema:
          type: string
      - name: user_id
        in: query
        description: Comma-separated user IDs to include.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of grants to return. Values above 500 are clamped to 500.
        schema:
          type: integer
          minimum: 1
          default: 50
      - name: offset
        in: query
        description: Number of grants to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Grants visible to the caller
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/mcp.yaml#/OAuth2SessionsListResponse'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

oauth2-session-by-id:
  delete:
    operationId: revokeOAuth2Session
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `MCPGateway:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Revoke an OAuth2 grant
    description: |
      Revokes a downstream OAuth2 grant the caller can see. Revocation is local: the
      grant's tokens stop working on the next request or refresh.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: Grant ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '204':
        description: Grant revoked
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        description: Grant not found, not visible to the caller, or already revoked
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'

oauth2-consent-flow:
  get:
    operationId: getOAuth2ConsentFlow
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | The consent flow's temporary token or a dashboard session - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Get OAuth2 consent flow detail
    description: |
      Returns a pending OAuth2 authorization request for the consent page: the requesting
      client, its redirect URI, the identity modes the caller may consent with, and the
      signed-in user when a dashboard session is present. Returns 410 once the flow has
      been completed or has expired.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: Authorization flow ID
        schema:
          type: string
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Flow detail
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                client_name:
                  type: string
                available_modes:
                  type: array
                  items:
                    type: string
                    enum: [vk, session, user]
                logged_in_user:
                  type: object
                  description: Present when a valid dashboard session accompanies the request
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                expires_at:
                  type: string
                  format: date-time
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '410':
        description: The flow has already been completed or has expired
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'
  put:
    operationId: submitOAuth2ConsentFlow
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | The consent flow's temporary token or a dashboard session - exempt from RBAC |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Submit OAuth2 consent
    description: |
      Consents to a pending OAuth2 authorization request under the chosen identity and
      mints the authorization code. Returns the URL to send the browser to, which carries
      the code back to the client's redirect URI.
    tags:
      - OAuth
    parameters:
      - name: id
        in: path
        required: true
        description: Authorization flow ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mode]
            properties:
              mode:
                type: string
                enum: [vk, session, user]
                description: Identity to bind the grant to. Must be one of the flow's available_modes.
              value:
                type: string
                description: The virtual key value for mode `vk`; empty for `session` and `user`.
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    responses:
      '200':
        description: Consent recorded
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_url:
                  type: string
                  description: Where to send the browser to complete the authorization
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: Session mode was chosen without an authenticated consenting user
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
      '409':
        description: The flow has already been completed
        $ref: '../../openapi.yaml#/components/responses/Conflict'
      '410':
        description: The flow has already been completed or has expired
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
      '500':
        $ref: '../../openapi.yaml#/components/responses/InternalError'
      '503':
        $ref: '../../openapi.yaml#/components/responses/ConfigStoreUnavailable'
