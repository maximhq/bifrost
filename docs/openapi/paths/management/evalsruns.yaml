  post:
    operationId: rerunEvalRun
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Update` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Rerun entries
    description: |
      Runs entries of a finished run again: the failed and stopped ones, all of them, or the listed ones. The run keeps its dataset version, target and evaluators. A run that failed before its rows were planned cannot be rerun: start a new run. A run stopped while it was being planned can be rerun once its planning has ended.
    tags:
    - Test Runs
    parameters:
    - name: id
