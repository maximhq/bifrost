# Test runs: a target run on every row of a dataset version and scored by evaluators.
runs:
  get:
    operationId: listEvalRuns
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List test runs
    description: |
      Returns test runs, newest first, each with its entry counts. A run that finished its entries carries its summary. A run that failed before its rows were planned has none; its `error` says why.
    tags:
    - Test Runs
    parameters:
    - name: search
      in: query
      required: false
      description: Case-insensitive match on the run name
      schema:
        type: string
    - name: status
      in: query
      required: false
      description: "Only runs in this status: queued, running, completed, failed or stopped"
      schema:
        type: string
    - name: dataset_id
      in: query
      required: false
      description: Only runs on this dataset
      schema:
        type: string
    - name: tag
      in: query
      required: false
      description: Only runs with this tag
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: 'Page size. 0 or absent means 50; a value above 200 is read as 200'
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
        minimum: 0
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunListResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  post:
    operationId: createEvalRun
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Start a test run
    description: |
      Starts a run: one target, run on every row of one dataset version, or only on the rows of one split of it when `split_id` is set, and scored by the listed evaluators. When `dataset_version` is 0 or left out, the dataset's unsaved edits are saved as a version first and the run reads that version. A given `dataset_version` is read as it is, and the draft is left alone. The target and the evaluators are copied onto the run. The call returns at once; the entries are created in the background.
    tags:
    - Test Runs
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsruns.yaml#/RunCreateInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '422':
        description: 'Test runs are not available on this gateway: it has no evaluation queue, or the evaluation runner failed to start. The gateway log has the reason.'
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/common.yaml#/ErrorResponse
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
runs-validate:
  post:
    operationId: validateEvalRun
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Check a test run
    description: |
      Checks a run's settings without starting it: a missing dataset or version, an evaluator that needs a variable the run does not provide, a provider with no eval key. The eval key check needs the gateway's evaluation queue. Without one, no key problem is reported, and starting the run fails.
    tags:
    - Test Runs
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsruns.yaml#/RunInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunCheck
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
runs-compare:
  get:
    operationId: compareEvalRuns
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Compare test runs
    description: |
      Puts two to five runs on the same dataset side by side: their summaries, and a page of dataset rows with each run's entry for the row. A row that only some of the runs have is listed with null for the others.
    tags:
    - Test Runs
    parameters:
    - name: ids
      in: query
      required: true
      description: Two to five different run IDs, separated by commas. A repeated ID is compared once, at its first position.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: 'Page size. 0 or absent means 100; a value above 200 is read as 200'
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
        minimum: 0
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunComparison
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
