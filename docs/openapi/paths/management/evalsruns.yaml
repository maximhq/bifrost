run-entries:
  get:
    operationId: listEvalRunEntries
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List entries
    description: |
      Returns a page of a run's entries with their results, by row position.
    tags:
    - Test Runs
    parameters:
    - name: id
      in: path
      required: true
      description: The run ID
      schema:
        type: string
    - name: status
      in: query
      required: false
      description: Only entries in these statuses, separated by commas
      schema:
        type: string
    - name: passed
      in: query
      required: false
      description: Only entries that passed (true) or did not (false)
      schema:
        type: boolean
    - name: search
      in: query
      required: false
      description: Case-insensitive match on the variables or the output
      schema:
        type: string
    - name: baseline
      in: query
      required: false
      description: ID of another run on the same dataset to read the entries against. Each entry then carries that run's entry for the same dataset row in `baseline`.
      schema:
        type: string
    - name: change
      in: query
      required: false
      description: With `baseline`, only entries that scored lower (worse) or higher (better) than the baseline's entry for the same row, on any evaluator both runs have a numeric score for
      schema:
        type: string
        enum: [worse, better]
    - name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunEntriesPage
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
