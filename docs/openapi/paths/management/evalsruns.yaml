run-entries:
  get:
    operationId: listEvalRunEntries
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List entries
    description: |
      Returns a page of a run's entries with their results, by row position.
    tags:
    - Test Runs
    parameters:
    - name: id
      in: path
      required: true
      description: The run ID
      schema:
        type: string
    - name: status
      in: query
      required: false
      description: Only entries in these statuses, separated by commas
      schema:
        type: string
    - name: passed
      in: query
      required: false
      description: Only entries whose verdict is pass (true) or fail (false). Entries with no verdict (not finished, or whose evaluators have no pass rule) match neither.
      schema:
        type: boolean
    - name: search
      in: query
      required: false
      description: Case-insensitive match on the variables or the output
      schema:
        type: string
    - name: baseline
      in: query
      required: false
      description: ID of another run on the same dataset to read the entries against. An entry whose dataset row the baseline run also has then carries that run's entry in `baseline`; an entry without one has no `baseline`.
      schema:
        type: string
    - name: change
      in: query
      required: false
      description: 'With `baseline`, `better` keeps entries with a higher number on any evaluator both runs scored, `worse` a lower one. The comparison is numeric and ignores `reversed`: for a lower-is-better evaluator, `better` means a higher, so worse, score.'
      schema:
        type: string
        enum: [worse, better]
    - name: limit
      in: query
      required: false
      description: 'Page size. 0 or absent means 100; a value above 200 is read as 200'
      schema:
        type: integer
        minimum: 0
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
        minimum: 0
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunEntriesPage
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
