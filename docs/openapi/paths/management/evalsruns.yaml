    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Delete` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Delete a test run
    description: |
      Deletes a run that is not active, with its entries and results. The dataset version it read can then be deleted.
    tags:
    - Test Runs
    parameters:
    - name: id
      in: path
