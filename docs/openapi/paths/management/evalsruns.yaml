# Test runs: a target run on every row of a dataset version and scored by evaluators.
runs:
  get:
    operationId: listEvalRuns
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: List test runs
    description: |
      Returns test runs, newest first, each with its entry counts. A finished run carries its summary.
    tags:
    - Test Runs
    parameters:
    - name: search
      in: query
      required: false
      description: Case-insensitive match on the run name
      schema:
        type: string
    - name: status
      in: query
      required: false
      description: "Only runs in this status: queued, running, completed, failed or stopped"
      schema:
        type: string
    - name: dataset_id
      in: query
      required: false
      description: Only runs on this dataset
      schema:
        type: string
    - name: tag
      in: query
      required: false
      description: Only runs with this tag
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunListResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
  post:
    operationId: createEvalRun
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:Create` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Start a test run
    description: |
      Starts a run: one target, run on every row of one dataset version and scored by the listed evaluators. The dataset's unsaved edits are saved as a version first, and the run reads that version. The target and the evaluators are copied onto the run. The call returns at once; the entries are created in the background.
    tags:
    - Test Runs
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/management/evalsruns.yaml#/RunInput
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunResponse
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
