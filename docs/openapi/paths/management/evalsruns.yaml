runs-compare:
  get:
    operationId: compareEvalRuns
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | `Evaluators:View` | RBAC role or API key scope |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Compare test runs
    description: |
      Puts two to five runs on the same dataset side by side: their summaries, and a page of dataset rows with each run's entry for the row. A row that only some of the runs have is listed with null for the others.
    tags:
    - Test Runs
    parameters:
    - name: ids
      in: query
      required: true
      description: Two to five run IDs, separated by commas
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      description: Rows to skip
      schema:
        type: integer
    security:
    - ManagementBearerAuth: []
    - BasicAuth: []
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: ../../schemas/management/evalsruns.yaml#/RunComparison
      '400':
        $ref: ../../openapi.yaml#/components/responses/BadRequest
      '404':
        $ref: ../../openapi.yaml#/components/responses/NotFound
      '500':
        $ref: ../../openapi.yaml#/components/responses/InternalError
