health:
  get:
    operationId: getHealth
    x-mint:
      content: |
        **Required Permissions**

        | Permission | Granted via |
        | --- | --- |
        | None | Public endpoint - no authentication required |

        [How permissions work](/api/procuring-api-keys#required-permissions)
    summary: Health check
    description: |
      Returns the health status of the Bifrost server. Checks connectivity to config store,
      log store, and vector store if configured.
      Unauthenticated by design - `/health` is in the auth middleware's system whitelist.
    tags:
      - Health
    # Public: system-whitelisted in AuthMiddleware.APIMiddleware().
    security: []
    responses:
      '200':
        description: Server is healthy
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/health.yaml#/HealthResponse'
      '503':
        description: Service unavailable
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
