# Generic Passthrough - /passthrough/{provider}/{path}

generic:
  parameters:
    - name: provider
      in: path
      required: true
      description: Name of a custom provider whose `base_provider_type` is `generic`.
      schema:
        type: string
    - name: path
      in: path
      required: true
      description: >-
        Upstream path appended to the provider's `network_config.base_url`, slashes included
        (`v1/items/42`). OpenAPI path templating cannot express a catch-all segment, so a
        generated client must send the nested path verbatim, not percent-encode its slashes.
        The query string is forwarded byte for byte, with one exception: under query auth the
        caller's copy of the auth parameter is removed and the selected key is appended, and a
        query that cannot be parsed is refused with `400`.
      schema:
        type: string
  post:
    operationId: genericPassthroughPost
    summary: Relay a request to a generic (non-LLM) provider
    description: |
      Relays the request byte for byte to the generic provider named in the path. Bifrost strips
      caller credentials, injects the key it selects from the provider's key pool per the provider's
      `generic_config.auth`, pins the upstream host to the provider's base URL, and returns the
      upstream status, headers and body unchanged. Every call runs the plugin pipeline and is logged
      with its raw bodies. A `2xx` on a billable route (`POST` by default, or any route with
      `billable: true`) reports usage so governance counts it as one request and charges
      `cost_per_request`, any unit price and any cost the usage mapping extracts; non-2xx responses
      and non-billable routes report none.

      `GET`, `PUT`, `PATCH`, `DELETE` and `HEAD` are relayed the same way. A request is served by the
      streaming relay when the matching route says so, a `generic_config.streaming.paths` glob
      matches, `Accept: text/event-stream` is sent (when `detect_from_accept_header` is on), or the
      JSON body carries `"stream": true` (when `detect_from_body` is on). The path's wording is
      never a signal.

      With `strict_routes` on, an operation that matches no `routes[]` entry is refused with `404`
      before anything is forwarded.
    tags:
      - Generic Passthrough Integration
    security:
      - BearerAuth: []
      - VirtualKeyAuth: []
    requestBody:
      required: false
      description: Forwarded unchanged. For JSON bodies the model is read from `generic_config.usage.model_path` (default `model`) for governance.
      content:
        '*/*':
          schema:
            type: string
            format: binary
    responses:
      '200':
        description: The upstream response, relayed unchanged. Bifrost adds `x-bifrost-provider`, `x-bifrost-request-id` and `x-bifrost-passthrough-path`.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      '400':
        $ref: '../../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../../openapi.yaml#/components/responses/NotFound'
  get:
    operationId: genericPassthroughGet
    summary: Relay a GET request to a generic provider
    description: Same relay as the POST form; the query string is forwarded unchanged.
    tags:
      - Generic Passthrough Integration
    security:
      - BearerAuth: []
      - VirtualKeyAuth: []
    responses:
      '200':
        description: The upstream response, relayed unchanged.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      '404':
        $ref: '../../../openapi.yaml#/components/responses/NotFound'
  put:
    operationId: genericPassthroughPut
    summary: Relay a PUT request to a generic provider
    description: Same relay as the POST form.
    tags:
      - Generic Passthrough Integration
    security:
      - BearerAuth: []
      - VirtualKeyAuth: []
    requestBody:
      required: false
      description: Forwarded unchanged.
      content:
        '*/*':
          schema:
            type: string
            format: binary
    responses:
      '200':
        description: The upstream response, relayed unchanged.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      '400':
        $ref: '../../../openapi.yaml#/components/responses/BadRequest'
      '404':
        $ref: '../../../openapi.yaml#/components/responses/NotFound'
  patch:
