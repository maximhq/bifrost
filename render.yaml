# Render Blueprint for Bifrost.
#
# "Deploy to Render" reads this file from the repository root and creates one
# web service running the published Bifrost image plus one Render Postgres
# database. Secrets are generated by Render on first sync; the Postgres
# connection values are wired from the database definition below, so nothing
# sensitive lives in this file.
#
# Enterprise: point image.url at the registry path Maxim issued for your
# organization and add `registryCredential: { fromRegistryCreds: { name: ... } }`
# after creating that credential in the Render dashboard. Nothing else changes.
#
# The image tag is pinned and bumped by the release pipeline
# (.github/workflows/scripts/bump-deploy-image-tags.sh).
services:
  - type: web
    name: bifrost
    runtime: image
    image:
      url: docker.io/maximhq/bifrost:v2.5.0
    plan: starter
    region: oregon
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      # Same document as deploy/config.postgres.json. The entrypoint writes it
      # to /app/data/config.json on first boot; every value is an env reference.
      - key: BIFROST_CONFIG_JSON
        value: |
          {
            "$schema": "https://www.getbifrost.ai/schema",
            "encryption_key": "env.BIFROST_ENCRYPTION_KEY",
            "setup_token": "env.BIFROST_SETUP_TOKEN",
            "client": { "enforce_auth_on_inference": true },
            "config_store": {
              "enabled": true,
              "type": "postgres",
              "config": {
                "host": "env.PG_HOST",
                "port": "env.PG_PORT",
                "user": "env.PG_USER",
                "password": "env.PG_PASSWORD",
                "db_name": "env.PG_DATABASE",
                "ssl_mode": "env.PG_SSL_MODE"
              }
            },
            "logs_store": {
              "enabled": true,
              "type": "postgres",
              "config": {
                "host": "env.PG_HOST",
                "port": "env.PG_PORT",
                "user": "env.PG_USER",
                "password": "env.PG_PASSWORD",
                "db_name": "env.PG_DATABASE",
                "ssl_mode": "env.PG_SSL_MODE"
              }
            }
          }
      - key: BIFROST_ENCRYPTION_KEY
        generateValue: true
      - key: BIFROST_SETUP_TOKEN
        generateValue: true
      - key: PG_SSL_MODE
        value: prefer
      - key: PG_HOST
        fromDatabase:
          name: bifrost-db
          property: host
      - key: PG_PORT
        fromDatabase:
          name: bifrost-db
          property: port
      - key: PG_USER
        fromDatabase:
          name: bifrost-db
          property: user
      - key: PG_PASSWORD
        fromDatabase:
          name: bifrost-db
          property: password
      - key: PG_DATABASE
        fromDatabase:
          name: bifrost-db
          property: database

databases:
  - name: bifrost-db
    databaseName: bifrost
    user: bifrost
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
