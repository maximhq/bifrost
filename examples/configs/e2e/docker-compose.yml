services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.0
    container_name: bifrost-weaviate
    # Bound to loopback: anonymous access is enabled below, so a published port
    # would let anything that can reach this host read and write the vector
    # store without a credential. The E2E stack only ever talks to it locally.
    ports:
      - "127.0.0.1:9000:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bifrost_network

networks:
  bifrost_network:
    driver: bridge

volumes:
  weaviate_data:
    driver: local