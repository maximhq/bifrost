# Drop-in for a bifrost.service that runs bifrost-http directly:
#   /etc/systemd/system/bifrost.service.d/tls.conf
# Serves HTTPS on 443 with the certificate bifrost-cert.sh installs, and keeps
# plain HTTP on the service's existing -port for local callers and health checks.
[Service]
Environment=BIFROST_TLS_CERT=/etc/bifrost/tls/tls.crt
Environment=BIFROST_TLS_KEY=/etc/bifrost/tls/tls.key
Environment=BIFROST_TLS_PORT=443
# Lets a non-root service user bind port 443. Not needed when running as root.
AmbientCapabilities=CAP_NET_BIND_SERVICE
