[project]
name = "revops-copilot"
version = "0.1.0"
description = "Multi-agent LangGraph example where every LLM, MCP and A2A hop is governed by Bifrost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "azure-identity==1.27.0",
  "httpx==0.28.1",
  "langchain-core==1.7.4",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openai==1.7.3",
  "langgraph==1.2.19",
  "matplotlib==3.11.2",
  "pydantic-settings==2.16.2",
  "pyyaml==6.0.3",
  "reportlab==5.1.0",
  "rich==15.0.0",
  "uvicorn==0.54.0",
]

[project.scripts]
revops = "revops_copilot.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "respx==0.23.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revops_copilot"]

[tool.uv]
# Every dependency must be at least 7 days old when locked.
exclude-newer = "2026-11-03T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
