# Configuration: PostgreSQL for config/logs + Qdrant for vector store
# Usage: helm install bifrost ./bifrost -f values-examples/postgres-qdrant.yaml
#
# SECURITY NOTE: This example contains placeholder values that MUST be replaced
# before deployment. Specifically:
# - PostgreSQL password must be set to a strong, randomly generated value
# - Provider API keys must be replaced with real keys
# See inline comments for specific requirements.

# Storage configuration
storage:
  mode: postgres
  configStore:
    enabled: true
  logsStore:
    enabled: true

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: bifrost
    # REQUIRED: Replace with a strong, randomly generated password
    # Example: Use `openssl rand -base64 32` to generate a secure password
    # Or set via Helm: --set postgresql.auth.password="$(openssl rand -base64 32)"
    password: "REPLACE_ME_WITH_STRONG_PASSWORD"
    database: bifrost
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Deploy Qdrant for vector store
vectorStore:
  enabled: true
  type: qdrant
  qdrant:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Bifrost configuration
bifrost:
  client:
    enableLogging: true
  # The embedding provider for the semantic cache below. Its API key is injected
  # from the Kubernetes secret (semanticCache.secretRef) as SEMANTIC_CACHE_API_KEY.
  providers:
    openai:
      keys:
        - name: "embeddings"
          value: "env.SEMANTIC_CACHE_API_KEY"
          weight: 1
          models: ["text-embedding-3-small"]

  # Enable semantic cache plugin to use Qdrant vector store
  plugins:
    semanticCache:
      enabled: true
      # OpenAI key for the embedding provider, injected as SEMANTIC_CACHE_API_KEY (used by providers.openai above).
      # Create it: kubectl create secret generic bifrost-semantic-cache --from-literal=openai-key=sk-YOUR_OPENAI_KEY
      secretRef:
        name: "bifrost-semantic-cache"
        key: "openai-key"
      config:
        provider: "openai"
        embedding_model: "text-embedding-3-small"
        dimension: 1536
        threshold: 0.8
        ttl: "5m"
