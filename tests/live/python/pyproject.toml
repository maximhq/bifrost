[project]
name = "bifrost-live-sdk-tests"
version = "0.1.0"
description = "GPT Live through Bifrost, driven by the OpenAI Python SDK's live client"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.24.0",
    "websockets==17.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "aiortc>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
addopts = "-p no:cacheprovider"
