[project]
name = "bifrost-tracing-sdk-tests"
version = "0.1.0"
description = "Pushes traces from the Braintrust, Langfuse, Phoenix, Arize and OpenTelemetry SDKs into Bifrost and checks what the Traces API returns"
requires-python = ">=3.11"
dependencies = [
    "pytest==8.4.2",
    "pytest-timeout==2.4.0",
    "requests==2.32.5",
]

[project.optional-dependencies]
# Every SDK except Arize AX shares one environment on the current OpenTelemetry release.
sdks = [
    "braintrust==0.49.2",
    "langfuse==5.1.0",
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation==0.1.75",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
]
# arize-otel 0.14.1 reads HTTPSpanExporter._headers, which OpenTelemetry 1.36 removed, so register()
# crashes on newer releases. It gets its own environment on the last release it works with.
arize = [
    "arize-otel==0.14.1",
    "opentelemetry-sdk==1.35.0",
    "opentelemetry-exporter-otlp-proto-http==1.35.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.35.0",
]

[tool.uv]
package = false
# Dependency versions must be at least 7 days old.
exclude-newer = "2026-11-05T00:00:00Z"
conflicts = [[{ extra = "sdks" }, { extra = "arize" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers", "-p", "no:cacheprovider"]
timeout = 120
