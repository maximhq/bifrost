# Fork only: keeps this fork in step with maximhq/bifrost.
#
# Daily (or on demand) it fast-forwards the `dev` mirror to upstream `dev`, merges upstream into
# `plus`, runs scripts/fork/verify.sh and pushes `plus` when verification passes. When the merge
# conflicts, or the merged tree fails verification (the merge is then pushed to
# `sync/upstream-dev` for inspection), it opens or comments on an issue instead.
#
# Needs a repository secret FORK_SYNC_TOKEN (fine-grained PAT on this repo with Contents,
# Issues and Workflows read/write): the default GITHUB_TOKEN cannot push commits that touch
# .github/workflows, which most upstream syncs do. See FORK.md.
name: Fork - Sync upstream

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into plus
    if: github.repository != 'maximhq/bifrost'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_BRANCH: dev
      MIRROR_BRANCH: dev
      FORK_BRANCH: plus
      FAILED_SYNC_BRANCH: sync/upstream-dev
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML (OpenAPI bundling)
        run: pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        id: sync
        run: |
          set +e
          scripts/fork/sync-upstream.sh \
            --upstream-branch "$UPSTREAM_BRANCH" \
            --mirror "$MIRROR_BRANCH" \
            --branch "$FORK_BRANCH"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 1 ]; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
          fi
          if [ "$status" -eq 2 ]; then
            exit 2
          fi

      - name: Update the dev mirror
        run: git push origin "$MIRROR_BRANCH"

      - name: Push plus
        if: steps.sync.outputs.status == '0'
        run: |
          if [ "$(git rev-list --count "origin/$FORK_BRANCH..HEAD")" -eq 0 ]; then
            echo "$FORK_BRANCH already contains upstream $UPSTREAM_BRANCH"
          else
            git push origin "HEAD:refs/heads/$FORK_BRANCH"
          fi

      - name: Keep the failed merge for inspection
        if: steps.sync.outputs.status == '3'
        run: git push --force origin "HEAD:refs/heads/$FAILED_SYNC_BRANCH"

      - name: Report a sync that needs attention
        if: steps.sync.outputs.status == '1' || steps.sync.outputs.status == '3'
        env:
          STATUS: ${{ steps.sync.outputs.status }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          title="Upstream sync needs attention"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" = "1" ]; then
            files=""
            while IFS= read -r file; do
              files="$files- \`$file\`
          "
            done < "$RUNNER_TEMP/conflicts.txt"
            problem="Merging upstream \`$UPSTREAM_BRANCH\` (\`$UPSTREAM_SHA\`) into \`$FORK_BRANCH\` conflicts in:

          $files"
          else
            problem="Upstream \`$UPSTREAM_BRANCH\` (\`$UPSTREAM_SHA\`) merged into \`$FORK_BRANCH\` cleanly, but \`scripts/fork/verify.sh\` failed, so \`$FORK_BRANCH\` was not updated. The merge is on \`$FAILED_SYNC_BRANCH\`."
          fi
          body="$problem

          Fix it locally (see FORK.md, *Resolving sync conflicts*):

          \`\`\`bash
          git checkout $FORK_BRANCH && git pull
          scripts/fork/sync-upstream.sh
          # resolve or fix, commit, then
          scripts/fork/verify.sh && git push origin $FORK_BRANCH $MIRROR_BRANCH
          \`\`\`

          Run: $run_url"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
