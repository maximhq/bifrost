name: Agent Capability Router Validation

on:
  push:
    branches:
      - feat/agent-capability-router-rebased

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Set up canonical Bifrost workspace
        shell: bash
        run: source .github/workflows/scripts/setup-go-workspace.sh

      - name: Test capability router
        shell: bash
        run: go test -race ./plugins/agentcapabilityrouter/...

      - name: Vet capability router
        shell: bash
        run: go vet ./plugins/agentcapabilityrouter/...
