name: Agent Capability Router Validation

on:
  push:
    branches:
      - feat/agent-capability-router-rebased

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Set up canonical Bifrost workspace
        shell: bash
        run: |
          set -euo pipefail
          source .github/workflows/scripts/setup-go-workspace.sh
          go env GOWORK
          go work edit -json

      - name: Tidy capability router module
        shell: bash
        run: |
          set -euo pipefail
          cd plugins/agentcapabilityrouter
          go mod tidy

      - name: Tidy transports module
        shell: bash
        run: |
          set -euo pipefail
          cd transports
          go mod tidy

      - name: Show module drift
        if: always()
        shell: bash
        run: |
          git status --short -- transports/go.mod transports/go.sum plugins/agentcapabilityrouter/go.mod plugins/agentcapabilityrouter/go.sum
          git diff -- transports/go.mod transports/go.sum plugins/agentcapabilityrouter/go.mod plugins/agentcapabilityrouter/go.sum

      - name: Require tidy module files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- transports/go.mod transports/go.sum plugins/agentcapabilityrouter/go.mod plugins/agentcapabilityrouter/go.sum

      - name: Test capability router
        shell: bash
        run: go test -race ./plugins/agentcapabilityrouter/...

      - name: Test HTTP transport integration
        shell: bash
        run: go test ./transports/bifrost-http/...

      - name: Vet capability router
        shell: bash
        run: go vet ./plugins/agentcapabilityrouter/...
