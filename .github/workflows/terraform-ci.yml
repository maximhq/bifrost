name: Terraform CI

# Static checks for the Terraform module and the one-click examples. Everything
# here runs offline against mocked providers, so it needs no cloud credentials.
#
# Only the test files that target a platform module directly run here. The
# wrapper-based suite (tests/setup) carries the root module's own azurerm
# provider block into a nested module where mock_provider cannot replace it,
# so those runs need an Azure CLI login and stay a local `terraform test`.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "deploy/config.postgres.json"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

env:
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "1"

jobs:
  terraform:
    name: Format, validate and test
    # Pull requests from outside contributors (forks, or authors who are not members
    # or owners of maximhq) cannot get a runner until @maximhq/bifrost-admin approves
    # the run through Review deployments. Everyone else lands on ci-trusted-branch,
    # an environment with no protection rules that only gives the job a name.
    environment: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || !contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)) && 'pr-testing' || 'ci-trusted-branch' }}
    runs-on: builder-8-32
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.terraform.io:443
            releases.hashicorp.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Provider binaries downloaded by terraform init run in this job;
          # they must not inherit the checkout credential.
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      # The examples are new and formatted; the module carries legacy files that
      # `terraform fmt` would rewrite, so the check stays scoped to the examples
      # and the test files.
      - name: Check formatting
        run: |
          terraform fmt -check -recursive terraform/examples
          terraform fmt -check terraform/modules/bifrost/tests/*.tftest.hcl

      - name: Validate the module
        working-directory: terraform/modules/bifrost
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate every example
        run: |
          for dir in terraform/examples/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - name: Run the platform-module tests
        working-directory: terraform/modules/bifrost
        run: |
          terraform test \
            -filter=tests/network_inputs.tftest.hcl \
            -filter=tests/aws_database.tftest.hcl \
            -filter=tests/aws_load_balancer.tftest.hcl \
            -filter=tests/azure_database.tftest.hcl \
            -filter=tests/azure_aci_container.tftest.hcl \
            -filter=tests/gcp_database.tftest.hcl \
            -filter=tests/kubernetes_services.tftest.hcl
