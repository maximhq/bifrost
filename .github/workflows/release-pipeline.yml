  test-bifrost-http:
    needs: [check-skip, detect-changes, build-gateway]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.check-skip.outputs.skip-tests != 'true' && needs.detect-changes.outputs.bifrost-http-needs-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          # bifrost-http binary runs on the host and connects to Postgres via
          # the published port mapping (5432:5432) at 127.0.0.1. harden-runner
          # filters on the post-NAT destination IP, so the published port DNATs
          # to Postgres's pinned bridge IP 172.38.0.11 - that IP:port (not
          # 127.0.0.1:5432) is what must be allowed. The 172.38.0.12 entries are
          # weaviate's pinned bridge IP from
          # .github/workflows/configs/docker-compose.yml (gossip + published
          # 9000->8080). Keep all *.0.11/*.0.12 entries in sync with that file.
          allowed-endpoints: >
            127.0.0.1:5432
            172.38.0.11:5432
            172.38.0.12:8080
            172.38.0.12:8301
            api.cerebras.ai:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.groq.com:443
            api.mistral.ai:443
            api.parasail.io:443
            api.tokenfactory.nebius.com:443
            generativelanguage.googleapis.com:443
            iojs.org:443
