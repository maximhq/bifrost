name: Release Pipeline

# Triggers automatically on push to main when any version file changes
on:
  push:
    branches: ["main", "v2.0.0"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip all tests and jump directly to release (admin only)"
        required: false
        type: boolean
        default: false

# Prevent concurrent runs
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Check if pipeline should be skipped based on first line of commit message
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
      skip-core-test: ${{ steps.check.outputs.skip-core-test }}
      skip-tests: ${{ steps.skip_tests.outputs.skip-tests }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >+
            api.github.com:443

      - name: Check if pipeline should be skipped
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # head_commit is only populated on push. On workflow_dispatch this is
          # empty, so both flags read false there - the dispatch equivalent is the
          # admin-gated skip_tests input below.
          FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n 1)
          if [[ "$FIRST_LINE" == *"--skip-ci"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

          # --skip-core-test drops the two jobs that make live calls to every
          # upstream provider: test-core (the ~90 minute provider harness) and
          # test-core-integrations (the core module's live provider suite). Every
          # other test job still runs, including test-core-unit, so the release is
          # still gated on the whole suite minus the jobs that depend on eight
          # third-party APIs being healthy at that moment.
          #
          # Skipping them does not cascade: every downstream release job already
          # accepts `needs.<job>.result == 'skipped'` alongside 'success' (the
          # same path a bifrost-http-only release takes when test-core never runs).
          #
          # Distinct from --skip-ci, which skips the entire pipeline including the
          # release, and from skip_tests, which drops every test job and is admin-only.
          # This one is deliberately NOT permission-gated: it still ships a release
          # whose unit, integration, migration, docker and API-integration coverage all
          # passed. Use it when a provider outage is blocking a release that has
          # nothing to do with that provider - not to get a red harness out the door.
          if [[ "$FIRST_LINE" == *"--skip-core-test"* ]]; then
            echo "::warning::--skip-core-test found in the commit subject: the live provider jobs (test-core, test-core-integrations) will not run for this release. All other test jobs still gate it."
            echo "skip-core-test=true" >> $GITHUB_OUTPUT
          else
            echo "skip-core-test=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate admin permission for skip_tests
        id: skip_tests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_tests }}" == "true" ]]; then
            PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
            if [[ "$PERMISSION" != "admin" ]]; then
              echo "::error::Only repository admins can use skip_tests=true. ${{ github.actor }} has permission: $PERMISSION"
              exit 1
            fi
            echo "Admin verified: ${{ github.actor }} ($PERMISSION)"
            echo "skip-tests=true" >> $GITHUB_OUTPUT
          else
            echo "skip-tests=false" >> $GITHUB_OUTPUT
          fi

  # Detect what needs to be released
  detect-changes:
    needs: [check-skip]
    runs-on: ubuntu-latest
    # Skip if first line of commit message contains --skip-ci
    if: needs.check-skip.outputs.should-skip != 'true'
    outputs:
      core-needs-release: ${{ steps.detect.outputs.core-needs-release }}
      framework-needs-release: ${{ steps.detect.outputs.framework-needs-release }}
      plugins-need-release: ${{ steps.detect.outputs.plugins-need-release }}
      bifrost-http-needs-release: ${{ steps.detect.outputs.bifrost-http-needs-release }}
      docker-needs-release: ${{ steps.detect.outputs.docker-needs-release }}
      changed-plugins: ${{ steps.detect.outputs.changed-plugins }}
      core-version: ${{ steps.detect.outputs.core-version }}
      framework-version: ${{ steps.detect.outputs.framework-version }}
      transport-version: ${{ steps.detect.outputs.transport-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            _http._tcp.azure.archive.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            _https._tcp.dl.google.com:443
            motd.ubuntu.com:443
            dl.google.com:443
            api.github.com:443
            azure.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            packages.microsoft.com:443
            proxy.golang.org:443
            registry.hub.docker.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Detect what needs release
        id: detect
        run: ./.github/workflows/scripts/detect-all-changes.sh "auto"

      - name: Validate Helm templates
        run: |
          chmod +x .github/workflows/scripts/validate-helm-templates.sh
          .github/workflows/scripts/validate-helm-templates.sh

      - name: Validate Helm config fields
        run: |
          chmod +x .github/workflows/scripts/validate-helm-config-fields.sh
          .github/workflows/scripts/validate-helm-config-fields.sh

      - name: Validate Go ↔ config.schema.json ↔ helm-chart sync (schemasync)
        run: |
          chmod +x .github/workflows/scripts/validate-schema-sync.sh
          .github/workflows/scripts/validate-schema-sync.sh

  # Builds the UI and the bifrost-http binary ONCE, and publishes the binary as
  # an artifact for every test job that just needs a runnable gateway.
  #
  # Before this job existed, nine jobs each built it themselves. Measured on a
  # cli-harness leg: `make build-ui` ~54s, `go build` on bifrost-http ~2m30s -
  # so ~3.5 minutes x 9 jobs, ~30 runner-minutes of duplicated work per run.
  # Consumers now download this artifact and pass SKIP_GATEWAY_BUILD=1, which
  # every build helper honours (harness-gateway.sh, test-api-integrations.sh,
  # cost-accuracy-test.sh, run-migration-tests.sh; load-test.sh already skips
  # when tmp/bifrost-http is present).
  #
  # test-core deliberately does NOT depend on this job. It is the pipeline's
  # longest job (~54m) and therefore its critical path, so making it wait for a
  # build it can do concurrently would push the whole run out by ~4 minutes.
  # It keeps its inline harness_build_gateway call.
  #
  # Gating is the union of the consumers' own conditions - if it were narrower,
  # a consumer could run with no artifact to download and fail at the download
  # step rather than falling back to building.
  build-gateway:
    needs: [check-skip, detect-changes]
    if: |
      needs.check-skip.outputs.should-skip != 'true' &&
      needs.check-skip.outputs.skip-tests != 'true' &&
      (
        needs.detect-changes.outputs.core-needs-release == 'true' ||
        needs.detect-changes.outputs.framework-needs-release == 'true' ||
        needs.detect-changes.outputs.plugins-need-release == 'true' ||
        needs.detect-changes.outputs.bifrost-http-needs-release == 'true' ||
        needs.detect-changes.outputs.docker-needs-release == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          # Build-only: the Go module proxy, the npm registry and the Node/Go
          # toolchain downloads. No provider hosts - nothing is executed here.
          allowed-endpoints: >
            api.github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            iojs.org:443
            nodejs.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Build UI and bifrost-http binary
        run: |
          # The workspace must exist before the build so the transport resolves
          # core/framework/plugins from the checkout rather than the proxy.
          source ./.github/workflows/scripts/setup-go-workspace.sh
          echo "🎨 Building UI..."
          make build-ui
          echo "🔨 Building bifrost-http binary..."
          mkdir -p tmp
          (cd transports/bifrost-http && go build -o ../../tmp/bifrost-http .)
          ls -lh tmp/bifrost-http

      - name: Upload bifrost-http binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bifrost-http-binary
          path: tmp/bifrost-http
          # Consumed within the same run only; no reason to keep it around.
          retention-days: 1
          if-no-files-found: error
          # A ~100MB Go binary compresses poorly, and the CPU spent on level 6
          # costs more than the bytes it saves on the intra-run round trip.
          compression-level: 1

  # Run all tests in parallel before any releases
  #
  # test-core no longer runs the core module's `go test` suite. It validates the
  # core build, then runs the provider harness (tests/e2e/api/collections/provider-harness.json)
  # end-to-end against a locally built bifrost-http binary - see
  # .github/workflows/scripts/test-provider-harness.sh. The harness runs on the
  # host and talks to real provider APIs, so every provider endpoint the
  # collection touches must be allowed below.
  test-core:
    needs: [check-skip, detect-changes]
    # Gated on core alone. The provider harness only exercises core's provider
    # code paths, so a release that does not ship a new core has nothing here to
    # validate and should not pay the ~90 minute critical path for it.
    #
    # This deliberately means a bifrost-http-only release runs no provider
    # harness. Every downstream release job already accepts
    # `needs.test-core.result == 'skipped'`, so the release still proceeds; the
    # transport keeps its own coverage through test-bifrost-http,
    # test-api-integrations and test-migrations. Matches test-cli-harness.
    if: |
      needs.check-skip.outputs.should-skip != 'true' &&
      needs.check-skip.outputs.skip-tests != 'true' &&
      needs.check-skip.outputs.skip-core-test != 'true' &&
      needs.detect-changes.outputs.core-needs-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          # 127.0.0.1:8080 is the bifrost-http binary the harness drives.
          # getbifrost.ai / www.getbifrost.ai serve the pricing datasheet the
          # dbverify newman reporter checks logged costs against.
          # dl.google.com / packages.cloud.google.com / objects.githubusercontent.com
          # are the gcloud CLI install; oauth2.googleapis.com + accounts.google.com
          # are the service-account token exchange for the Vertex parity cells.
          allowed-endpoints: >
            127.0.0.1:8080
            7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443
            accounts.google.com:443
            aiplatform.googleapis.com:443
            api.anthropic.com:443
            api.cerebras.ai:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.fireworks.ai:443
            api.github.com:443
            api.groq.com:443
            api.mistral.ai:443
            api.openai.com:443
            api.parasail.io:443
            api.perplexity.ai:443
            api.replicate.com:443
            api.tokenfactory.nebius.com:443
            api.x.ai:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            bifrost-gateway-resource.openai.azure.com:443
            bedrock-mantle.us-east-1.api.aws:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bifrost-batch-api-file-upload-testing.s3.us-east-1.amazonaws.com:443
            dl.google.com:443
            fal.media:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            generativelanguage.googleapis.com:443
            files.pythonhosted.org:443
            pypi.org:443
            getbifrost.ai:443
            github.com:443
            huggingface.co:443
            iojs.org:443
            login.microsoftonline.com:443
            maxim-o1.openai.azure.com:443
            nodejs.org:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            openrouter.ai:443
            packages.cloud.google.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            router.huggingface.co:443
            storage.googleapis.com:443
            sum.golang.org:443
            us-central1-aiplatform.googleapis.com:443
            www.getbifrost.ai:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Newman
        run: npm install -g newman@6.2.1 newman-reporter-htmlextra@1.23.1

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "575.0.1"

      - name: Run core tests
        env:
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MAXIM_LOGGER_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ARN: ${{ secrets.AWS_ARN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
          VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_BEDROCK_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          BIFROST_ENCRYPTION_KEY: ${{ secrets.BIFROST_ENCRYPTION_KEY }}
          # Additional vars the provider harness forwards to newman:
          # AWS_REGION + GOOGLE_LOCATION drive the direct-provider token-parity
          # calls, the rest back providers exercised by the criss-cross matrix.
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          BEDROCK_GUARDRAIL_IDENTIFIER: ${{ secrets.BEDROCK_GUARDRAIL_IDENTIFIER }}
          BEDROCK_GUARDRAIL_VERSION: ${{ secrets.BEDROCK_GUARDRAIL_VERSION }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
        run: ./.github/workflows/scripts/test-core.sh

      - name: Upload provider harness reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: provider-harness-reports
          path: |
            tmp/newman-report*.json
            tmp/newman-cli*.log
            tmp/provider-harness-report.html
            tmp/harness-failures.md
            tmp/harness-token-parity.md
            tmp/stream-cancel-report.json
            tmp/bifrost-dev.log
            # Per-attempt snapshots, written when a run needed RERUN_FAILED
            # retries. The files above only reflect the LAST attempt, so this is
            # the only record of what the first attempt actually failed on.
            tmp/harness-attempts/
          retention-days: 30

      # Publishes the provider harness's failure breakdown to R2 for the release
      # notes. Note this is markdown, not HTML: the CI run is PARALLEL=1, and the
      # htmlextra report is only produced in sequential mode, so there is no HTML
      # report to publish here. newman-report.json is deliberately excluded - it
      # routinely exceeds 500MB (see tests/e2e/api/runners/lib/read-report.mjs).
      - name: Publish provider harness report
        if: ${{ !cancelled() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          chmod +x ./.github/workflows/scripts/configure-r2.sh ./.github/workflows/scripts/upload-test-reports-to-r2.sh
          ./.github/workflows/scripts/configure-r2.sh || { echo "::warning::R2 not configured; skipping report publish"; exit 0; }
          mkdir -p tmp/provider-harness-report
          # index.html so the R2 key serves as a browsable page, matching the
          # cli-harness reports the changelog links alongside it.
          cp tmp/provider-harness-report.html tmp/provider-harness-report/index.html 2>/dev/null || true
          cp tmp/harness-failures.md tmp/harness-token-parity.md tmp/provider-harness-report/ 2>/dev/null || true
          ./.github/workflows/scripts/upload-test-reports-to-r2.sh \
            "${{ needs.detect-changes.outputs.transport-version }}" \
            "provider-harness" \
            tmp/provider-harness-report

  test-core-integrations:
    needs: [check-skip, detect-changes, build-gateway]
    # skip-core-test drops this alongside test-core: both make live calls to the
    # upstream providers, so a provider outage that blocks one blocks both.
    if: needs.check-skip.outputs.should-skip != 'true' && needs.check-skip.outputs.skip-tests != 'true' && needs.check-skip.outputs.skip-core-test != 'true' && needs.detect-changes.outputs.core-needs-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: &test-core-egress >
            127.0.0.1:8080
            7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443
            accounts.google.com:443
            aiplatform.googleapis.com:443
            api.anthropic.com:443
            api.cerebras.ai:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.fireworks.ai:443
            api.github.com:443
            api.groq.com:443
            api.mistral.ai:443
            api.openai.com:443
            api.parasail.io:443
            api.perplexity.ai:443
            api.replicate.com:443
            api.tokenfactory.nebius.com:443
            api.x.ai:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            bifrost-gateway-resource.openai.azure.com:443
            bedrock-mantle.us-east-1.api.aws:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bifrost-batch-api-file-upload-testing.s3.us-east-1.amazonaws.com:443
            dl.google.com:443
            fal.media:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            generativelanguage.googleapis.com:443
            files.pythonhosted.org:443
            pypi.org:443
            getbifrost.ai:443
            github.com:443
            huggingface.co:443
            iojs.org:443
            login.microsoftonline.com:443
            maxim-o1.openai.azure.com:443
            nodejs.org:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            openrouter.ai:443
            packages.cloud.google.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            router.huggingface.co:443
            storage.googleapis.com:443
            sum.golang.org:443
            us-central1-aiplatform.googleapis.com:443
            www.getbifrost.ai:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Download prebuilt bifrost-http binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bifrost-http-binary
          path: tmp

      - name: Make bifrost-http executable
        run: chmod +x tmp/bifrost-http

      # Backs config.json's sse_mcp client, which test-integrations.sh starts on
      # localhost:3012. Replaces the decommissioned hosted endpoint that config
      # used to reference through MCP_SSE_URL.
      - name: Build MCP test servers
        run: make setup-mcp-tests

      - name: Run core integration tests
        env:
          SKIP_GATEWAY_BUILD: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ARN: ${{ secrets.AWS_ARN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
          VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
          GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
        run: ./.github/workflows/scripts/test-integrations.sh

  test-core-unit:
    needs: [check-skip, detect-changes]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.check-skip.outputs.skip-tests != 'true' && needs.detect-changes.outputs.core-needs-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: *test-core-egress

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      # core/internal/mcptests drives real STDIO MCP servers as child processes.
      # fixtures.go's InitMCPServerPaths only computes their paths
      # (examples/mcps/<name>/bin/<name>, .../dist/index.js) - nothing builds
      # them. Without this step every STDIO-backed case fails with "MCP client
      # ... is disconnected", and the agent permission tests fail one step
      # removed, counting an un-executed tool as still pending approval.
      - name: Build MCP test servers
        run: make setup-mcp-tests

      # No MCP_HTTP_URL / MCP_SSE_URL here on purpose. The remote-transport
      # cases boot examples/mcps/remote-test-server in-process (TestMain in
      # core/internal/mcptests/remoteserver_test.go) and point themselves at
      # localhost, so this job needs no secret and no extra egress entry.
      # Setting those vars here would do nothing - the local server wins unless
      # MCP_USE_REMOTE=1 is also set.
      - name: Run core unit tests
        working-directory: core
        run: |
          packages=()
          while IFS=$'\t' read -r package directory; do
            if [[ "$package" == */internal/llmtests ]]; then
              continue
            fi
            if find "$directory" -maxdepth 1 -name '*_test.go' -exec grep -lq '/internal/llmtests' {} +; then
              echo "Skipping llmtests-backed package: $package"
              continue
            fi
            packages+=("$package")
          done < <(go list -f '{{.ImportPath}}{{"\t"}}{{.Dir}}' ./...)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No core unit-test packages found"
            exit 1
          fi
          go test -timeout 20m "${packages[@]}"

  # Break-glass for a test-core failure that survived its retries.
  #
  # test-core already re-runs its failed items twice via RERUN_FAILED (see
  # test-provider-harness.sh), so reaching this job means three attempts failed
  # - a flaky provider call has largely been ruled out by then. This exists for
  # the case retries cannot fix, e.g. a provider-side outage lasting the whole
  # run. Approving still releases on a red test-core, so prefer fixing forward.
  approve-flaky-test-core:
    needs: [check-skip, detect-changes, test-core]
    if: |
      always() &&
      needs.check-skip.outputs.should-skip != 'true' &&
      needs.check-skip.outputs.skip-tests != 'true' &&
      needs.detect-changes.outputs.core-needs-release == 'true' &&
      needs.test-core.result == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: flaky-test-override
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >+

      - name: Display failed test info
        run: |
          echo "::warning::test-core failed after all RERUN_FAILED retries (3 attempts: 1 full sweep + 2 failed-item re-runs)."
          echo "A transient flake would normally have cleared on retry, so treat this as a real failure by default."
          echo "Check tmp/harness-attempts/ in the provider-harness-reports artifact: if the same items failed on"
          echo "every attempt, it is a regression - reject and fix. Approve only for something retries cannot fix,"
          echo "such as a provider-side outage spanning the whole run."
      - name: Mark as approved
        id: approve
        run: echo "approved=true" >> $GITHUB_OUTPUT

  # Resolves the three most recent published versions of each coding CLI, fresh
  # on every run - nothing is pinned in the repo. Its output fans out into
  # test-cli-harness's matrix below.
  #
  # This exists as its own job so all three legs share ONE npm snapshot. Were
  # each leg to resolve independently, a release landing mid-run would make one
  # leg's latest-1 equal to another's latest, and the run would test the same
  # version twice while reporting three-version coverage.
  resolve-cli-versions:
    needs: [check-skip, detect-changes]
    # Must track test-cli-harness's gate exactly - this job exists only to build
    # that matrix, so running it when the harness is skipped resolves versions
    # nothing consumes.
    if: |
      needs.check-skip.outputs.should-skip != 'true' &&
      needs.check-skip.outputs.skip-tests != 'true' &&
      needs.detect-changes.outputs.core-needs-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            github.com:443
            iojs.org:443
            nodejs.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve CLI versions
        id: resolve
        run: |
          chmod +x ./.github/workflows/scripts/resolve-cli-versions.sh
          ./.github/workflows/scripts/resolve-cli-versions.sh

  # CLI harness - installs the real Claude Code, Codex and OpenCode CLIs and
  # drives them as subprocesses against a live Bifrost, asserting on their
  # non-interactive stream-JSON output (tests/e2e/clis). Scope is deliberately
  # narrow: one model per CLI and a core scenario set. See test-cli-harness.sh
  # for why, and to widen it.
  #
  # Four suites, not three: OpenCode runs twice, once per wire format. The
  # `opencode` suite is chat/completions and the `opencode-responses` suite is
  # /v1/responses against Anthropic-on-Bedrock. Bifrost converts requests
  # separately per wire format, and the Responses conversion had NO coverage
  # until that suite existed - codex is the only other Responses client and it
  # is gated to openai. A reasoning-replay conversion defect shipped on that
  # uncovered path while this job was green.
  #
  # Runs once per CLI version generation (latest, latest-1, latest-2), each an
  # independent job over its own version triple, so a regression can be pinned
  # to a specific upstream release rather than just "the CLIs changed".
  # fail-fast is off: an upstream break in the newest claude must not cancel the
  # legs that would have shown latest-1 and latest-2 still passing.
  #
  # Note that codex floats here too, while tests/e2e/clis/matrix_test.go
  # documents its --image and model_reasoning_effort assertions specifically
  # against rust-v0.145.0. A codex leg failing on those is the signal to go
  # re-check those comments against the newer release.
  #
  # The console shows a progress table refreshed every 10s (one row per CLI:
  # total/done/pass/fail); each suite's verbose output is redirected to
  # tmp/cli-harness-<cli>.log and uploaded with the reports below.
  test-cli-harness:
    needs: [check-skip, detect-changes, resolve-cli-versions, build-gateway]
    # Gated on core alone, matching test-core. What this harness actually covers
    # is core's request/response conversion per wire format, so a release with no
    # new core has nothing here to regress. Downstream release jobs already
    # accept `needs.test-cli-harness.result == 'skipped'`.
    if: |
      needs.check-skip.outputs.should-skip != 'true' &&
      needs.check-skip.outputs.skip-tests != 'true' &&
      needs.detect-changes.outputs.core-needs-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-cli-versions.outputs.matrix) }}
    name: test-cli-harness (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The five run_cases invocations in test-cli-harness.sh each pass
    # TIMEOUT=25m, so the Go suites alone can take 125m on top of the CLI
    # installs, the UI build and the gateway build. A job timeout cancels the
    # run, and the report upload is `if: !cancelled()`, so a cancel loses the
    # harness artifacts too. Raised twice: 90 -> 120 when the opencode suite was
    # added and the core scenarios went multi-turn, 120 -> 150 for the
    # opencode-responses suite, 150 -> 180 for opencode-anthropic.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          # The CLIs run as host subprocesses and reach providers *through*
          # Bifrost at 127.0.0.1:8080, so provider hosts are needed for the
          # gateway's own upstream calls. statsig.anthropic.com and
          # o33249.ingest.sentry.io are Claude Code's telemetry endpoints - it
          # sets CLAUDE_CODE_DISABLE_TELEMETRY=1 but still resolves them on boot.
          #
          # models.dev is OpenCode's provider/model catalog
          # (https://opencode.ai/docs/models/), fetched at startup and cached
          # under XDG_CACHE_HOME - which the harness points at a fresh temp dir
          # per cell (opencodeResume.Start), so every cell re-fetches it rather
          # than hitting a warm cache. OpenCode also resolves its provider SDK,
          # @ai-sdk/openai-compatible, from registry.npmjs.org at runtime (see
          # opencodePreLaunch and https://opencode.ai/docs/providers/); that
          # host is already allowed for the npm installs.
          allowed-endpoints: >
            127.0.0.1:8080
            7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443
            api.anthropic.com:443
            api.cerebras.ai:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.github.com:443
            api.groq.com:443
            api.mistral.ai:443
            api.openai.com:443
            api.parasail.io:443
            api.tokenfactory.nebius.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bifrost-gateway-resource.openai.azure.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            generativelanguage.googleapis.com:443
            getbifrost.ai:443
            github.com:443
            iojs.org:443
            files.pythonhosted.org:443
            openrouter.ai:443
            pypi.org:443
            models.dev:443
            nodejs.org:443
            o33249.ingest.sentry.io:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            statsig.anthropic.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            www.getbifrost.ai:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Built once by build-gateway. All three legs share the same binary, so a
      # regression can never be blamed on one leg having linked a different one.
      - name: Download prebuilt bifrost-http binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bifrost-http-binary
          path: tmp

      # upload-artifact does not preserve the executable bit.
      - name: Make bifrost-http executable
        run: chmod +x tmp/bifrost-http

      - name: Run CLI harness
        env:
          # Tells harness_build_gateway to use tmp/bifrost-http as-is.
          SKIP_GATEWAY_BUILD: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Azure serves both the GPT and the Claude legs of the matrix from one
          # AIServices resource: Bifrost routes OpenAI-family models to
          # /openai/deployments/<name>/chat/completions and Anthropic-family
          # models to /anthropic/v1/messages off the same AZURE_ENDPOINT host
          # (core/providers/azure/azure.go). One endpoint, one key, both wire
          # formats - so no second secret is needed for the claude/azure cells.
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          # Bedrock, for the opencode-responses suite. The harness gateway seeds
          # from tests/integrations/python/config.json, whose bedrock_key_config
          # reads exactly these env vars (the session token matters when the
          # credentials are temporary STS ones). Without them the provider is
          # unconfigured and TestCLIs SKIPS every bedrock cell - silently, and
          # with a green suite, which is the failure mode that let the reported
          # Responses defect ship in the first place.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BIFROST_ENCRYPTION_KEY: ${{ secrets.BIFROST_ENCRYPTION_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Resolved fresh by resolve-cli-versions on every run; the constants
          # in test-cli-harness.sh only apply if that job had to fall back.
          CLAUDE_CODE_VERSION: ${{ matrix.claude }}
          CODEX_VERSION: ${{ matrix.codex }}
          OPENCODE_VERSION: ${{ matrix.opencode }}
          # Distinguishes this leg's section of the shared job summary.
          CLI_VERSION_LABEL: ${{ matrix.label }}
        run: |
          chmod +x ./.github/workflows/scripts/test-cli-harness.sh
          ./.github/workflows/scripts/test-cli-harness.sh

      - name: Upload CLI harness reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          # Per-leg name: upload-artifact rejects a duplicate name outright, so
          # a shared one would fail every leg after the first.
          name: cli-harness-reports-${{ matrix.label }}
          path: |
            tests/e2e/clis/reports/
            tmp/bifrost-cli-harness.log
            tmp/cli-harness-claude.log
            tmp/cli-harness-codex.log
            tmp/cli-harness-opencode.log
            tmp/cli-harness-opencode-responses.log
            tmp/cli-harness-opencode-anthropic.log
            # Per-attempt snapshots, written when a suite needed retries. The
            # reports above are overwritten in place by each rerun, so this is
            # the only record of what the first attempt failed on.
            tmp/cli-harness-attempts/
          retention-days: 30

      # Publishes the same report to R2 so the Mintlify release notes can link
      # it. The artifact above needs a GitHub login and expires; R2 does not.
      # Never fails the job - see the script's header.
      - name: Publish CLI harness report
        if: ${{ !cancelled() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          chmod +x ./.github/workflows/scripts/configure-r2.sh ./.github/workflows/scripts/upload-test-reports-to-r2.sh
          ./.github/workflows/scripts/configure-r2.sh || { echo "::warning::R2 not configured; skipping report publish"; exit 0; }
          ./.github/workflows/scripts/upload-test-reports-to-r2.sh \
            "${{ needs.detect-changes.outputs.transport-version }}" \
            "cli-harness-${{ matrix.label }}" \
            tests/e2e/clis/reports

  test-framework:
    needs: [check-skip, detect-changes]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.check-skip.outputs.skip-tests != 'true' && needs.detect-changes.outputs.framework-needs-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            _grpc_config.cluster.qdrant.io:443
            _grpc_config.localhost:443
            api.cerebras.ai:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.github.com:443
            api.groq.com:443
            api.mistral.ai:443
            api.parasail.io:443
            api.tokenfactory.nebius.com:443
            auth.docker.io:443
            cluster.qdrant.io:443
            cluster.weaviate.network:443
            codecov.io:443
            dl-cdn.alpinelinux.org:443
            generativelanguage.googleapis.com:443
            ghcr.io:443
            github.com:443
            openrouter.ai:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            telemetry.qdrant.io:443
            uploader.codecov.io:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"

      - name: Set up Docker Compose
        run: |
          docker --version
          if ! docker compose version >/dev/null 2>&1; then
            echo "Installing Docker Compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
          else
            echo "Docker Compose plugin is available"
            docker compose version
          fi

      - name: Run framework tests
        env:
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MAXIM_LOGGER_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
