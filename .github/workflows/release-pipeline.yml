            auth.docker.io:443
            codecov.io:443
            cr.weaviate.io:443
            example.com:443
            file.example.com:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            getbifrost.ai:443
            github.com:443
            nodejs.org:443
            openrouter.ai:443
