name: OpenAPI Bundle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openapi-bundle.yml"
      - "docs/openapi/**"
      - "!docs/openapi/openapi.json"

permissions:
  contents: read

jobs:
  bundle-openapi:
    name: Bundle OpenAPI Spec
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Pushes a commit to main, so it mints the app token from the branch-locked release environment.
    environment: oss-release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Mint a one-hour release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Hash-pinned rather than a bare `pip install pyyaml`: this job holds
      # contents: write and pushes a commit, so an unverified install here runs
      # attacker-controlled code with push access. Shares the pin file with
      # workflow-lint.yml.
      - name: Install dependencies
        run: pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Bundle OpenAPI spec
        working-directory: ./docs/openapi
        run: python bundle.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME:-main}"

          git add docs/openapi/openapi.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate openapi.json --skip-ci"
          git push origin "$CURRENT_BRANCH"
