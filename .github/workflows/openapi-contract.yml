name: OpenAPI operationId Contract

# Every non-deprecated /api operation is an MCP tool on /v1/mcp named after its
# operationId. Fail a PR that drops one the last release exposed unless
# transports/changelog.md announces it under a "Breaking" heading.
on:
  pull_request:
    paths:
      - "docs/openapi/**"
      - "!docs/openapi/openapi.json"
      - "!docs/openapi/openapi-oss.json"
      - "transports/changelog.md"
      - ".github/workflows/openapi-contract.yml"
      - ".github/workflows/scripts/check-openapi-operationids*.py"

permissions:
  contents: read

jobs:
  operationid-contract:
    name: operationId contract
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The release tags are the baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Test the check
        run: python .github/workflows/scripts/check-openapi-operationids.test.py

      - name: Check operationIds against the last release
        run: python .github/workflows/scripts/check-openapi-operationids.py
