name: Agent Capability Router Review Fixes

on:
  push:
    branches:
      - feat/agent-capability-router-rebased

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^insert = r'''/insert = '''/" .github/scripts/fix_agent_capability_router_review.py
          sed -i "s/^append = r'''/append = '''/" .github/scripts/fix_agent_capability_router_review.py
          python3 .github/scripts/fix_agent_capability_router_review.py
          gofmt -w \
            plugins/agentcapabilityrouter/extractor.go \
            plugins/agentcapabilityrouter/extractor_test.go \
            transports/bifrost-http/lib/validator_test.go
          python3 -m json.tool docs/docs.json >/dev/null
          python3 -m json.tool transports/config.schema.json >/dev/null

      - name: Set up canonical Bifrost workspace
        shell: bash
        run: |
          set -euo pipefail
          source .github/workflows/scripts/setup-go-workspace.sh
          go env GOWORK

      - name: Test capability router
        shell: bash
        run: go test -race ./plugins/agentcapabilityrouter/...

      - name: Test strict plugin config schema
        shell: bash
        run: go test ./transports/bifrost-http/lib -run TestValidateConfigSchema_AgentCapabilityRouter -count=1

      - name: Test native registration
        shell: bash
        run: go test ./transports/bifrost-http/server -run TestAgentCapabilityRouterIsRegisteredAsBuiltin -count=1

      - name: Vet capability router
        shell: bash
        run: go vet ./plugins/agentcapabilityrouter/...

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '"plugins/agent-capability-router"' docs/docs.json
          grep -q '"const": "agent-capability-router"' transports/config.schema.json

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/fix_agent_capability_router_review.py
          rm .github/workflows/fix-agent-capability-router-review.yml
          git config user.name "Hany alsamman"
          git config user.email "hany@codexc.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -s -m "fix: address agent capability router review feedback"
          git push origin HEAD:feat/agent-capability-router-rebased
