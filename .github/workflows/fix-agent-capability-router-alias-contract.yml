name: Fix agent capability router alias contract

on:
  push:
    branches:
      - feat/agent-capability-router-rebased

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.0'

      - name: Apply alias contract fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "transports/config.schema.json",
              '''                    "aliases": {
                      "type": "object",
                      "description": "Logical automatic model aliases managed by the plugin",
                      "properties": {
                        "main": { "type": "string", "minLength": 1 },
                        "worker": { "type": "string", "minLength": 1 }
                      },
                      "additionalProperties": false
                    },''',
              '''                    "aliases": {
                      "type": "object",
                      "description": "Logical automatic model aliases managed by the plugin",
                      "properties": {
                        "main": { "type": "string", "minLength": 1 },
                        "worker": { "type": "string", "minLength": 1 }
                      },
                      "required": ["main", "worker"],
                      "additionalProperties": false
                    },''',
          )

          replace_once(
              "plugins/agentcapabilityrouter/config.go",
              '''\tif input.Aliases != nil {
\t\tif input.Aliases.Main != "" {
\t\t\tresolved.Aliases.Main = input.Aliases.Main
\t\t}
\t\tif input.Aliases.Worker != "" {
\t\t\tresolved.Aliases.Worker = input.Aliases.Worker
\t\t}
\t}
''',
              '''\tif input.Aliases != nil {
\t\tif input.Aliases.Main == "" || input.Aliases.Worker == "" {
\t\t\treturn resolvedConfig{}, fmt.Errorf("aliases.main and aliases.worker are required when aliases is configured")
\t\t}
\t\tresolved.Aliases = *input.Aliases
\t}
''',
          )

          replace_once(
              "plugins/agentcapabilityrouter/config_test.go",
              '''\t\tAliases:             &AliasConfig{Main: "main-dynamic"},
''',
              '''\t\tAliases:             &AliasConfig{Main: "main-dynamic", Worker: "worker-dynamic"},
''',
          )
          replace_once(
              "plugins/agentcapabilityrouter/config_test.go",
              '''\tif cfg.Aliases.Main != "main-dynamic" || cfg.Aliases.Worker != "agent-worker-auto" {
''',
              '''\tif cfg.Aliases.Main != "main-dynamic" || cfg.Aliases.Worker != "worker-dynamic" {
''',
          )
          replace_once(
              "plugins/agentcapabilityrouter/config_test.go",
              '''\t\t{"duplicate aliases", &Config{Aliases: &AliasConfig{Main: "same", Worker: "same"}}},
''',
              '''\t\t{"empty aliases", &Config{Aliases: &AliasConfig{}}},
\t\t{"partial aliases", &Config{Aliases: &AliasConfig{Main: "only-main"}}},
\t\t{"duplicate aliases", &Config{Aliases: &AliasConfig{Main: "same", Worker: "same"}}},
''',
          )

          validator = Path("transports/bifrost-http/lib/validator_test.go")
          text = validator.read_text()
          anchor = '''\t\t{
\t\t\tname:    "missing config",
\t\t\tconfig:  `{"plugins":[{"enabled":true,"name":"agent-capability-router"}]}`,
\t\t\twantErr: true,
\t\t},
'''
          addition = anchor + '''\t\t{
\t\t\tname:    "empty aliases",
\t\t\tconfig:  `{"plugins":[{"enabled":true,"name":"agent-capability-router","config":{"aliases":{}}}]}`,
\t\t\twantErr: true,
\t\t},
\t\t{
\t\t\tname:    "partial aliases",
\t\t\tconfig:  `{"plugins":[{"enabled":true,"name":"agent-capability-router","config":{"aliases":{"main":"agent-main-auto"}}}]}`,
\t\t\twantErr: true,
\t\t},
'''
          if text.count(anchor) != 1:
              raise SystemExit(f"validator_test.go: expected one insertion anchor, found {text.count(anchor)}")
          validator.write_text(text.replace(anchor, addition, 1))

          replace_once(
              "docs/plugins/agent-capability-router.mdx",
              '''Main and worker aliases must be different. Deterministic aliases such as `agent-main-max`, `agent-main-cheap`, provider-prefixed models, and every unrelated model name are not intercepted.
''',
              '''If `aliases` is configured, both `aliases.main` and `aliases.worker` must be provided, and they must be different. Omitting `aliases` keeps both defaults. Deterministic aliases such as `agent-main-max`, `agent-main-cheap`, provider-prefixed models, and every unrelated model name are not intercepted.
''',
          )
          PY

          gofmt -w plugins/agentcapabilityrouter/config.go plugins/agentcapabilityrouter/config_test.go transports/bifrost-http/lib/validator_test.go
          jq -e . transports/config.schema.json >/dev/null

      - name: Validate focused changes
        run: |
          set -euo pipefail
          source .github/workflows/scripts/setup-go-workspace.sh
          go test -race ./plugins/agentcapabilityrouter/...
          go test ./transports/bifrost-http/lib -run TestValidateConfigSchema_AgentCapabilityRouter -count=1
          go vet ./plugins/agentcapabilityrouter/...
          git diff --check

      - name: Commit validated fix and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-agent-capability-router-alias-contract.yml
          git config user.name "Hany alsamman"
          git config user.email "hany@codexc.com"
          git add transports/config.schema.json \
                  transports/bifrost-http/lib/validator_test.go \
                  plugins/agentcapabilityrouter/config.go \
                  plugins/agentcapabilityrouter/config_test.go \
                  docs/plugins/agent-capability-router.mdx \
                  .github/workflows/fix-agent-capability-router-alias-contract.yml
          git commit -s -m "fix: require complete capability router aliases"
          git push origin HEAD:feat/agent-capability-router-rebased
