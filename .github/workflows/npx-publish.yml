name: NPX Package Publish

on:
  push:
    branches: [main]
    paths: ['npx/**', '.github/workflows/npx-publish.yml']

concurrency:
  group: npx-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [bifrost, bifrost-cli]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            go.dev:443
            dl.google.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify release source identity
        run: bash .github/workflows/scripts/verify-release-source.sh
      - name: Set up Go for the source verifier
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Check and pack the dependency-free launcher
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          node --check "npx/$PACKAGE/bin.js"
          node --test .github/tests/download.test.mjs
          mkdir -p "$RUNNER_TEMP/npm-package"
          (cd "npx/$PACKAGE" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package")
          mv "$RUNNER_TEMP/npm-package/"*.tgz "$RUNNER_TEMP/npm-package/package.tgz"
          bash .github/workflows/scripts/run-security-tool.sh npmartifact "$RUNNER_TEMP/npm-package/package.tgz" "npx/$PACKAGE"
      - name: Store the exact npm tarball
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-${{ matrix.package }}-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: oss-npm-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [bifrost, bifrost-cli]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            nodejs.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            go.dev:443
            dl.google.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - name: Checkout verification policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify release source identity
        run: bash .github/workflows/scripts/verify-release-source.sh
      - name: Download this run's prepared tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-${{ matrix.package }}-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package
      - name: Set up Go for the source verifier
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Independently compare every packaged byte with source
        env:
          PACKAGE: ${{ matrix.package }}
        run: bash .github/workflows/scripts/run-security-tool.sh npmartifact "$RUNNER_TEMP/npm-package/package.tgz" "npx/$PACKAGE"
      - name: Set up publishing toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Publish exact tarball with OIDC only
        env:
          PACKAGE: ${{ matrix.package }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: node .github/workflows/scripts/publish-npm-artifact.mjs "npx/$PACKAGE/package.json" "$RUNNER_TEMP/npm-package/package.tgz"

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        package: [bifrost, bifrost-cli]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
      - name: Checkout release metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify release source identity
        run: bash .github/workflows/scripts/verify-release-source.sh
      - name: Record the published package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          VERSION=$(jq -er .version "npx/$PACKAGE/package.json")
          TAG="npx/$PACKAGE/v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "$PACKAGE v$VERSION" \
            --notes "Published @maximhq/$PACKAGE@$VERSION using trusted publishing from $GITHUB_SHA." "${args[@]}"
