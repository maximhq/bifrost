name: PR Tests (Requires Approval)

on:
  push:
    branches:
      - feat/agent-capability-router-rebased

permissions:
  contents: write

jobs:
  validate-alias-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.27.0"

      - name: Apply reviewed fix
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_agent_capability_alias_fix.py
          gofmt -w plugins/agentcapabilityrouter/config.go plugins/agentcapabilityrouter/config_test.go transports/bifrost-http/lib/validator_test.go
          jq -e . transports/config.schema.json >/dev/null

      - name: Validate focused changes
        run: |
          set -euo pipefail
          source .github/workflows/scripts/setup-go-workspace.sh
          go test -race ./plugins/agentcapabilityrouter/...
          go test ./transports/bifrost-http/lib -run TestValidateConfigSchema_AgentCapabilityRouter -count=1
          go vet ./plugins/agentcapabilityrouter/...
          git diff --check

      - name: Commit fix and restore workflow state
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/pr-tests.yml > .github/workflows/pr-tests.yml
          rm -f .github/workflows/fix-agent-capability-router-alias-contract.yml
          rm -f .github/scripts/apply_agent_capability_alias_fix.py

          git config user.name "Hany alsamman"
          git config user.email "hany@codexc.com"
          git add -A
          git commit -s -m "fix: require complete capability router aliases"
          git push origin HEAD:feat/agent-capability-router-rebased
