name: PR Tests (Requires Approval)

on:
  # Manual trigger only - requires admin to click "Run workflow" button
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR number to test (leave empty for the dispatched branch). Fork PRs are refused."
        required: false
        type: string

# Prevent concurrent test runs on the same PR
concurrency:
  group: pr-tests-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check if pipeline should be skipped based on first line of commit message
  check-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if pipeline should be skipped
        id: check
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n 1)
          if [[ "$FIRST_LINE" == *"--skip-ci"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

  # This job shows up immediately and waits for approval
  run-tests:
    needs: [check-skip]
    if: needs.check-skip.outputs.should-skip != 'true'
    name: Run Tests (Awaiting Approval)
    runs-on: ubuntu-latest

    # Environment with protection rules - requires admin approval
    # Note: You need to configure this environment in repo settings
    environment:
      name: pr-testing
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      # Block, not audit: this job holds every provider secret. Same allowlist as
      # run-core-tests.yml, which runs the same suites.
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1:8080
            7defe2860d5ee49a1e667e1eeea34b25.r2.cloudflarestorage.com:443
            accounts.google.com:443
            aiplatform.googleapis.com:443
            api.anthropic.com:443
            api.cerebras.ai:443
            api.minimax.io:443
            ark.ap-southeast.bytepluses.com:443
            api.cloudflare.com:443
            api.cohere.ai:443
            api.deepseek.com:443
            api.elevenlabs.io:443
            api.fireworks.ai:443
            api.github.com:443
            api.githubcopilot.com:443
            api.business.githubcopilot.com:443
            api.enterprise.githubcopilot.com:443
            api.individual.githubcopilot.com:443
            api.groq.com:443
            api.mistral.ai:443
            api.openai.com:443
            api.parasail.io:443
            api.perplexity.ai:443
            api.replicate.com:443
            api.x.ai:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            bifrost-gateway-resource.openai.azure.com:443
            bedrock-mantle.us-east-1.api.aws:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            bifrost-batch-api-file-upload-testing.s3.us-east-1.amazonaws.com:443
            discoveryengine.googleapis.com:443
            dl.google.com:443
            fal.media:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            generativelanguage.googleapis.com:443
            files.pythonhosted.org:443
            pypi.org:443
            getbifrost.ai:443
            github.com:443
            huggingface.co:443
            iojs.org:443
            login.microsoftonline.com:443
            maxim-o1.openai.azure.com:443
            nodejs.org:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            openrouter.ai:443
            packages.cloud.google.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            router.huggingface.co:443
            storage.googleapis.com:443
            sum.golang.org:443
            us-central1-aiplatform.googleapis.com:443
            www.berkshirehathaway.com:443
            www.getbifrost.ai:443
            api.dev.runwayml.com:443
            api.runware.ai:443
            api.sarvam.ai:443
            api.typesafe.ai:443

      # workflow_dispatch carries no github.event.pull_request, so the PR has to be
      # looked up. Only PRs whose head branch lives in this repository are run:
      # a fork PR's code would otherwise execute with every secret below. To test
      # a fork PR, review it and push that commit to a branch here.
      # The resolver comes from this workflow's own commit, never the requested one.
      - name: Checkout trusted CI scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: .ci-trusted
          sparse-checkout: .github/workflows/scripts
          sparse-checkout-cone-mode: true

      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: ./.ci-trusted/.github/workflows/scripts/resolve-test-ref.sh pr "$PR_NUMBER"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Add comment to PR
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "🧪 Test run approved and starting...

          **Test Suite Includes:**
          - 📦 Core Build Validation
          - 🔌 MCP Test Servers Build
          - 🔧 Core Provider Tests
          - 🛡️ Governance Tests
          - 🔗 Integration Tests

          [View workflow run →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Make test script executable
        run: chmod +x .github/workflows/scripts/run-tests.sh

      - name: Run tests
        env:
          # API Keys for provider tests
          MAXIM_API_KEY: ${{ secrets.MAXIM_API_KEY }}
          MAXIM_LOGGER_ID: ${{ secrets.MAXIM_LOG_REPO_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ARN: ${{ secrets.AWS_ARN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SGL_API_KEY: ${{ secrets.SGL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WORKSPACE_URL: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_COPILOT_API_KEY: ${{ secrets.GITHUB_COPILOT_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          VERTEX_CREDENTIALS: ${{ secrets.VERTEX_CREDENTIALS }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
          VERTEX_GCS_BUCKET: ${{ secrets.VERTEX_GCS_BUCKET }}
          VERTEX_GCS_PREFIX: ${{ secrets.VERTEX_GCS_PREFIX }}
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          REPLICATE_OWNER: ${{ secrets.REPLICATE_OWNER }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "Running tests for ${PR_NUMBER:+PR #}${PR_NUMBER:-manual run}"
          ./.github/workflows/scripts/run-tests.sh

      - name: Report test results
        if: always() && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✅ **All tests passed successfully!**

            All test suites have completed without errors. This PR is ready for review.

            [View detailed results →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ **Tests failed**

            One or more test suites failed. Please review the failures and update your PR.

            [View detailed results →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi