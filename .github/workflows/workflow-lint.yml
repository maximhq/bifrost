name: Workflow Lint

# Guards on the workflow definitions themselves. These run on pull requests because
# that is the only point they CAN run: release-pipeline.yml triggers on push to main,
# so a job added there with a broken egress allowlist would first execute during a
# real release, with the release riding on it.
on:
  pull_request:
  merge_group:
  push:
    branches: [dev, main, v2.0.0]

permissions:
  contents: read

jobs:
  check-egress-allowlist:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            go.dev:443
            dl.google.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Check egress allowlists
        run: ./.github/workflows/scripts/check-egress-allowlist.sh

      - name: Check version-format guard
        run: ./.github/workflows/scripts/version-format.test.sh

      - name: Check module path major versions
        run: ./.github/workflows/scripts/module-major.test.sh

      - name: Check release security policy
        run: bash .github/workflows/scripts/run-security-tool.sh workflowpolicy "$GITHUB_WORKSPACE/.github/workflows"

      - name: Test release security controls
        run: |
          bash .github/tests/configure-r2.test.sh
          bash .github/workflows/scripts/run-security-tool.sh test
